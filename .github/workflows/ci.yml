name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # WebKit, every Monday
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main replaces a run still waiting or running, so the
# queue never backs up and the newest code deploys first.
concurrency:
  # One run at a time per branch: a running test run always finishes (no
  # cancels), and only the NEWEST waiting push runs next (older waiting ones
  # are skipped), so the queue never backs up when several builders push.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:links
      - run: npm run check:ratchet
      - run: npm test
      - run: npm run build
      - run: npm run check:size
      # The build the tests just used is exactly what gets published.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          name: site
          path: dist
          retention-days: 1

  # The Chrome end-to-end specs, split in four so each part finishes well
  # inside the time limit (the whole set takes over an hour on one machine).
  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install chromium (retries if the Ubuntu mirror is down)
        run: |
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "install failed, retry $i"; sleep 45; done
          npx playwright install chromium
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # The Pencil and keyboard specs again in WebKit with an iPad profile (the
  # nearest stand-in for the owner's iPad). It runs beside `checks`, so it adds
  # no waiting time, and the deploy needs it. The list is in
  # playwright.config.ts (project ipad-webkit).
  pencil-webkit:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install webkit (retries if the Ubuntu mirror is down)
        run: |
          for i in 1 2 3; do npx playwright install --with-deps webkit && exit 0; echo "install failed, retry $i"; sleep 45; done
          npx playwright install webkit
      - run: npx playwright test --project=ipad-webkit --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results-ipad-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Publishes the tested build only after every check above has passed on
  # main, then checks the live site. The Cloudflare key is given to the one
  # step that needs it, and nothing runs package install scripts here. The
  # two secrets are set on GitHub by the owner, never in the code. One publish
  # at a time, so an older push can never finish last.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [checks, e2e, pencil-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Stop if the Cloudflare secrets are missing
        env:
          HAS_KEYS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_KEYS" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set on GitHub."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist
      - name: Skip if main has moved on (the newer commit publishes itself)
        id: head
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; echo "Newer commit $HEAD_SHA on main; not publishing $GITHUB_SHA."; fi
      - name: Publish
        if: steps.head.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=learning-notes-app --branch=main
      - name: Check the live site
        if: steps.head.outputs.stale != 'true'
        run: node scripts/check-live.mjs "$GITHUB_SHA"

  # Weekly and a warning only: it takes about 30 minutes, and the known
  # WebKit differences are on the Phase 9 iPad list.
  webkit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install webkit (retries if the Ubuntu mirror is down)
        run: |
          for i in 1 2 3; do npx playwright install --with-deps webkit && exit 0; echo "install failed, retry $i"; sleep 45; done
          npx playwright install webkit
      - run: npm run test:e2e:webkit
