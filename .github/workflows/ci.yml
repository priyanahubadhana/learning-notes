name: CI

# PROBE ONLY (branch probe/g1-frames, never merged; issue 73). This copy of
# ci.yml replaces every job with one measurement job. Nothing deploys.
# On one machine, interleaved: TB-42 (toolbarV8Text.spec.ts:390) and TB-75
# (toolbarV8Tuck.spec.ts:237) on ipad-webkit with every backdrop-filter on or
# off, the trace recording on or off, and device pixel ratio 2 or 1; plus a
# per-screen frame probe (e2e/g1Frames.probe.ts).
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'unused in the probe'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  g1-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Read the exact Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache the WebKit browser
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ steps.pw.outputs.version }}
      - name: Install the system packages for WebKit (when cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - name: Install webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do npx playwright install --with-deps webkit && exit 0; echo "install failed, retry $i"; sleep 45; done
          npx playwright install webkit
      - name: The machine
        run: |
          nproc; lscpu | grep -iE 'model name|^CPU\(s\)|MHz' || true; free -m
          ls /dev/dri 2>&1 || true
      - name: Build once and start the server once
        env:
          E2E: '1'
        run: |
          npm run build
          (npx vite preview --port 5199 --strictPort > preview.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:5199 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5199 > /dev/null && echo server up
      - name: Frames around a real action (Box card open and close), two pages at once
        env:
          PROBE_FILES: g1Frames
          PROBE_TRACE: 'off'
          PROBE_LABEL: action-2w
        run: |
          npx playwright test -c playwright.probe.config.ts --project=ipad-webkit --workers=2 --repeat-each=2 --grep "action frames" --reporter=list --output=results/action 2>&1 | tee -a probe.log | grep -E "G1ACTION|passed|failed|Error" | cut -c1-400 || true
      - name: TB-42 and TB-75, interleaved variants (round 2)
        env:
          PROBE_FILES: 'toolbarV8Text|toolbarV8Tuck'
          PROBE_LOG: '1'
          PROBE_TRACE: 'on'
          GREP: 'TB-42 with tb.textBox|TB-75 bar turned off'
        run: |
          run() { # label lite noanim dsf
            echo "=== VARIANT $1 start $(date +%s)"
            PROBE_LABEL="$1" PROBE_LITE="$2" PROBE_NOANIM="$3" PROBE_DSF="$4"             PLAYWRIGHT_JSON_OUTPUT_NAME="results/$1.json"               npx playwright test -c playwright.probe.config.ts --project=ipad-webkit --workers=2 --repeat-each=2               --grep "$GREP" --reporter=list,json --output="results/$1" > "results/$1.log" 2>&1 || true
            grep -E "PROBEFT|✓|✘|passed|failed" "results/$1.log" | cut -c1-300
            echo "=== VARIANT $1 end $(date +%s)"
          }
          mkdir -p results
          for r in 1 2; do
            if [ $r = 1 ]; then order="A B C D E"; else order="E D C B A"; fi
            for v in $order; do
              case $v in
                A) run "asis-dpr2-r$r" 0 0 "" ;;
                B) run "lite-dpr2-r$r" 1 0 "" ;;
                C) run "lite-dpr1-r$r" 1 0 1 ;;
                D) run "noanim-dpr2-r$r" 0 1 "" ;;
                E) run "asis-dpr1-r$r" 0 0 1 ;;
              esac
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: g1-frames
          path: |
            results
            probe.log
            preview.log
          retention-days: 7
