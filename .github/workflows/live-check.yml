name: Live site check

# Daily: the live site must be the latest commit on main, with its protection
# in place. A failure here (GitHub emails the owner) most likely means
# something other than the deploy job published the site.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - run: node scripts/check-live.mjs "$GITHUB_SHA"
