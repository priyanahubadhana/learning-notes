<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>Book Annotations Mock-up</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat&family=Kalam&family=Lexend&family=Literata&family=Patrick+Hand&family=Shantell+Sans&family=Source+Serif+4&display=swap"
    />
    <style>
      /* ==== shell.css · the ONE shared app shell for every mock-up (12 Nov 2026) ====
   Paste this whole file at the top of a mock's <style>. See shell-spec.md.
   Structure classes are prefixed sh-. Primitives (.btn .seg .sw .ib .badge .glass .track) are the one shared version. */
      :root {
        --canvas: #0f0e13;
        --surface-0: #16151b;
        --surface-1: #1d1c23;
        --surface-2: #25242c;
        --surface-3: #2e2d36;
        --ink: #ecebf2;
        --ink-soft: #b8b6c3;
        --muted: #9a98a6;
        --line: #2a2931;
        --line-strong: #7f7d8c;
        --hover: rgba(255, 255, 255, 0.06);
        --pressed: rgba(255, 255, 255, 0.1);
        --accent: #a08cff;
        --on-accent: #16112e;
        --accent-soft: rgba(160, 140, 255, 0.16);
        --danger: #ff7a6b;
        --success: #5fd39a;
        --warn: #f0b35a;
        --glass-fill: rgba(29, 28, 35, 0.7);
        --glass-line: rgba(255, 255, 255, 0.08);
        --elev-1: 0 0 0 1px rgba(255, 255, 255, 0.06);
        --elev-2: 0 8px 24px rgba(0, 0, 0, 0.4);
        --elev-3: 0 16px 48px rgba(0, 0, 0, 0.55);
        --scrim: rgba(0, 0, 0, 0.48);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.35 0.12 290/0.45),
            transparent 55%
          ),
          radial-gradient(at 90% 10%, oklch(0.32 0.1 255/0.35), transparent 50%);
        --r-xs: 6px;
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 24px;
        --dur-1: 120ms;
        --dur-2: 180ms;
        --dur-3: 240ms;
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --ease-in: cubic-bezier(0.4, 0, 1, 1);
        --sans:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter Variable',
          Inter, system-ui, sans-serif;
        /* shell sizes: change here only */
        --sh-rail: 56px;
        --sh-side: 264px;
        --sh-panel: 264px;
        --sh-top: 52px;
        --sh-tabbar: 56px;
        --sh-gap: 12px;
        --sh-sheet: 440px;
        --sh-hit: 44px;
        --sh-safe-b: env(safe-area-inset-bottom, 0px);
        --sh-bottom: 0px;
        --sh-bar: 0px;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']):not([data-theme='sepia']) {
          --canvas: #f4f3f8;
          --surface-0: #ffffff;
          --surface-1: #fafafc;
          --surface-2: #ffffff;
          --surface-3: #ffffff;
          --ink: #18171c;
          --ink-soft: #4d4b55;
          --muted: #6b6976;
          --line: #eceaf1;
          --line-strong: #8a8796;
          --hover: rgba(24, 23, 28, 0.05);
          --pressed: rgba(24, 23, 28, 0.09);
          --accent: #6941e0;
          --on-accent: #ffffff;
          --accent-soft: rgba(105, 65, 224, 0.1);
          --danger: #c0352b;
          --success: #1a7248;
          --warn: #8f5200;
          --glass-fill: rgba(255, 255, 255, 0.72);
          --glass-line: rgba(255, 255, 255, 0.6);
          --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-2:
            0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
          --scrim: rgba(0, 0, 0, 0.24);
          --wash:
            radial-gradient(
              at 15% 0%,
              oklch(0.92 0.06 290/0.55),
              transparent 55%
            ),
            radial-gradient(
              at 90% 10%,
              oklch(0.93 0.05 250/0.45),
              transparent 50%
            );
          color-scheme: light;
        }
      }
      :root[data-theme='light'] {
        --canvas: #f4f3f8;
        --surface-0: #ffffff;
        --surface-1: #fafafc;
        --surface-2: #ffffff;
        --surface-3: #ffffff;
        --ink: #18171c;
        --ink-soft: #4d4b55;
        --muted: #6b6976;
        --line: #eceaf1;
        --line-strong: #8a8796;
        --hover: rgba(24, 23, 28, 0.05);
        --pressed: rgba(24, 23, 28, 0.09);
        --accent: #6941e0;
        --on-accent: #ffffff;
        --accent-soft: rgba(105, 65, 224, 0.1);
        --danger: #c0352b;
        --success: #1a7248;
        --warn: #8f5200;
        --glass-fill: rgba(255, 255, 255, 0.72);
        --glass-line: rgba(255, 255, 255, 0.6);
        --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-2:
          0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
        --scrim: rgba(0, 0, 0, 0.24);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.92 0.06 290/0.55),
            transparent 55%
          ),
          radial-gradient(
            at 90% 10%,
            oklch(0.93 0.05 250/0.45),
            transparent 50%
          );
        color-scheme: light;
      }
      :root[data-theme='sepia'] {
        --canvas: #f3e9d2;
        --surface-0: #fbf3e0;
        --surface-1: #f7eed8;
        --surface-2: #fbf3e0;
        --surface-3: #fbf3e0;
        --ink: #3b2f1e;
        --ink-soft: #5c4b33;
        --muted: #74644a;
        --line: #e6d8b8;
        --line-strong: #8e7d5e;
        --hover: rgba(59, 47, 30, 0.06);
        --pressed: rgba(59, 47, 30, 0.1);
        --accent: #8a4b1f;
        --on-accent: #fff;
        --accent-soft: rgba(138, 75, 31, 0.12);
        --danger: #b3341f;
        --success: #2f6b3f;
        --warn: #8f5200;
        --glass-fill: rgba(251, 243, 224, 0.78);
        --glass-line: rgba(255, 255, 255, 0.5);
        --elev-1: 0 1px 2px rgba(59, 47, 30, 0.08);
        --elev-2: 0 4px 16px rgba(59, 47, 30, 0.1);
        --elev-3: 0 16px 48px rgba(59, 47, 30, 0.18);
        --scrim: rgba(30, 22, 8, 0.34);
        --wash: radial-gradient(
          at 15% 0%,
          oklch(0.9 0.05 80/0.55),
          transparent 55%
        );
        color-scheme: light;
      }

      /* ---- base ---- */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--canvas);
        background-image: var(--wash);
        background-attachment: fixed;
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        width: 20px;
        height: 20px;
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .glass {
        background: var(--glass-fill);
        border: 1px solid var(--glass-line);
        box-shadow: var(--elev-2);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        backdrop-filter: blur(18px) saturate(160%);
      }
      @media (prefers-reduced-transparency: reduce) {
        .glass {
          background: var(--surface-2);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }

      /* ---- primitives ---- */
      .ib {
        width: var(--sh-hit);
        height: var(--sh-hit);
        border: 0;
        border-radius: var(--r-md);
        background: transparent;
        color: var(--ink-soft);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background var(--dur-1),
          color var(--dur-1);
        flex: none;
        position: relative;
      }
      .ib:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .ib:active {
        background: var(--pressed);
      }
      .ib.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ib:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .ib.sm {
        width: 36px;
        height: 36px;
      }
      .ib.sm svg {
        width: 18px;
        height: 18px;
      }
      .ib.sm::before {
        content: '';
        position: absolute;
        inset: -4px;
      } /* 44pt hit area on small icons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: var(--sh-hit);
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          transform var(--dur-1);
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
      }
      .btn.pri:hover {
        filter: brightness(1.06);
      }
      .btn.dng {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
        position: relative;
      }
      .btn.sm::before,
      .seg.sm button::before {
        content: '';
        position: absolute;
        inset: -4px 0;
      } /* small controls still get a 44pt hit area */
      .btn.more {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: transparent;
      } /* the More button: sliders icon + label, FIRST in its row */
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: 999px;
        background: var(--hover);
        max-width: 100%;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
        padding: 0 14px;
        min-height: var(--sh-hit);
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          color var(--dur-1);
      }
      .seg.sm button {
        min-height: 36px;
        padding: 0 11px;
        font-size: 12.5px;
        position: relative;
        min-width: 44px;
      }
      .seg button.on {
        background: var(--surface-2);
        color: var(--accent);
        box-shadow: var(--elev-1);
      }
      .sw {
        position: relative;
        width: 52px;
        height: 32px;
        border-radius: 999px;
        border: 0;
        background: var(--line-strong);
        cursor: pointer;
        flex: none;
        transition: background var(--dur-1);
      }
      .sw::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        transition: transform var(--dur-1) var(--ease-out);
      }
      .sw[aria-checked='true'] {
        background: var(--accent);
      }
      .sw[aria-checked='true']::after {
        transform: translateX(20px);
      }
      .sw:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .sw::before {
        content: '';
        position: absolute;
        inset: -6px 0;
      }
      .badge {
        font-size: 11.5px;
        font-weight: 700;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
      }
      .inp {
        min-height: var(--sh-hit);
        border-radius: var(--r-sm);
        border: 1px solid var(--line);
        background: var(--surface-0);
        padding: 0 12px;
        width: 100%;
      }
      .mini {
        font-size: 12px;
        color: var(--muted);
      }
      .scrollx {
        overflow-x: auto;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }
      .scrollx::-webkit-scrollbar {
        display: none;
      }
      .track {
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        margin-top: 2px;
        position: relative;
      }
      .track i {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 3px;
        background: var(--line-strong);
      }
      .track.off {
        visibility: hidden;
      }
      .utabs {
        display: flex;
        gap: 2px;
      }
      .utabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        min-width: var(--sh-hit);
        justify-content: center;
        padding: 0 12px;
        font-weight: 600;
        font-size: 13.5px;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .utabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      [data-mode='beg'] .pro {
        display: none !important;
      }

      /* ---- frame ---- */
      .sh-wrap {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 1320px;
        margin: 0 auto;
        padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px
          max(12px, env(safe-area-inset-left, 0px));
      }
      .sh-demo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex: none;
      }
      .sh-demo .t {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin-right: auto;
      }
      .sh-shell {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: var(--sh-gap);
        align-items: stretch;
        position: relative;
      }

      /* ---- rail (left edge) / tab bar (phone) ---- */
      .sh-rail {
        width: var(--sh-rail);
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 6px;
        border-radius: var(--r-lg);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-rail .mk {
        width: 32px;
        height: 32px;
        border-radius: var(--r-md);
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 15px;
        flex: none;
      }
      .sh-rail .grow {
        flex: 1;
      }
      .sh-rail .ib svg {
        width: 24px;
        height: 24px;
      }
      .sh-rail .ib .lbl {
        display: none;
      }
      .sh-rail .ib .bd {
        position: absolute;
        top: 2px;
        right: 0;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 10.5px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      .sh-rail .ib.on::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }

      /* ---- sidebar + left panel (two columns that dock, overlay or hide) ---- */
      .sh-side,
      .sh-panel {
        flex: none;
        border-radius: var(--r-lg);
        background: var(--surface-1);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      .sh-side {
        width: var(--sh-side);
      }
      .sh-panel {
        width: var(--sh-panel);
      }
      .sh-side[data-state='hidden'],
      .sh-panel[data-state='hidden'] {
        display: none;
      }
      .sh-side[data-state='over'],
      .sh-panel[data-state='over'] {
        position: fixed;
        left: max(8px, env(safe-area-inset-left, 0px));
        top: 8px;
        bottom: 8px;
        width: min(86vw, 320px);
        z-index: 60;
        box-shadow: var(--elev-3);
        animation: shIn var(--dur-2) var(--ease-out);
      }
      .sh-colhd {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 8px 4px;
        flex: none;
      }
      .sh-colhd h2 {
        font-size: 15px;
        margin: 0 auto 0 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sh-coltabs {
        display: flex;
        gap: 2px;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .sh-coltabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
      }
      .sh-coltabs button svg {
        width: 16px;
        height: 16px;
      }
      .sh-coltabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .sh-colscroll {
        overflow: auto;
        padding: 6px 8px 12px;
        flex: 1;
        min-height: 0;
        overscroll-behavior: contain;
        position: relative;
      }
      .sh-colfoot {
        flex: none;
        border-top: 1px solid var(--line);
        padding: 6px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* ---- main column + top bar ---- */
      .sh-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }
      .sh-top {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: var(--sh-top);
        padding: 0 4px;
        flex: none;
      }
      .sh-crumbs {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        font-size: 13px;
        color: var(--muted);
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        padding-left: 4px;
      }
      .sh-crumbs svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .sh-crumbs button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0 4px;
        min-height: var(--sh-hit);
        border-radius: var(--r-xs);
        font-size: 13px;
      }
      .sh-crumbs button:hover {
        color: var(--ink);
        background: var(--hover);
      }
      .sh-crumbs b {
        font-weight: 500;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }
      .sh-saved {
        font-size: 12px;
        color: var(--muted);
        padding: 0 6px;
        white-space: nowrap;
      }
      .sh-scroll {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        border-radius: var(--r-lg);
        padding-bottom: calc(84px + var(--sh-safe-b));
      }

      /* ---- floating bar (bottom centre of the main column) + minimise chips (right edge) ---- */
      .sh-fbar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        max-width: calc(100% - 24px);
        transition:
          opacity 150ms var(--ease-out),
          transform 150ms var(--ease-out);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-fbar[hidden] {
        display: none !important;
      }
      .sh-fbar .lab {
        font-size: 13px;
        font-weight: 600;
        padding: 0 10px;
        white-space: nowrap;
      }
      .sh-fbar .sep {
        width: 1px;
        height: 24px;
        background: var(--line);
        margin: 0 4px;
        flex: none;
      }
      .sh-fbar .minb {
        color: var(--muted);
      }
      .sh-fbar .minb svg {
        width: 18px;
        height: 18px;
      }
      .sh-mdock {
        position: fixed;
        right: 0;
        top: calc(12px + var(--sh-top) + 64px);
        z-index: 41;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
      }
      .sh-mchip {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        height: var(--sh-hit);
        padding: 0 12px 0 8px;
        border: 1.5px solid var(--accent);
        border-right: 0;
        border-radius: 14px 0 0 14px;
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        box-shadow: var(--elev-2);
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        animation: shChip 150ms var(--ease-out);
        transition:
          padding 150ms var(--ease-out),
          background 150ms var(--ease-out);
      }
      .sh-mchip:hover {
        padding-right: 16px;
        background: color-mix(in srgb, var(--accent) 24%, var(--surface-2));
      }
      .sh-mchip svg.c {
        width: 14px;
        height: 14px;
      }
      .sh-mchip span {
        color: var(--ink);
      }

      /* ---- scrim, More sheet (fixed, full height, scrolls inside), dialog, pop, toast ---- */
      .sh-scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 59;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-2);
      }
      .sh-scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .sh-scrim.hi {
        z-index: 79;
      }
      .sh-sheet {
        position: fixed;
        z-index: 80;
        top: 12px;
        bottom: 12px;
        right: max(12px, env(safe-area-inset-right, 0px));
        width: min(var(--sh-sheet), calc(100vw - 24px));
        display: flex;
        flex-direction: column;
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        overflow: hidden;
        transform: translateX(calc(100% + 24px));
        visibility: hidden;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s linear var(--dur-3);
      }
      .sh-sheet.on {
        transform: none;
        visibility: visible;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s;
      }
      .sh-shd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 8px 6px 14px;
        flex: none;
      }
      .sh-shd h3 {
        margin: 0;
        font-size: 17px;
      }
      .sh-shd p {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-shd .gr {
        flex: 1;
        min-width: 0;
      }
      .sh-spick {
        flex: none;
        padding: 0 12px 4px;
      }
      .sh-stabs {
        flex: none;
        padding: 0 10px;
      }
      .sh-stabs .utabs {
        border-bottom: 1px solid var(--line);
      }
      .sh-sbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 16px 20px;
      }
      .sh-sft {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px calc(8px + var(--sh-safe-b));
        border-top: 1px solid var(--line);
        background: var(--surface-0);
      }
      .sh-sft .gr {
        flex: 1;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-dialog {
        position: fixed;
        z-index: 85;
        left: 50%;
        top: 50%;
        width: min(420px, calc(100vw - 24px));
        transform: translate(-50%, -48%) scale(0.98);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        padding: 18px;
      }
      .sh-dialog.on {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      .sh-dialog h3 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .sh-dialog .ft {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .sh-pop {
        position: fixed;
        z-index: 86;
        min-width: 220px;
        max-width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        overflow: auto;
        border-radius: var(--r-md);
        padding: 6px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        animation: shPop var(--dur-1) var(--ease-out);
      }
      .sh-pop .mi {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: var(--sh-hit);
        padding: 0 10px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        text-align: left;
        font-size: 14px;
      }
      .sh-pop .mi:hover {
        background: var(--hover);
      }
      .sh-pop .mi svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .sh-pop .mi.dng,
      .sh-pop .mi.dng svg {
        color: var(--danger);
      }
      .sh-pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      .sh-pop .lbl {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
        color: var(--muted);
        padding: 6px 10px 2px;
      }
      .sh-toast {
        position: fixed;
        left: 50%;
        bottom: calc(
          24px + var(--sh-bottom) + var(--sh-bar) + var(--sh-safe-b)
        );
        transform: translate(-50%, 16px);
        opacity: 0;
        pointer-events: none;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 6px 0 18px;
        border-radius: 999px;
        background: var(--surface-3);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        max-width: calc(100vw - 24px);
        font-size: 14px;
        font-weight: 500;
      }
      .sh-toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .sh-toast span {
        padding-right: 12px;
      }
      .sh-toast button {
        border: 0;
        background: none;
        color: var(--accent);
        font-weight: 700;
        min-height: var(--sh-hit);
        padding: 0 12px;
        cursor: pointer;
        border-radius: 999px;
      }
      .sh-tabbar {
        display: none;
      }
      @keyframes shIn {
        from {
          transform: translateX(-24px);
          opacity: 0;
        }
      }
      @keyframes shChip {
        from {
          transform: translateX(100%);
        }
      }
      @keyframes shPop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }

      /* ---- phone (640 and under): rail becomes the bottom tab bar, columns become drawers, the sheet fills the screen ---- */
      @media (max-width: 640px) {
        :root {
          --sh-bottom: var(--sh-tabbar);
        }
        .sh-wrap {
          padding: 8px 8px calc(var(--sh-tabbar) + var(--sh-safe-b));
        }
        .sh-rail {
          display: none;
        }
        .sh-side:not([data-state='over']),
        .sh-panel:not([data-state='over']) {
          display: none;
        }
        .sh-tabbar {
          display: flex;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          height: calc(var(--sh-tabbar) + var(--sh-safe-b));
          padding: 0 4px var(--sh-safe-b);
          justify-content: space-around;
          align-items: center;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
        }
        .sh-tabbar .ib {
          flex: 1;
          width: auto;
          height: 48px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1px;
          font-size: 10px;
          font-weight: 600;
          border-radius: var(--r-sm);
        }
        .sh-tabbar .ib svg {
          width: 22px;
          height: 22px;
        }
        .sh-tabbar .ib .bd {
          position: absolute;
          top: 2px;
          left: calc(50% + 6px);
          min-width: 16px;
          height: 16px;
          padding: 0 4px;
          border-radius: 999px;
          background: var(--accent);
          color: var(--on-accent);
          font-size: 10px;
          font-weight: 700;
          display: grid;
          place-items: center;
        }
        .sh-fbar {
          bottom: 12px;
        }
        .sh-sheet {
          top: max(8px, env(safe-area-inset-top, 0px));
          bottom: 0;
          right: 0;
          left: 0;
          width: auto;
          border-radius: var(--r-xl) var(--r-xl) 0 0;
          transform: translateY(105%);
        }
        .sh-mdock {
          top: calc(8px + var(--sh-top) + 56px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Many sheet tabs: keep each tab its natural width and scroll the row instead of squeezing. */
      .sh-stabs .utabs button {
        flex: none;
      }

      /* ==== 12 Nov 2026 (U3): dialog close, universal minimise button, edge handle, customisable tabs ==== */
      /* every #sh-dialog has a visible close button */
      .sh-dialog > .sh-dx {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 3;
      }
      .sh-dialog > .sh-dx svg {
        width: 20px;
        height: 20px;
      }
      .sh-dialog h3 {
        padding-right: 40px;
      }
      /* the minimise button: the same in every bar, large, clearly visible; pulses gently until first used */
      .ib.minb,
      .ib.sm.minb {
        width: 44px;
        height: 44px;
        border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line));
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: var(--r-md);
        flex: none;
      }
      .ib.minb:hover,
      .ib.sm.minb:hover {
        background: color-mix(in srgb, var(--accent) 24%, transparent);
        color: var(--accent);
      }
      .ib.minb svg,
      .ib.sm.minb svg {
        width: 22px;
        height: 22px;
      }
      .ib.minb.pulse {
        animation: shPulse 1.6s ease-in-out 2;
      }
      @keyframes shPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
        50% {
          box-shadow: 0 0 0 7px
            color-mix(in srgb, var(--accent) 30%, transparent);
        }
      }
      /* edge handle: a minimised bar docked to the left or right edge; drag it anywhere, tap to restore */
      .sh-handle {
        position: fixed;
        z-index: 42;
        width: 36px;
        height: 56px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        color: var(--accent);
        box-shadow: var(--elev-2);
        cursor: grab;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        transition:
          left 180ms var(--ease-out),
          top 180ms var(--ease-out);
      }
      .sh-handle[data-side='r'] {
        border-right: 0;
        border-radius: 14px 0 0 14px;
      }
      .sh-handle[data-side='l'] {
        border-left: 0;
        border-radius: 0 14px 14px 0;
      }
      .sh-handle svg {
        width: 20px;
        height: 20px;
        pointer-events: none;
      }
      .sh-handle.drag {
        cursor: grabbing;
        transition: none;
        box-shadow: var(--elev-3);
        border-radius: 14px;
        border-width: 1.5px;
      }
      .sh-handle:hover {
        background: color-mix(in srgb, var(--accent) 26%, var(--surface-2));
      }
      /* customisable tabs: scrolling tabs, "+" always visible at the end */
      .sh-coltabs.sh-tabs {
        display: block;
        padding: 0 4px 0 8px;
      }
      .sh-tabs .sh-trow {
        display: flex;
        align-items: stretch;
        gap: 2px;
      }
      .sh-tabs .sh-tscroll {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1;
        min-width: 0;
      }
      .sh-tabs .sh-tscroll::-webkit-scrollbar {
        display: none;
      }
      .sh-tabs .sh-tscroll button {
        flex: none;
        padding: 0 11px;
      }
      .sh-tabs .sh-tplus {
        flex: none;
        width: var(--sh-hit);
        padding: 0;
        color: var(--accent);
        border-bottom-color: transparent;
      }
      .sh-tabs .sh-tplus svg {
        display: block;
        width: 20px;
        height: 20px;
      }
      .sh-tabs .track {
        margin: 0 4px 0 0;
      }
      .sh-tedit {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: min(52vh, 360px);
        overflow: auto;
        margin: 4px -4px 0;
        padding: 2px 4px;
      }
      .sh-trw {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface-2);
        position: relative;
      }
      .sh-trw .gp {
        cursor: grab;
        touch-action: none;
        color: var(--muted);
      }
      .sh-trw .gp svg {
        width: 18px;
        height: 18px;
      }
      .sh-trw input {
        flex: 1;
        min-width: 0;
        min-height: 40px;
        border: 0;
        background: transparent;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
        padding: 0 6px;
        border-radius: var(--r-sm);
      }
      .sh-trw input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .sh-trw .ib[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }
      .sh-trw.drag {
        box-shadow: var(--elev-2);
        z-index: 2;
        border-color: var(--accent);
      }
      .sh-trw .rm {
        color: var(--danger);
      }
      .sh-tpop .mi small {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      /* ---- clear (x) button inside any text field (Shell.clearable / Shell.autoClear) ---- */
      .sh-clr {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
        align-items: center;
      }
      .sh-clr > input,
      .sh-clr > textarea {
        padding-right: 40px !important;
      }
      .sh-clr .sh-clrb {
        position: absolute;
        right: 2px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .sh-clr.ta .sh-clrb {
        top: 6px;
        transform: none;
      }
      .sh-clr > input:placeholder-shown ~ .sh-clrb,
      .sh-clr > textarea:placeholder-shown ~ .sh-clrb {
        display: none;
      }
      .sh-clr input[type='search']::-webkit-search-cancel-button {
        display: none;
      }
      /* ---- universal AI bar (13 Nov 2026) ---- */
      .sh-aib {
        width: auto;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent);
        font-size: 13.5px;
        font-weight: 650;
      }
      .sh-aib svg {
        width: 18px;
        height: 18px;
      }
      .sh-aib:hover {
        color: var(--accent);
      }
      .sh-ai-sc {
        position: fixed;
        inset: 0;
        z-index: 83;
        background: transparent;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-2);
      }
      .sh-ai-sc.on {
        pointer-events: auto;
      }
      .sh-ai {
        position: fixed;
        z-index: 84;
        width: min(380px, calc(100vw - 16px));
        max-height: calc(100dvh - 80px);
        display: flex;
        flex-direction: column;
        border-radius: var(--r-lg);
        background: var(--surface-2);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px) scale(0.985);
        transform-origin: top right;
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out),
          visibility 0s var(--dur-2);
      }
      .sh-ai.on {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out),
          visibility 0s;
      }
      .sh-ai-grip {
        display: none;
      }
      .sh-ai-hd {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 8px 6px 14px;
      }
      .sh-ai-mk {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
        flex: none;
      }
      .sh-ai-mk svg {
        width: 18px;
        height: 18px;
      }
      .sh-ai-tt {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        line-height: 1.25;
      }
      .sh-ai-tt b {
        font-size: 15px;
      }
      .sh-ai-tt small {
        font-size: 12px;
        color: var(--muted);
      }
      .sh-ai-ctx {
        margin: 0 14px 4px;
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sh-ai-ctx b {
        color: var(--ink-soft);
        font-weight: 600;
      }
      .sh-ai-body {
        overflow: auto;
        padding: 4px 8px calc(10px + var(--sh-safe-b));
        flex: 1;
        min-height: 0;
      }
      .sh-ai-list {
        display: flex;
        flex-direction: column;
      }
      .sh-ai-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 52px;
        padding: 6px 8px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        text-align: left;
      }
      .sh-ai-row:hover {
        background: var(--hover);
      }
      .sh-ai-row[aria-expanded='true'] {
        background: var(--accent-soft);
      }
      .sh-ai-row > svg {
        width: 20px;
        height: 20px;
        color: var(--accent);
      }
      .sh-ai-row span {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .sh-ai-row b {
        font-size: 14.5px;
        font-weight: 600;
      }
      .sh-ai-row small {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }
      .sh-ai-g {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--muted);
        padding: 10px 8px 2px;
      }
      .sh-ai-paste {
        margin: 6px 6px 2px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sh-ai-paste label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-soft);
      }
      .sh-ai-paste textarea {
        min-height: 92px;
        padding: 10px 12px;
        resize: vertical;
      }
      .sh-ai-paste .ft {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .sh-ai-foot {
        margin: 8px 8px 0;
        font-size: 11.5px;
        color: var(--muted);
      }
      @media (max-width: 640px) {
        .sh-aib {
          width: var(--sh-hit);
          padding: 0;
          justify-content: center;
        }
        .sh-aib span {
          display: none;
        }
        .sh-ai-sc {
          background: var(--scrim);
        }
        .sh-ai-sc.on {
          opacity: 1;
        }
        .sh-ai {
          left: 0;
          right: 0;
          bottom: 0;
          top: auto;
          width: auto;
          max-height: 82dvh;
          border-radius: var(--r-xl) var(--r-xl) 0 0;
          transform: translateY(105%);
          transform-origin: bottom center;
        }
        .sh-ai.on {
          transform: none;
        }
        .sh-ai-grip {
          display: block;
          width: 36px;
          height: 4px;
          border-radius: 99px;
          background: var(--line-strong);
          opacity: 0.5;
          margin: 8px auto 0;
        }
        .sh-ai-hd {
          padding-top: 6px;
        }
      }
      /* ==== end shell.css (all) ==== */
      .sh-trw {
        flex-wrap: wrap;
      }
      .sh-trw .sh-tsrc {
        box-sizing: border-box;
        flex: 1 0 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px 4px 46px;
        font-size: 12px;
        color: var(--muted);
      }
      .sh-trw .sh-tsrc select {
        flex: 1 1 0;
        width: 0;
        min-width: 0;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--surface-1);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        padding: 0 6px;
      }
      .sh-tcreate {

        outline: none;

        height: 100%;

        transform-origin: center;

        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .pgth.cur b {

        background: repeating-linear-gradient(
          45deg,
          transparent 0 6px,
          var(--hover) 6px 7px

        border-style: dashed;
      }
      .pgth .gp {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 18px;
        height: 18px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: var(--muted);
        background: var(--surface-1);
        opacity: 0;
        cursor: grab;
        touch-action: none;

      .pgth:hover .gp,
      .pgth.sel .gp {
        opacity: 0.9;
      }
      .pgth .gp svg {
        width: 12px;
        height: 12px;
      }
      .pgth .rt {
        position: absolute;
        top: 3px;
        left: 4px;
        font: 600 9px var(--sans);
        color: var(--accent);
        font-style: normal;

        z-index: 5;
        box-shadow: var(--elev-3);

        transition: none;
        opacity: 0.95;

        box-shadow: -4px 0 0 0 var(--accent);

      .pgth.dropR {
        box-shadow: 4px 0 0 0 var(--accent);

        margin: 2px 0 8px;
      }
      .pfres {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

        font-size: 12px;

      .tb.holding {
        background: var(--accent-soft);
        color: var(--accent);
        transform: scale(0.94);
      }
      /* pages mode: edge tap zones (hint) + Kindle-like slide */
      .pages-on .paper::before,
      .pages-on .paper::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 18%;
        pointer-events: none;
        opacity: 0;
        transition: opacity 150ms;
      }
      .pages-on .paper::before {
        left: 0;
        border-radius: var(--r-lg) 0 0 var(--r-lg);
        background: linear-gradient(90deg, var(--accent-soft), transparent);
      }
      .pages-on .paper::after {
        right: 0;
        border-radius: 0 var(--r-lg) var(--r-lg) 0;
        background: linear-gradient(270deg, var(--accent-soft), transparent);
      }

      .pages-on .paper:hover::after {

      .art.pages .chaps {
        position: relative;
        overflow: hidden;

      .art.pages .pg.ghost {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        pointer-events: none;
        z-index: 2;
        background: var(--pbg, var(--surface-0));

      .art.pages .pg.ghost.outN {
        animation: pgOutN 280ms var(--ease-out) forwards;
      }
      .art.pages .pg.ghost.outP {
        animation: pgOutP 280ms var(--ease-out) forwards;
      }
      .art.pages .pg.cur.inN {
        animation: pgInN 280ms var(--ease-out);
      }
      .art.pages .pg.cur.inP {
        animation: pgInP 280ms var(--ease-out);
      }
      @keyframes pgOutN {
        to {
          transform: translateX(-22%);
          opacity: 0;
        }
      }
      @keyframes pgOutP {
        to {
          transform: translateX(22%);
          opacity: 0;
        }
      }
      @keyframes pgInN {
        from {
          transform: translateX(22%);
          opacity: 0;
        }

      .sh-scrim.on:not(.hi) {

          /* rail: redesigned (U2). A = the pick, B = the alternative. */
          libraryA:
            '<path d="M3 20.5h18"/><rect x="4" y="5" width="4" height="12.5" rx="1"/><rect x="8" y="8" width="4" height="9.5" rx="1"/><path d="m13.6 7.4 3.5-1 3 10.2-3.5 1z"/>',

            if (idx.length && idx[idx.length - 1] < L.length - 1) {
              const a = L.splice(idx[idx.length - 1] + 1, 1)[0]

                  if (navigator.vibrate) navigator.vibrate(10)
                  toast('Drag to move the sticky note')
                  loop()
                }, 500),
              }
            })
            art.addEventListener('pointermove', (e) => {
              if (!st) return
              if (!st.on) {
                if (Math.hypot(e.clientX - st.x, e.clientY - st.y) > 8) {
                  clearTimeout(st.t)
                  st = null
                }
                return
              }
              st.x = e.clientX
              st.y = e.clientY
              st.pin.style.left = e.clientX + 'px'
              st.pin.style.top = e.clientY + 'px'
            })
            const end = () => {
              if (!st) return
              clearTimeout(st.t)
              const s = st
              st = null
              cancelAnimationFrame(raf)
              if (!s.on) return
              sup = Date.now()
              s.pin.style.cssText = ''
              s.pin.classList.remove('lift')
              const it = find(s.id)
              if (!it) return
              let best = null,
                bd = 1e9
              PIDS.map((id) => document.getElementById(id))
                .filter((el) => el && el.offsetParent)
                .forEach((el) => {
                  const r = el.getBoundingClientRect(),
                    d =
                      s.y < r.top
                        ? r.top - s.y
                        : s.y > r.bottom
                          ? s.y - r.bottom
                          : 0
                  if (d < bd) {
                    bd = d
                    best = el
                  }
                })
              if (best) {
                const r = best.getBoundingClientRect(),
                  old = it.pid
                it.pid = best.dataset.pid
                it.rx = +Math.max(
                  2,
                  Math.min(96, ((s.x - r.left) / r.width) * 100),
                ).toFixed(1)
                it.ry = Math.round(
                  Math.max(0, Math.min(r.height - 14, s.y - r.top)),
                )
                it.chapter = PARAS[it.pid].ch
                renderPara(old)
                renderPara(it.pid)
                refresh()
                toast('Sticky note moved')
              }
            }
            art.addEventListener('pointerup', end)
            art.addEventListener('pointercancel', end)
            art.addEventListener(
              'click',
              (e) => {
                if (Date.now() - sup < 400) {
                  e.stopImmediatePropagation()
                  e.stopPropagation()
                }
              },
              true,
            )
          })()

          ;(function () {
            const MODES = [
              [
                'all',
                'Full',
                'Everything works: highlight, draw, edit and select freely.',
                'unlock',
              ],
              [
                'read',
                'Reading mode',
                'Like a Kindle: highlights, notes and bookmarks work. No text editing, drawing or stickies.',
                'book',
              ],
              [
                'view',
                'View only',
                'No edits or highlights. Only zoom, scroll, page turns, search and view settings.',
                'eye',
              ],
              [
                'frozen',
                'Frozen',
                'Nothing responds except the padlock.',
                'lock',
              ],
            ]
            const btn = $('#plockbtn'),
              frz = $('#frz')
            let LT = null,
              held = false
            const popEl = () => {
              const p = document.getElementById('sh-pop')
              return p && !p.hidden && p.querySelector('[data-m]') ? p : null
            }
            const mode = () => S.rd.lockMode || 'all',
              strong = () => mode() === 'view' || mode() === 'frozen'
            function shake() {
              btn.classList.remove('shake')
              void btn.offsetWidth
              btn.classList.add('shake')
            }
            function paint() {
              const m = mode(),
                M = MODES.find((x) => x[0] === m)
              ;['all', 'read', 'view', 'frozen'].forEach((k) =>
                document.body.classList.toggle('lk-' + k, k === m),
              )
              frz.hidden = m !== 'frozen'
              btn.innerHTML =
                '<svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="none"/></svg>' +
                ic(M[3])
              btn.title =
                'Reader lock: ' + M[1] + (strong() ? '. Hold to unlock.' : '')
              btn.classList.toggle('on', m !== 'all')
              if (
                m !== 'all' &&
                ['pen', 'hl', 'eraser', 'lasso', 'sticky'].includes(UI.tool)
              )
                setTool('select')
              if (strong()) {
                endSel()
                closeCard()
              }
              if (m === 'frozen') {
                if (RD.fOpen) openFind(false)
              }
            }
            function popHTML() {
              return (
                '<div class="lbl">Reader lock</div>' +
                MODES.map(
                  (x) =>
                    '<button type="button" class="lkrow" role="menuitemradio" aria-checked="' +
                    (mode() === x[0]) +
                    '" data-m="' +
                    x[0] +
                    '">' +
                    ic(x[3]) +
                    '<span><b>' +
                    x[1] +
                    '</b><small>' +
                    x[2] +
                    '</small></span></button>',
                ).join('') +
                '<div class="rrow note"><small>Remembered for this book. To leave View only or Frozen, hold the padlock for a second.</small></div>'
              )
            }
            function openPop(on) {
              if (on) {
                closeCard()
                Shell.pop(btn, popHTML())
              } else Shell.closePop()
            }
            document.addEventListener('click', (e) => {
              const b = e.target.closest('#sh-pop [data-m]')
              if (!b) return
              S.rd.lockMode = b.dataset.m
              save()
              paint()
              openPop(false)
              toast(MODES.find((x) => x[0] === b.dataset.m)[1])
            })
            const off = () => {
              clearTimeout(LT)
              btn.classList.remove('hold')
            }
            const start = () => {
              btn.classList.add('hold')
              LT = setTimeout(() => {
                off()
                held = true
                openPop(true)
              }, 1000)
            }
            const early = () => {
              if (btn.classList.contains('hold')) {
                off()
                shake()
                toast('Hold to unlock')
              }
            }
            btn.addEventListener('pointerdown', (e) => {
              held = false
              if (!strong()) return
              e.preventDefault()
              start()
            })
            ;['pointerup', 'pointerleave', 'pointercancel'].forEach((n) =>
              btn.addEventListener(n, early),
            )
            btn.addEventListener('keydown', (e) => {
              if (strong() && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault()
                if (!btn.classList.contains('hold')) start()
              }
            })
            btn.addEventListener('keyup', early)
            btn.addEventListener('click', (e) => {
              if (held) {
                held = false
                return
              }
              if (strong()) return
              openPop(!popEl())
            })

            document.addEventListener(
              'click',
              (e) => {
                const m = mode()
                if (m === 'all') return
                const t = e.target
                if (t.closest('#plockbtn,#sh-pop,#sh-toast,#sh-dialog')) return
                let block = false
                if (m === 'frozen') block = true
                else if (m === 'view')
                  block = !!t.closest(
                    '.rtool [data-tool],.rtool #undo,.rtool #redo,#bmHere,#ribbon,[data-r=listen],#pop,.pin,mark,#sh-panel .acts,#sh-sheet [data-act=pen],#sh-sheet [data-act=lock],#sh-sheet [data-act=ai],#sh-sheet [data-sh-tab=focus],#sh-sheet [data-sh-tab=listen],#sh-sheet [data-sh-tab=tools],#bBulk',
                  )
                else
                  block = !!t.closest(
                    '.rtool [data-tool=pen],.rtool [data-tool=hl],.rtool [data-tool=eraser],.rtool [data-tool=lasso],.rtool [data-tool=sticky],.rtool #undo,.rtool #redo,.pin',
                  )
                if (block) {
                  e.stopPropagation()
                  e.preventDefault()
                  shake()
                }
              },
              true,
            )
            frz.addEventListener('wheel', (e) => e.preventDefault(), {
              passive: false,
            })
            addEventListener(
              'keydown',
              (e) => {
                if (mode() === 'frozen' && e.target !== btn) {
                  e.preventDefault()
                  e.stopPropagation()
                }
              },
              true,
            )
            document.addEventListener('selectionchange', () => {
              if (strong()) {
                const s = getSelection()
                if (s && !s.isCollapsed) s.removeAllRanges()
              }
            })
            /* tap counts while the Select tool is on: 2 word, 3 line, 4 paragraph, 5 page */
            art.addEventListener('click', (e) => {
              if (UI.tool !== 'select' || strong()) return
              const p = e.target.closest('p[data-pid]')
              if (!p || e.target.closest('.pin,mark,.bl')) return
              const d = e.detail
              if (d < 3) return
              setTimeout(() => {
                const s = getSelection(),
                  r = document.createRange()
                if (d === 3) {
                  const c =
                    document.caretRangeFromPoint &&
                    document.caretRangeFromPoint(e.clientX, e.clientY)
                  if (!c || !s.modify) return
                  s.removeAllRanges()
                  s.addRange(c)
                  s.modify('move', 'backward', 'lineboundary')
                  s.modify('extend', 'forward', 'lineboundary')
                } else if (d === 4) {
                  r.selectNodeContents(p)
                  s.removeAllRanges()
                  s.addRange(r)
                } else {
                  const g = p.closest('.pg'),
                    ps = g.querySelectorAll('p[data-pid]')
                  r.setStartBefore(ps[0])
                  r.setEndAfter(ps[ps.length - 1])
                  s.removeAllRanges()
                  s.addRange(r)
                }
              }, 0)
            })
            window.__lock = { paint, mode }
            paint()
          })()
          applyLook()
          lfApply()
          renderBar()
          renderCard()
          zprevUpd()
          setTimeout(() => {
            rdUpdate()
            snap()
          }, 120)
        })()

        let rz = null
        addEventListener('resize', () => {
          clearTimeout(rz)
          rz = setTimeout(() => {
            snap()
            applyCols()
            if (UI.view === 'nb') renderNb()
            else renderPanel()
          }, 250)
        })
        setTimeout(applyAway, 150)
        /* qa: popover close, draggable strip */
        ;(function () {
          const X =
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'
          const fix = () => {
            const p = document.getElementById('sh-pop')
            if (p && !p.hidden && !p.querySelector('.pxc'))
              p.insertAdjacentHTML(
                'beforeend',
                '<button type="button" class="ib sm pxc" aria-label="Close" title="Close">' +
                  X +
                  '</button>',
              )
          }
          new MutationObserver(fix).observe(document.documentElement, {
            subtree: true,
            childList: true,
            attributes: true,
            attributeFilter: ['hidden'],
          })
          document.addEventListener(
            'click',
            (e) => {
              if (e.target.closest('.pxc')) {
                e.stopPropagation()
                Shell.closePop()
              }
            },
            true,
          )
          const rt = document.getElementById('rtool')
          if (!rt) return
          rt.insertAdjacentHTML(
            'afterbegin',
            '<span class="rgrip" id="rgrip" title="Drag to move the tool bar. Double-tap to put it back." aria-label="Move the tool bar"></span>',
          )
          const g = document.getElementById('rgrip')
          let pos = { x: 0, y: 0 },
            d = null
          try {
            pos = JSON.parse(localStorage.getItem('lnqa.strip')) || pos
          } catch (e) {}
          const put = () => {
            rt.style.setProperty('--qx', pos.x + 'px')
            rt.style.setProperty('--qy', pos.y + 'px')
          }
          put()
          g.addEventListener('pointerdown', (e) => {
            if (e.button) return
            try {
              g.setPointerCapture(e.pointerId)
            } catch (_) {}
            d = {
              id: e.pointerId,
              x: e.clientX,
              y: e.clientY,
              px: pos.x,
              py: pos.y,
            }
            g.classList.add('drag')
          })
          g.addEventListener('pointermove', (e) => {
            if (!d || e.pointerId !== d.id) return
            pos = { x: d.px + e.clientX - d.x, y: d.py + e.clientY - d.y }
            put()
            const r = rt.getBoundingClientRect()
            let ax = 0,
              ay = 0
            if (r.left < 4) ax = 4 - r.left
            if (r.right > innerWidth - 4) ax = innerWidth - 4 - r.right
            if (r.top < 4) ay = 4 - r.top
            if (r.bottom > innerHeight - 4) ay = innerHeight - 4 - r.bottom
            if (ax || ay) {
              pos.x += ax
              pos.y += ay
              put()
            }
          })
          const end = () => {
            if (!d) return
            d = null
            g.classList.remove('drag')
            try {
              localStorage.setItem('lnqa.strip', JSON.stringify(pos))
            } catch (e) {}
          }
          g.addEventListener('pointerup', end)
          g.addEventListener('pointercancel', end)
          g.addEventListener('dblclick', () => {
            pos = { x: 0, y: 0 }
            put()
            end()
          })
        })()
        window.__annot = { S: () => S, UI, RD }
      })()
    </script>
  </body>
</html>
