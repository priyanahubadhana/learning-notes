<title>Home Dashboard Mock-up v2</title>
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
/>
<meta name="claude:viewport-fit-sides" content="cover" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  /* ==== shell.css · the ONE shared app shell for every mock-up (12 Nov 2026) ====
   Paste this whole file at the top of a mock's <style>. See shell-spec.md.
   Structure classes are prefixed sh-. Primitives (.btn .seg .sw .ib .badge .glass .track) are the one shared version. */
  :root {
    --canvas: #0f0e13;
    --surface-0: #16151b;
    --surface-1: #1d1c23;
    --surface-2: #25242c;
    --surface-3: #2e2d36;
    --ink: #ecebf2;
    --ink-soft: #b8b6c3;
    --muted: #9a98a6;
    --line: #2a2931;
    --line-strong: #7f7d8c;
    --hover: rgba(255, 255, 255, 0.06);
    --pressed: rgba(255, 255, 255, 0.1);
    --accent: #a08cff;
    --on-accent: #16112e;
    --accent-soft: rgba(160, 140, 255, 0.16);
    --danger: #ff7a6b;
    --success: #5fd39a;
    --warn: #f0b35a;
    --glass-fill: rgba(29, 28, 35, 0.7);
    --glass-line: rgba(255, 255, 255, 0.08);
    --elev-1: 0 0 0 1px rgba(255, 255, 255, 0.06);
    --elev-2: 0 8px 24px rgba(0, 0, 0, 0.4);
    --elev-3: 0 16px 48px rgba(0, 0, 0, 0.55);
    --scrim: rgba(0, 0, 0, 0.48);
    --wash:
      radial-gradient(at 15% 0%, oklch(0.35 0.12 290/0.45), transparent 55%),
      radial-gradient(at 90% 10%, oklch(0.32 0.1 255/0.35), transparent 50%);
    --r-xs: 6px;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 24px;
    --dur-1: 120ms;
    --dur-2: 180ms;
    --dur-3: 240ms;
    --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
    --sans:
      -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter Variable', Inter,
      system-ui, sans-serif;
    /* shell sizes: change here only */
    --sh-rail: 56px;
    --sh-side: 264px;
    --sh-panel: 264px;
    --sh-top: 52px;
    --sh-tabbar: 56px;
    --sh-gap: 12px;
    --sh-sheet: 440px;
    --sh-hit: 44px;
    --sh-safe-b: env(safe-area-inset-bottom, 0px);
    --sh-bottom: 0px;
    --sh-bar: 0px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme='dark']):not([data-theme='sepia']) {
      --canvas: #f4f3f8;
      --surface-0: #ffffff;
      --surface-1: #fafafc;
      --surface-2: #ffffff;
      --surface-3: #ffffff;
      --ink: #18171c;
      --ink-soft: #4d4b55;
      --muted: #6b6976;
      --line: #eceaf1;
      --line-strong: #8a8796;
      --hover: rgba(24, 23, 28, 0.05);
      --pressed: rgba(24, 23, 28, 0.09);
      --accent: #6941e0;
      --on-accent: #ffffff;
      --accent-soft: rgba(105, 65, 224, 0.1);
      --danger: #c0352b;
      --success: #1a7248;
      --warn: #8f5200;
      --glass-fill: rgba(255, 255, 255, 0.72);
      --glass-line: rgba(255, 255, 255, 0.6);
      --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
      --elev-2:
        0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
      --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
      --scrim: rgba(0, 0, 0, 0.24);
      --wash:
        radial-gradient(at 15% 0%, oklch(0.92 0.06 290/0.55), transparent 55%),
        radial-gradient(at 90% 10%, oklch(0.93 0.05 250/0.45), transparent 50%);
      color-scheme: light;
    }
  }
  :root[data-theme='light'] {
    --canvas: #f4f3f8;
    --surface-0: #ffffff;
    --surface-1: #fafafc;
    --surface-2: #ffffff;
    --surface-3: #ffffff;
    --ink: #18171c;
    --ink-soft: #4d4b55;
    --muted: #6b6976;
    --line: #eceaf1;
    --line-strong: #8a8796;
    --hover: rgba(24, 23, 28, 0.05);
    --pressed: rgba(24, 23, 28, 0.09);
    --accent: #6941e0;
    --on-accent: #ffffff;
    --accent-soft: rgba(105, 65, 224, 0.1);
    --danger: #c0352b;
    --success: #1a7248;
    --warn: #8f5200;
    --glass-fill: rgba(255, 255, 255, 0.72);
    --glass-line: rgba(255, 255, 255, 0.6);
    --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
    --elev-2:
      0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
    --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
    --scrim: rgba(0, 0, 0, 0.24);
    --wash:
      radial-gradient(at 15% 0%, oklch(0.92 0.06 290/0.55), transparent 55%),
      radial-gradient(at 90% 10%, oklch(0.93 0.05 250/0.45), transparent 50%);
    color-scheme: light;
  }
  :root[data-theme='sepia'] {
    --canvas: #f3e9d2;
    --surface-0: #fbf3e0;
    --surface-1: #f7eed8;
    --surface-2: #fbf3e0;
    --surface-3: #fbf3e0;
    --ink: #3b2f1e;
    --ink-soft: #5c4b33;
    --muted: #74644a;
    --line: #e6d8b8;
    --line-strong: #8e7d5e;
    --hover: rgba(59, 47, 30, 0.06);
    --pressed: rgba(59, 47, 30, 0.1);
    --accent: #8a4b1f;
    --on-accent: #fff;
    --accent-soft: rgba(138, 75, 31, 0.12);
    --danger: #b3341f;
    --success: #2f6b3f;
    --warn: #8f5200;
    --glass-fill: rgba(251, 243, 224, 0.78);
    --glass-line: rgba(255, 255, 255, 0.5);
    --elev-1: 0 1px 2px rgba(59, 47, 30, 0.08);
    --elev-2: 0 4px 16px rgba(59, 47, 30, 0.1);
    --elev-3: 0 16px 48px rgba(59, 47, 30, 0.18);
    --scrim: rgba(30, 22, 8, 0.34);
    --wash: radial-gradient(
      at 15% 0%,
      oklch(0.9 0.05 80/0.55),
      transparent 55%
    );
    color-scheme: light;
  }

  /* ---- base ---- */
  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--canvas);
    background-image: var(--wash);
    background-attachment: fixed;
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    width: 20px;
    height: 20px;
    flex: none;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .glass {
    background: var(--glass-fill);
    border: 1px solid var(--glass-line);
    box-shadow: var(--elev-2);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass {
      background: var(--surface-2);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
  }

  /* ---- primitives ---- */
  .ib {
    width: var(--sh-hit);
    height: var(--sh-hit);
    border: 0;
    border-radius: var(--r-md);
    background: transparent;
    color: var(--ink-soft);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition:
      background var(--dur-1),
      color var(--dur-1);
    flex: none;
    position: relative;
  }
  .ib:hover {
    background: var(--hover);
    color: var(--ink);
  }
  .ib:active {
    background: var(--pressed);
  }
  .ib.on {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .ib:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .ib.sm {
    width: 36px;
    height: 36px;
  }
  .ib.sm svg {
    width: 18px;
    height: 18px;
  }
  .ib.sm::before {
    content: '';
    position: absolute;
    inset: -4px;
  } /* 44pt hit area on small icons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: var(--sh-hit);
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition:
      background var(--dur-1),
      transform var(--dur-1);
  }
  .btn:hover {
    background: var(--hover);
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn.pri {
    background: var(--accent);
    color: var(--on-accent);
    border-color: transparent;
  }
  .btn.pri:hover {
    filter: brightness(1.06);
  }
  .btn.dng {
    color: var(--danger);
    border-color: color-mix(in srgb, var(--danger) 40%, transparent);
  }
  .btn.sm {
    min-height: 36px;
    padding: 0 12px;
    font-size: 13px;
    position: relative;
  }
  .btn.sm::before,
  .seg.sm button::before {
    content: '';
    position: absolute;
    inset: -4px 0;
  } /* small controls still get a 44pt hit area */
  .btn.more {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: transparent;
  } /* the More button: sliders icon + label, FIRST in its row */
  .seg {
    display: inline-flex;
    padding: 2px;
    border-radius: 999px;
    background: var(--hover);
    max-width: 100%;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    padding: 0 14px;
    min-height: var(--sh-hit);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition:
      background var(--dur-1),
      color var(--dur-1);
  }
  .seg.sm button {
    min-height: 36px;
    padding: 0 11px;
    font-size: 12.5px;
    position: relative;
    min-width: 44px;
  }
  .seg button.on {
    background: var(--surface-2);
    color: var(--accent);
    box-shadow: var(--elev-1);
  }
  .sw {
    position: relative;
    width: 52px;
    height: 32px;
    border-radius: 999px;
    border: 0;
    background: var(--line-strong);
    cursor: pointer;
    flex: none;
    transition: background var(--dur-1);
  }
  .sw::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    transition: transform var(--dur-1) var(--ease-out);
  }
  .sw[aria-checked='true'] {
    background: var(--accent);
  }
  .sw[aria-checked='true']::after {
    transform: translateX(20px);
  }
  .sw:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .sw::before {
    content: '';
    position: absolute;
    inset: -6px 0;
  }
  .badge {
    font-size: 11.5px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .inp {
    min-height: var(--sh-hit);
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
    background: var(--surface-0);
    padding: 0 12px;
    width: 100%;
  }
  .mini {
    font-size: 12px;
    color: var(--muted);
  }
  .scrollx {
    overflow-x: auto;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }
  .scrollx::-webkit-scrollbar {
    display: none;
  }
  .track {
    height: 3px;
    border-radius: 3px;
    background: var(--line);
    margin-top: 2px;
    position: relative;
  }
  .track i {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 3px;
    background: var(--line-strong);
  }
  .track.off {
    visibility: hidden;
  }
  .utabs {
    display: flex;
    gap: 2px;
  }
  .utabs button {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    min-height: var(--sh-hit);
    min-width: var(--sh-hit);
    justify-content: center;
    padding: 0 12px;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .utabs button.on {
    color: var(--accent);
    border-color: var(--accent);
  }
  [data-mode='beg'] .pro {
    display: none !important;
  }

  /* ---- frame ---- */
  .sh-wrap {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 1320px;
    margin: 0 auto;
    padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px
      max(12px, env(safe-area-inset-left, 0px));
  }
  .sh-demo {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex: none;
  }
  .sh-demo .t {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-right: auto;
  }
  .sh-shell {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: var(--sh-gap);
    align-items: stretch;
    position: relative;
  }

  /* ---- rail (left edge) / tab bar (phone) ---- */
  .sh-rail {
    width: var(--sh-rail);
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 6px;
    border-radius: var(--r-lg);
    -webkit-user-select: none;
    user-select: none;
  }
  .sh-rail .mk {
    width: 32px;
    height: 32px;
    border-radius: var(--r-md);
    background: var(--accent);
    color: var(--on-accent);
    display: grid;
    place-items: center;
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 15px;
    flex: none;
  }
  .sh-rail .grow {
    flex: 1;
  }
  .sh-rail .ib svg {
    width: 24px;
    height: 24px;
  }
  .sh-rail .ib .lbl {
    display: none;
  }
  .sh-rail .ib .bd {
    position: absolute;
    top: 2px;
    right: 0;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 10.5px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .sh-rail .ib.on::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 10px;
    bottom: 10px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--accent);
  }

  /* ---- sidebar + left panel (two columns that dock, overlay or hide) ---- */
  .sh-side,
  .sh-panel {
    flex: none;
    border-radius: var(--r-lg);
    background: var(--surface-1);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .sh-side {
    width: var(--sh-side);
  }
  .sh-panel {
    width: var(--sh-panel);
  }
  .sh-side[data-state='hidden'],
  .sh-panel[data-state='hidden'] {
    display: none;
  }
  .sh-side[data-state='over'],
  .sh-panel[data-state='over'] {
    position: fixed;
    left: max(8px, env(safe-area-inset-left, 0px));
    top: 8px;
    bottom: 8px;
    width: min(86vw, 320px);
    z-index: 60;
    box-shadow: var(--elev-3);
    animation: shIn var(--dur-2) var(--ease-out);
  }
  .sh-colhd {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 8px 4px;
    flex: none;
  }
  .sh-colhd h2 {
    font-size: 15px;
    margin: 0 auto 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sh-coltabs {
    display: flex;
    gap: 2px;
    padding: 0 8px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .sh-coltabs button {
    flex: 1;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    min-height: var(--sh-hit);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  .sh-coltabs button svg {
    width: 16px;
    height: 16px;
  }
  .sh-coltabs button.on {
    color: var(--accent);
    border-color: var(--accent);
  }
  .sh-colscroll {
    overflow: auto;
    padding: 6px 8px 12px;
    flex: 1;
    min-height: 0;
    overscroll-behavior: contain;
    position: relative;
  }
  .sh-colfoot {
    flex: none;
    border-top: 1px solid var(--line);
    padding: 6px 8px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  /* ---- main column + top bar ---- */
  .sh-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  .sh-top {
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: var(--sh-top);
    padding: 0 4px;
    flex: none;
  }
  .sh-crumbs {
    display: flex;
    align-items: center;
    gap: 2px;
    min-width: 0;
    font-size: 13px;
    color: var(--muted);
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    padding-left: 4px;
  }
  .sh-crumbs svg {
    width: 14px;
    height: 14px;
    flex: none;
  }
  .sh-crumbs button {
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
    padding: 0 4px;
    min-height: var(--sh-hit);
    border-radius: var(--r-xs);
    font-size: 13px;
  }
  .sh-crumbs button:hover {
    color: var(--ink);
    background: var(--hover);
  }
  .sh-crumbs b {
    font-weight: 500;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
  }
  .sh-saved {
    font-size: 12px;
    color: var(--muted);
    padding: 0 6px;
    white-space: nowrap;
  }
  .sh-scroll {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    border-radius: var(--r-lg);
    padding-bottom: calc(84px + var(--sh-safe-b));
  }

  /* ---- floating bar (bottom centre of the main column) + minimise chips (right edge) ---- */
  .sh-fbar {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    max-width: calc(100% - 24px);
    transition:
      opacity 150ms var(--ease-out),
      transform 150ms var(--ease-out);
    -webkit-user-select: none;
    user-select: none;
  }
  .sh-fbar[hidden] {
    display: none !important;
  }
  .sh-fbar .lab {
    font-size: 13px;
    font-weight: 600;
    padding: 0 10px;
    white-space: nowrap;
  }
  .sh-fbar .sep {
    width: 1px;
    height: 24px;
    background: var(--line);
    margin: 0 4px;
    flex: none;
  }
  .sh-fbar .minb {
    color: var(--muted);
  }
  .sh-fbar .minb svg {
    width: 18px;
    height: 18px;
  }
  .sh-mdock {
    position: fixed;
    right: 0;
    top: calc(12px + var(--sh-top) + 64px);
    z-index: 41;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }
  .sh-mchip {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    height: var(--sh-hit);
    padding: 0 12px 0 8px;
    border: 1.5px solid var(--accent);
    border-right: 0;
    border-radius: 14px 0 0 14px;
    background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
    box-shadow: var(--elev-2);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    animation: shChip 150ms var(--ease-out);
    transition:
      padding 150ms var(--ease-out),
      background 150ms var(--ease-out);
  }
  .sh-mchip:hover {
    padding-right: 16px;
    background: color-mix(in srgb, var(--accent) 24%, var(--surface-2));
  }
  .sh-mchip svg.c {
    width: 14px;
    height: 14px;
  }
  .sh-mchip span {
    color: var(--ink);
  }

  /* ---- scrim, More sheet (fixed, full height, scrolls inside), dialog, pop, toast ---- */
  .sh-scrim {
    position: fixed;
    inset: 0;
    background: var(--scrim);
    z-index: 59;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-2);
  }
  .sh-scrim.on {
    opacity: 1;
    pointer-events: auto;
  }
  .sh-scrim.hi {
    z-index: 79;
  }
  .sh-sheet {
    position: fixed;
    z-index: 80;
    top: 12px;
    bottom: 12px;
    right: max(12px, env(safe-area-inset-right, 0px));
    width: min(var(--sh-sheet), calc(100vw - 24px));
    display: flex;
    flex-direction: column;
    border-radius: var(--r-xl);
    background: var(--surface-1);
    border: 1px solid var(--line);
    box-shadow: var(--elev-3);
    overflow: hidden;
    transform: translateX(calc(100% + 24px));
    visibility: hidden;
    transition:
      transform var(--dur-3) var(--ease-out),
      visibility 0s linear var(--dur-3);
  }
  .sh-sheet.on {
    transform: none;
    visibility: visible;
    transition:
      transform var(--dur-3) var(--ease-out),
      visibility 0s;
  }
  .sh-shd {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 8px 6px 14px;
    flex: none;
  }
  .sh-shd h3 {
    margin: 0;
    font-size: 17px;
  }
  .sh-shd p {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .sh-shd .gr {
    flex: 1;
    min-width: 0;
  }
  .sh-spick {
    flex: none;
    padding: 0 12px 4px;
  }
  .sh-stabs {
    flex: none;
    padding: 0 10px;
  }
  .sh-stabs .utabs {
    border-bottom: 1px solid var(--line);
  }
  .sh-sbody {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px 16px 20px;
  }
  .sh-sft {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px calc(8px + var(--sh-safe-b));
    border-top: 1px solid var(--line);
    background: var(--surface-0);
  }
  .sh-sft .gr {
    flex: 1;
    font-size: 12.5px;
    color: var(--muted);
  }
  .sh-dialog {
    position: fixed;
    z-index: 85;
    left: 50%;
    top: 50%;
    width: min(420px, calc(100vw - 24px));
    transform: translate(-50%, -48%) scale(0.98);
    opacity: 0;
    pointer-events: none;
    transition:
      opacity var(--dur-2),
      transform var(--dur-2) var(--ease-out);
    border-radius: var(--r-xl);
    background: var(--surface-1);
    border: 1px solid var(--line);
    box-shadow: var(--elev-3);
    padding: 18px;
  }
  .sh-dialog.on {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%);
  }
  .sh-dialog h3 {
    margin: 0 0 10px;
    font-size: 17px;
  }
  .sh-dialog .ft {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
  }
  .sh-pop {
    position: fixed;
    z-index: 86;
    min-width: 220px;
    max-width: calc(100vw - 16px);
    max-height: calc(100dvh - 16px);
    overflow: auto;
    border-radius: var(--r-md);
    padding: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    box-shadow: var(--elev-3);
    animation: shPop var(--dur-1) var(--ease-out);
  }
  .sh-pop .mi {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: var(--sh-hit);
    padding: 0 10px;
    border: 0;
    background: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    text-align: left;
    font-size: 14px;
  }
  .sh-pop .mi:hover {
    background: var(--hover);
  }
  .sh-pop .mi svg {
    width: 18px;
    height: 18px;
    color: var(--muted);
  }
  .sh-pop .mi.dng,
  .sh-pop .mi.dng svg {
    color: var(--danger);
  }
  .sh-pop hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 4px 0;
  }
  .sh-pop .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--muted);
    padding: 6px 10px 2px;
  }
  .sh-toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + var(--sh-bottom) + var(--sh-bar) + var(--sh-safe-b));
    transform: translate(-50%, 16px);
    opacity: 0;
    pointer-events: none;
    z-index: 90;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 6px 0 18px;
    border-radius: 999px;
    background: var(--surface-3);
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: var(--elev-3);
    transition:
      opacity var(--dur-2),
      transform var(--dur-2) var(--ease-out);
    max-width: calc(100vw - 24px);
    font-size: 14px;
    font-weight: 500;
  }
  .sh-toast.on {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  .sh-toast span {
    padding-right: 12px;
  }
  .sh-toast button {
    border: 0;
    background: none;
    color: var(--accent);
    font-weight: 700;
    min-height: var(--sh-hit);
    padding: 0 12px;
    cursor: pointer;
    border-radius: 999px;
  }
  .sh-tabbar {
    display: none;
  }
  @keyframes shIn {
    from {
      transform: translateX(-24px);
      opacity: 0;
    }
  }
  @keyframes shChip {
    from {
      transform: translateX(100%);
    }
  }
  @keyframes shPop {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }
  }

  /* ---- phone (640 and under): rail becomes the bottom tab bar, columns become drawers, the sheet fills the screen ---- */
  @media (max-width: 640px) {
    :root {
      --sh-bottom: var(--sh-tabbar);
    }
    .sh-wrap {
      padding: 8px 8px calc(var(--sh-tabbar) + var(--sh-safe-b));
    }
    .sh-rail {
      display: none;
    }
    .sh-side:not([data-state='over']),
    .sh-panel:not([data-state='over']) {
      display: none;
    }
    .sh-tabbar {
      display: flex;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      height: calc(var(--sh-tabbar) + var(--sh-safe-b));
      padding: 0 4px var(--sh-safe-b);
      justify-content: space-around;
      align-items: center;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
    }
    .sh-tabbar .ib {
      flex: 1;
      width: auto;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      font-size: 10px;
      font-weight: 600;
      border-radius: var(--r-sm);
    }
    .sh-tabbar .ib svg {
      width: 22px;
      height: 22px;
    }
    .sh-tabbar .ib .bd {
      position: absolute;
      top: 2px;
      left: calc(50% + 6px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 10px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .sh-fbar {
      bottom: 12px;
    }
    .sh-sheet {
      top: max(8px, env(safe-area-inset-top, 0px));
      bottom: 0;
      right: 0;
      left: 0;
      width: auto;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      transform: translateY(105%);
    }
    .sh-mdock {
      top: calc(8px + var(--sh-top) + 56px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Many sheet tabs: keep each tab its natural width and scroll the row instead of squeezing. */
  .sh-stabs .utabs button {
    flex: none;
  }

  /* ==== 12 Nov 2026 (U3): dialog close, universal minimise button, edge handle, customisable tabs ==== */
  /* every #sh-dialog has a visible close button */
  .sh-dialog > .sh-dx {
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 3;
  }
  .sh-dialog > .sh-dx svg {
    width: 20px;
    height: 20px;
  }
  .sh-dialog h3 {
    padding-right: 40px;
  }
  /* the minimise button: the same in every bar, large, clearly visible; pulses gently until first used */
  .ib.minb,
  .ib.sm.minb {
    width: 44px;
    height: 44px;
    border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: var(--r-md);
    flex: none;
  }
  .ib.minb:hover,
  .ib.sm.minb:hover {
    background: color-mix(in srgb, var(--accent) 24%, transparent);
    color: var(--accent);
  }
  .ib.minb svg,
  .ib.sm.minb svg {
    width: 22px;
    height: 22px;
  }
  .ib.minb.pulse {
    animation: shPulse 1.6s ease-in-out 2;
  }
  @keyframes shPulse {
    0%,
    100% {
      box-shadow: 0 0 0 0 transparent;
    }
    50% {
      box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 30%, transparent);
    }
  }
  /* edge handle: a minimised bar docked to the left or right edge; drag it anywhere, tap to restore */
  .sh-handle {
    position: fixed;
    z-index: 42;
    width: 36px;
    height: 56px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
    color: var(--accent);
    box-shadow: var(--elev-2);
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    transition:
      left 180ms var(--ease-out),
      top 180ms var(--ease-out);
  }
  .sh-handle[data-side='r'] {
    border-right: 0;
    border-radius: 14px 0 0 14px;
  }
  .sh-handle[data-side='l'] {
    border-left: 0;
    border-radius: 0 14px 14px 0;
  }
  .sh-handle svg {
    width: 20px;
    height: 20px;
    pointer-events: none;
  }
  .sh-handle.drag {
    cursor: grabbing;
    transition: none;
    box-shadow: var(--elev-3);
    border-radius: 14px;
    border-width: 1.5px;
  }
  .sh-handle:hover {
    background: color-mix(in srgb, var(--accent) 26%, var(--surface-2));
  }
  /* customisable tabs: scrolling tabs, "+" always visible at the end */
  .sh-coltabs.sh-tabs {
    display: block;
    padding: 0 4px 0 8px;
  }
  .sh-tabs .sh-trow {
    display: flex;
    align-items: stretch;
    gap: 2px;
  }
  .sh-tabs .sh-tscroll {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
    min-width: 0;
  }
  .sh-tabs .sh-tscroll::-webkit-scrollbar {
    display: none;
  }
  .sh-tabs .sh-tscroll button {
    flex: none;
    padding: 0 11px;
  }
  .sh-tabs .sh-tplus {
    flex: none;
    width: var(--sh-hit);
    padding: 0;
    color: var(--accent);
    border-bottom-color: transparent;
  }
  .sh-tabs .sh-tplus svg {
    display: block;
    width: 20px;
    height: 20px;
  }
  .sh-tabs .track {
    margin: 0 4px 0 0;
  }
  .sh-tedit {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: min(52vh, 360px);
    overflow: auto;
    margin: 4px -4px 0;
    padding: 2px 4px;
  }
  .sh-trw {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-2);
    position: relative;
  }
  .sh-trw .gp {
    cursor: grab;
    touch-action: none;
    color: var(--muted);
  }
  .sh-trw .gp svg {
    width: 18px;
    height: 18px;
  }
  .sh-trw input {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    border: 0;
    background: transparent;
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    padding: 0 6px;
    border-radius: var(--r-sm);
  }
  .sh-trw input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .sh-trw .ib[disabled] {
    opacity: 0.35;
    pointer-events: none;
  }
  .sh-trw.drag {
    box-shadow: var(--elev-2);
    z-index: 2;
    border-color: var(--accent);
  }
  .sh-trw .rm {
    color: var(--danger);
  }
  .sh-tpop .mi small {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
  }
  /* ---- clear (x) button inside any text field (Shell.clearable / Shell.autoClear) ---- */
  .sh-clr {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    align-items: center;
  }
  .sh-clr > input,
  .sh-clr > textarea {
    padding-right: 40px !important;
  }
  .sh-clr .sh-clrb {
    position: absolute;
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  .sh-clr.ta .sh-clrb {
    top: 6px;
    transform: none;
  }
  .sh-clr > input:placeholder-shown ~ .sh-clrb,
  .sh-clr > textarea:placeholder-shown ~ .sh-clrb {
    display: none;
  }
  .sh-clr input[type='search']::-webkit-search-cancel-button {
    display: none;
  }
  /* ---- universal AI bar (13 Nov 2026) ---- */
  .sh-aib {
    width: auto;
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-size: 13.5px;
    font-weight: 650;
  }
  .sh-aib svg {
    width: 18px;
    height: 18px;
  }
  .sh-aib:hover {
    color: var(--accent);
  }
  .sh-ai-sc {
    position: fixed;
    inset: 0;
    z-index: 83;
    background: transparent;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-2);
  }
  .sh-ai-sc.on {
    pointer-events: auto;
  }
  .sh-ai {
    position: fixed;
    z-index: 84;
    width: min(380px, calc(100vw - 16px));
    max-height: calc(100dvh - 80px);
    display: flex;
    flex-direction: column;
    border-radius: var(--r-lg);
    background: var(--surface-2);
    border: 1px solid var(--line);
    box-shadow: var(--elev-3);
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px) scale(0.985);
    transform-origin: top right;
    transition:
      opacity var(--dur-2),
      transform var(--dur-2) var(--ease-out),
      visibility 0s var(--dur-2);
  }
  .sh-ai.on {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition:
      opacity var(--dur-2),
      transform var(--dur-2) var(--ease-out),
      visibility 0s;
  }
  .sh-ai-grip {
    display: none;
  }
  .sh-ai-hd {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px 6px 14px;
  }
  .sh-ai-mk {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex: none;
  }
  .sh-ai-mk svg {
    width: 18px;
    height: 18px;
  }
  .sh-ai-tt {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }
  .sh-ai-tt b {
    font-size: 15px;
  }
  .sh-ai-tt small {
    font-size: 12px;
    color: var(--muted);
  }
  .sh-ai-ctx {
    margin: 0 14px 4px;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sh-ai-ctx b {
    color: var(--ink-soft);
    font-weight: 600;
  }
  .sh-ai-body {
    overflow: auto;
    padding: 4px 8px calc(10px + var(--sh-safe-b));
    flex: 1;
    min-height: 0;
  }
  .sh-ai-list {
    display: flex;
    flex-direction: column;
  }
  .sh-ai-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 52px;
    padding: 6px 8px;
    border: 0;
    background: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    text-align: left;
  }
  .sh-ai-row:hover {
    background: var(--hover);
  }
  .sh-ai-row[aria-expanded='true'] {
    background: var(--accent-soft);
  }
  .sh-ai-row > svg {
    width: 20px;
    height: 20px;
    color: var(--accent);
  }
  .sh-ai-row span {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .sh-ai-row b {
    font-size: 14.5px;
    font-weight: 600;
  }
  .sh-ai-row small {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
  }
  .sh-ai-g {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--muted);
    padding: 10px 8px 2px;
  }
  .sh-ai-paste {
    margin: 6px 6px 2px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sh-ai-paste label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .sh-ai-paste textarea {
    min-height: 92px;
    padding: 10px 12px;
    resize: vertical;
  }
  .sh-ai-paste .ft {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .sh-ai-foot {
    margin: 8px 8px 0;
    font-size: 11.5px;
    color: var(--muted);
  }
  @media (max-width: 640px) {
    .sh-aib {
      width: var(--sh-hit);
      padding: 0;
      justify-content: center;
    }
    .sh-aib span {
      display: none;
    }
    .sh-ai-sc {
      background: var(--scrim);
    }
    .sh-ai-sc.on {
      opacity: 1;
    }
    .sh-ai {
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      width: auto;
      max-height: 82dvh;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      transform: translateY(105%);
      transform-origin: bottom center;
    }
    .sh-ai.on {
      transform: none;
    }
    .sh-ai-grip {
      display: block;
      width: 36px;
      height: 4px;
      border-radius: 99px;
      background: var(--line-strong);
      opacity: 0.5;
      margin: 8px auto 0;
    }
    .sh-ai-hd {
      padding-top: 6px;
    }
  }
  /* ==== end shell.css (all) ==== */
  .sh-trw {
    flex-wrap: wrap;
  }
  .sh-trw .sh-tsrc {
    box-sizing: border-box;
    flex: 1 0 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px 4px 46px;
    font-size: 12px;
    color: var(--muted);
  }
  .sh-trw .sh-tsrc select {
    flex: 1 1 0;
    width: 0;
    min-width: 0;
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface-1);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    padding: 0 6px;
  }
  .sh-tcreate {
    width: 100%;
    margin-top: 10px;
    justify-content: center;
  }
  .sh-flab {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 8px;
  }
  .sh-flab .inp {
    display: block;
    width: 100%;
    margin-top: 4px;
    min-height: var(--sh-hit);
    font-weight: 400;
    color: var(--ink);
  }

  /* ---- page: chart colours (labelled in the UI too, never colour alone) ---- */
  :root {
    --c1: #a08cff;
    --c2: #5fd39a;

  function impCheck(txt) {
    const m = [],
      bad = (s) => {
        m.push([0, s])
        return { ok: 0, m }
      }
    if (txt.length > 2e6) return bad('File is over 2 MB')
    let o
    try {
      o = JSON.parse(txt)
    } catch (_) {
      return bad('This is not valid JSON')
    }
    if (!o || o.format !== 'lntemplate')
      return bad('Not a Learning Notes template file')
    if (o.version !== 1)
      return bad('Version ' + o.version + ' is not supported')
    if (/<script|javascript:|function\s*\(|=>|eval\(/i.test(txt))
      return bad('Contains something that looks like code')
    if (!Array.isArray(o.pages) || !o.pages.length) return bad('No pages found')
    const ws = [].concat.apply(
      [],
      o.pages.map((p) => p.widgets || []),
    )
    if (ws.some((x) => !W[x.type]))
      return bad('Has a widget this app does not know')
    if (ws.some((x) => !['S', 'M', 'L'].includes(x.size)))
      return bad('A widget size is not S, M or L')
    m.push([1, 'Our template format, version 1'])
    m.push([1, 'Data only, no code'])
    m.push([
      1,
      ws.length + ' widgets, ' + (o.databases || []).length + ' databases',
    ])
    m.push([1, 'IDs will be remapped on import'])
    if (o.rows) m.push([1, 'Includes rows (you choose below)'])
    return { ok: 1, o, m }
  }

  const TODAYD = new Date(2026, 10, 12)

  const iso = (d) =>

  const pdt = (s) => {

  const PRESETS = [

  function rangeOf(p) {
    const T = TODAYD,
      y = T.getFullYear(),
      m = T.getMonth(),

    switch (p.kind) {
      case 'day':
        return [T, T]
      case 'week':
        return [addD(T, -dow), addD(T, 6 - dow)]
      case 'month':
        return [new Date(y, m, 1), new Date(y, m + 1, 0)]
      case 'lastmonth':
        return [new Date(y, m - 1, 1), new Date(y, m, 0)]
      case 'quarter':

      case 'year':

      case 'last30':

      case 'last4w':
        return [addD(T, -27), T]

    let a = pdt(p.from || iso(T)),
      b = pdt(p.to || p.from || iso(T))
    if (b < a) {

      a = b

      ic('x') +
      'Cancel</button><button type="button" class="btn pri" data-pe="ok" aria-label="Confirm">' +
      ic('check') +
      'Done</button></div>'
    )
  }
  function peOpen() {
    PE = true
    Shell.dialog(peHTML(), (d) => {
      d.onclick = (e) => {
        const x = e.target.closest('[data-pe]')
        if (!x) return
        const b = board(),
          B = ens(b),
          it = B.items,
          p = x.dataset.pe.split(':'),
          a = p[0],
          id = p[1],
          i = it.findIndex((q) => q.id === id)
        if (a === 'done' || a === 'ok') {
          PESNAP = null
          Shell.dialogClose()
          return
        }
        if (a === 'cancel') {
          const v = PESNAP ? JSON.parse(PESNAP) : null
          if (v) b.bar = v
          else delete b.bar
          PESNAP = null
          save()
          render()
          Shell.dialogClose()
          return
        }
        if (a === 'up' && i > 0) {
          it.splice(i - 1, 0, it.splice(i, 1)[0])
          PEF = 'up:' + id
        } else if (a === 'dn' && i < it.length - 1) {
          it.splice(i + 1, 0, it.splice(i, 1)[0])
          PEF = 'dn:' + id
        } else if (a === 'rm') {
          if (it.length < 2) return
          it.splice(i, 1)
          if (B.cur === id) B.cur = it[0].id
          PEF = null
        } else if (a === 'add') {
          it.push({ id: 'p' + uid(), kind: id, label: pName(id) })
          PEF = null
        } else if (a === 'addc') {
          datePick(
            { title: 'Custom range', from: TODAYD, to: addD(TODAYD, 6) },
            (f, t) => {
              it.push({
                id: 'c' + uid(),
                kind: 'custom',
                label: 'Custom range',
                from: iso(f),
                to: iso(t),
              })
              save()
              render()
              peOpen()
            },
            () => peOpen(),
          )
          return
        } else if (a === 'dates' && i >= 0) {
          const r = rangeOf(it[i])
          datePick(
            { title: 'Change dates', from: r[0], to: r[1] },
            (f, t) => {
              it[i].from = iso(f)
              it[i].to = iso(t)
              save()
              render()
              peOpen()
            },
            () => peOpen(),
          )
          return
        } else if (a === 'reset') {
          b.bar = defBar(b.tpl)
        } else if (a === 'example') {
          B.name = 'Exam time'
          ;['day', 'week'].forEach((k) => {
            if (!it.some((q) => q.kind === k))
              it.push({ id: 'p' + uid(), kind: k, label: pName(k) })
          })
          if (!it.some((q) => q.label === 'Exam week'))
            it.push({
              id: 'c' + uid(),
              kind: 'custom',
              label: 'Exam week',
              from: '2026-11-30',
              to: '2026-12-06',
            })
          PEF = null
        } else return
        save()
        render()
        peOpen()
      }
      d.onchange = (e) => {
        const t = e.target,
          b = board(),
          B = ens(b)
        if (t.dataset.peName != null) {
          B.name = t.value.trim().slice(0, 24) || 'Period'
          t.value = B.name
        } else if (t.dataset.pl) {
          const q = B.items.find((z) => z.id === t.dataset.pl)
          if (q) {
            q.label = t.value.trim().slice(0, 24) || pName(q.kind)
            t.value = q.label
          }
        } else return
        save()
        render()
        const s = d.querySelector('#pe-steps')
        if (s) s.innerHTML = stepsHTML(B)
      }
    })
    if (PEF) {
      let f = document.querySelector('#sh-dialog [data-pe="' + PEF + '"]')
      if (!f || f.disabled) {
        const q = PEF.split(':')
        f = document.querySelector(
          '#sh-dialog [data-pe="' +
            (q[0] === 'up' ? 'dn' : 'up') +
            ':' +
            q[1] +
            '"]',
        )
      }
      if (f && !f.disabled) f.focus()
      PEF = null
    }
  }

  /* ---- HT3: Top 3 reorder by drag (with a drop line) AND by up/down buttons ---- */
  function top3Body() {
    const t = S.tasks.filter((x) => x.top),
      n = t.length
    return (
      '<div class="t3l" data-t3l>' +
      t
        .map(
          (x, i) =>
            '<div class="row t3' +
            (x.done ? ' done' : '') +
            '" data-tid="' +
            x.id +
            '"><button type="button" class="ib sm gp" data-t3grip="' +
            x.id +
            '" aria-label="Reorder ' +
            esc(x.t) +
            '. Drag it, or hold Alt and press an arrow key." title="Drag to reorder">' +
            ic('grip') +
            '</button>' +
            check(x.done, 'tick', x.id) +
            '<span class="tx">' +
            esc(x.t) +
            '</span>' +
            '<button type="button" class="ib sm" data-a="t3up" data-id="' +
            x.id +
            '" aria-label="Move up: ' +
            esc(x.t) +
            '"' +
            (i ? '' : ' disabled') +
            '>' +
            ic('up') +
            '</button><button type="button" class="ib sm" data-a="t3dn" data-id="' +
            x.id +
            '" aria-label="Move down: ' +
            esc(x.t) +
            '"' +
            (i < n - 1 ? '' : ' disabled') +
            '>' +
            ic('down') +
            '</button><button type="button" class="ib sm" data-a="untop" data-id="' +
            x.id +
            '" aria-label="Remove from Top 3">' +
            ic('x') +
            '</button></div>',
        )
        .join('') +
      '<div class="dropl" hidden></div></div>' +
      (n < 3
        ? '<button type="button" class="lnk" data-a="addtop">+ Add to Top 3</button>'
        : '')
    )
  }
  const t3pos = () => {
    const o = {}
    $$('.row.t3').forEach(
      (r) => (o[r.dataset.tid] = r.getBoundingClientRect().top),
    )
    return o
  }
  function flip(pos) {
    $$('.row.t3').forEach((r) => {
      const o = pos[r.dataset.tid]
      if (o == null) return
      const d = o - r.getBoundingClientRect().top
      if (Math.abs(d) < 1) return
      r.style.transition = 'none'
      r.style.transform = 'translateY(' + d + 'px)'
      r.getBoundingClientRect()
      requestAnimationFrame(() => {
        r.style.transition = 'transform 180ms var(--ease-out)'
        r.style.transform = ''
        setTimeout(() => {
          r.style.transition = ''
        }, 240)
      })
    })
  }
  function moveTop(id, delta, pos, ret) {
    const idxs = []
    S.tasks.forEach((x, i) => {
      if (x.top) idxs.push(i)
    })
    const items = idxs.map((i) => S.tasks[i]),
      from = items.findIndex((x) => String(x.id) === String(id)),
      to = from + delta
    if (from < 0 || to < 0 || to >= items.length || to === from) return
    pos = pos || t3pos()
    items.splice(to, 0, items.splice(from, 1)[0])
    idxs.forEach((p, k) => {
      S.tasks[p] = items[k]
    })
    save()
    render()
    flip(pos)
    say(items[to].t + ', now number ' + (to + 1) + ' of ' + items.length)
    const q = (s) =>
      document.querySelector('.row.t3[data-tid="' + id + '"] ' + s)
    let f =
      ret === 'grip'
        ? q('[data-t3grip]')
        : q('[data-a="' + (delta < 0 ? 't3up' : 't3dn') + '"]')
    if (!f || f.disabled)
      f = q('[data-a="' + (delta < 0 ? 't3dn' : 't3up') + '"]')
    if (f && !f.disabled) f.focus()
  }
  let t3 = null
  document.addEventListener('pointerdown', (e) => {
    const g = e.target.closest && e.target.closest('[data-t3grip]')
    if (!g || e.button) return
    e.preventDefault()
    const list = g.closest('[data-t3l]'),
      row = g.closest('.row'),
      rows = [...list.querySelectorAll('.row.t3')],
      rects = rows.map((r) => r.getBoundingClientRect()),
      i = rows.indexOf(row)
    t3 = {
      g,
      list,
      row,
      rects,
      from: i,
      to: i,
      y0: e.clientY,
      lt: list.getBoundingClientRect().top,
      line: list.querySelector('.dropl'),
      id: row.dataset.tid,
      pid: e.pointerId,
    }
    try {
      g.setPointerCapture(e.pointerId)
    } catch (_) {}
    row.classList.add('lifted')
  })
  document.addEventListener('pointermove', (e) => {
    if (!t3 || e.pointerId !== t3.pid) return
    const T = t3,
      R = T.rects,
      h = R[T.from].height,
      dy = Math.max(
        R[0].top - R[T.from].top,
        Math.min(R[R.length - 1].top - R[T.from].top, e.clientY - T.y0),
      )
    T.row.style.transform = 'translateY(' + dy + 'px)'
    const c = R[T.from].top + dy + h / 2
    let to = 0
    R.forEach((r, i) => {
      if (i !== T.from && r.top + r.height / 2 <= c + 1) to++
    })
    T.to = to
    if (to === T.from) {
      T.line.hidden = true
    } else {
      T.line.hidden = false
      T.line.style.top = (to > T.from ? R[to].bottom : R[to].top) - T.lt + 'px'
    }
  })
  function t3end(e, cancel) {
    if (!t3) return
    const T = t3
    t3 = null
    const pos = t3pos()
    T.line.hidden = true
    try {
      T.g.releasePointerCapture(T.pid)
    } catch (_) {}
    if (cancel || T.to === T.from) {
      T.row.classList.remove('lifted')
      T.row.style.transform = ''
      return
    }
    T.row.classList.remove('lifted')
    moveTop(T.id, T.to - T.from, pos, 'grip')
  }
  document.addEventListener('pointerup', (e) => {
    if (t3 && e.pointerId === t3.pid) t3end(e)
  })
  document.addEventListener('pointercancel', (e) => {
    if (t3 && e.pointerId === t3.pid) t3end(e, true)
  })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && t3) {
      t3end(e, true)
      return
    }
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      const r = e.target.closest && e.target.closest('.row.t3')
      if (r) {
        e.preventDefault()
        moveTop(
          r.dataset.tid,
          e.key === 'ArrowUp' ? -1 : 1,
          null,
          e.target.matches('[data-t3grip]') ? 'grip' : 'btn',
        )
      }
    }
  })

  /* ---- widget drag in Edit mode: a card follows the pointer, a drop line shows the place, nothing jumps until you let go ---- */
  let drag = null
  document.addEventListener('pointerdown', (e) => {
    let g = e.target.closest && e.target.closest('[data-grip]')
    if (
      !g &&
      S.edit &&
      e.target.closest &&
      !e.target.closest('button,a,input,textarea,select,.ib,.btn')
    ) {
      g = e.target.closest('.w')
    }
    if (!g || !(S.edit || g.hasAttribute('data-cg'))) return
    const w = g.closest('.w'),
      grid = $('#grid'),
      sc = $('.sh-scroll')
    drag = {
      w,
      grid,
      sc,
      id: w.dataset.id,
      x0: e.clientX,
      y0: e.clientY,
      s0: sc.scrollTop,
      t: null,
      after: false,
      pid: e.pointerId,
      line: null,
    }
    w.classList.add('lift')
    try {
      getSelection().removeAllRanges()
    } catch (_) {}
    try {
      grid.setPointerCapture(e.pointerId)
    } catch (_) {}
    e.preventDefault()
  })
  document.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return
    const D = drag,
      r = D.sc.getBoundingClientRect()
    if (e.clientY < r.top + 50) D.sc.scrollTop -= 12
    else if (e.clientY > r.bottom - 50) D.sc.scrollTop += 12
    D.w.style.transform =
      'translate(' +
      (e.clientX - D.x0) +
      'px,' +
      (e.clientY - D.y0 + D.sc.scrollTop - D.s0) +
      'px) scale(1.02)'
    const t = document
      .elementsFromPoint(e.clientX, e.clientY)
      .find((x) => x.classList && x.classList.contains('w') && x !== D.w)
    if (!t) {
      if (D.line) D.line.hidden = true
      D.t = null
      return
    }
    const b = t.getBoundingClientRect(),
      gr = D.grid.getBoundingClientRect()
    D.t = t
    D.after =
      b.width > gr.width * 0.7
        ? e.clientY > b.top + b.height / 2
        : e.clientX > b.left + b.width / 2
    if (!D.line) {
      D.line = document.createElement('div')
      D.line.className = 'dropl v'
      D.grid.appendChild(D.line)
    }
    D.line.hidden = false
    if (b.width > gr.width * 0.7) {
      D.line.className = 'dropl'
      D.line.style.cssText =
        'left:0;right:0;width:auto;height:3px;top:' +
        ((D.after ? b.bottom + 6 : b.top - 6) - gr.top) +
        'px'
    } else {
      D.line.className = 'dropl v'
      D.line.style.cssText =
        'top:' +
        (b.top - gr.top) +
        'px;height:' +
        b.height +
        'px;left:' +
        ((D.after ? b.right + 6 : b.left - 6) - gr.left - 1.5) +
        'px'
    }
  })
  function endDrag(e, cancel) {
    if (!drag) return
    const D = drag
    drag = null
    D.w.classList.remove('lift')
    D.w.style.transform = ''
    if (D.line) D.line.remove()
    const f = findW(D.id)
    if (!cancel && D.t && f) {
      const ids = [...D.grid.querySelectorAll('.w')]
          .map((x) => x.dataset.id)
          .filter((i) => i !== D.id),
        at = ids.indexOf(D.t.dataset.id) + (D.after ? 1 : 0)
      ids.splice(at, 0, D.id)
      const by = Object.fromEntries(f.L.map((w) => [w.id, w]))
      const nl = ids.map((i) => by[i]).filter(Boolean)
      f.L.length = 0
      nl.forEach((x) => f.L.push(x))
      save()
    }
    render()
  }
  document.addEventListener('pointerup', (e) => {
    if (drag && e.pointerId === drag.pid) endDrag(e)
  })
  document.addEventListener('pointercancel', (e) => {
    if (drag && e.pointerId === drag.pid) endDrag(e, true)
  })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drag) endDrag(e, true)
  })

  /* ---- v2 events ---- */
  Object.assign(A, {
    t3up(b) {
      moveTop(b.dataset.id, -1, null, 'btn')
    },
    t3dn(b) {
      moveTop(b.dataset.id, 1, null, 'btn')
    },
    per(b) {
      const B = ens(board())
      B.cur = b.dataset.id
      save()
      render()
    },
    pedit() {
      const b = board()
      PESNAP = JSON.stringify(b.bar || null)
      peOpen()
    },
    words() {
      Shell.dialog(
        '<h3>What these words mean</h3><div class="dscroll"><p class="mini" style="margin:0 0 8px">Every widget is built from a few simple parts. This is what each one is, in plain words.</p><dl class="gl">' +
          GLOSS.map((g) => '<dt>' + g[0] + '</dt><dd>' + g[1] + '</dd>').join(
            '',
          ) +
          '</dl></div><div class="ft"><button type="button" class="btn pri" data-w="done">Got it</button></div>',
        (d) => {
          d.onclick = (e) => {
            if (e.target.closest('[data-w=done]')) Shell.dialogClose()
          }
        },
      )
    },
    pdates() {
      const bd = board(),
        r = rangeOf(curP(bd))
      datePick(
        { title: 'Pick dates', from: r[0], to: r[1] },
        (f, t) => {
          const B = ens(board())
          let p = B.items.find(
            (x) => x.kind === 'custom' && x.label === 'Custom',
          )
          if (!p) {
            p = { id: 'c' + uid(), kind: 'custom', label: 'Custom' }
            B.items.push(p)
          }
          p.from = iso(f)
          p.to = iso(t)
          B.cur = p.id
          save()
          render()
          Shell.dialogClose()
        },
        () => Shell.dialogClose(),
      )
    },
    mur() {
      S.hideUR = !S.hideUR
      save()
      render()
      Shell.sheet.draw()
    },
  })

  /* ---- live timer tick + start ---- */
  setInterval(
    () => $$('[data-tm]').forEach((n) => (n.textContent = tmTxt())),
    1000,
  )
  Shell.mount({
    space: 'home',
    onSpace: (k) => {
      if (k !== 'home') {
        Shell.toast('Only Home is part of this mock-up')
        return false
      }
    },
    onCorner: (q) => Shell.toast('Not part of this mock-up: ' + q),
    onChange: (k) => {
      if (k === 'mode' || k === 'theme') render()
    },
  })
  Shell.setMode('beg')
  histReset()
  render()
  Shell.autoClear(cOK)
</script>
