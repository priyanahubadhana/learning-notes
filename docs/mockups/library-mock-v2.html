<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library Mock-up v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="shell.css">
<style>
/* ---- Library screen only. Everything shared comes from shell.css ---- */
.lib{max-width:1100px;margin:0 auto;padding:4px 16px 24px}
.lh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 6px}
.lh h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 auto 0 0;font-weight:700}
.lh h1 small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:2px}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.lrow.nw{flex-wrap:nowrap}
.sh-clr{flex:1;min-width:140px}
.sh-trw .sh-clr{flex:1;min-width:0}.sh-dialog .sh-clr{min-width:0;width:100%}
.rw{margin:6px 0}
.chips{display:flex;gap:6px;padding-bottom:2px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:none;transition:background var(--dur-1),color var(--dur-1)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip .n{font-size:11.5px;opacity:.7;font-weight:700}
.chip svg{width:16px;height:16px}
.chip.add{border-style:dashed;color:var(--muted)}
.sel{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.sp{flex:1}
#libtabs,#bptab{margin:2px 0 6px}
#libtabs .sh-tscroll button,#bptab .sh-tscroll button,#libtabs .sh-tplus,#bptab .sh-tplus{background:none;border:0;border-bottom:2px solid transparent;min-height:44px;min-width:44px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 14px}
#libtabs .sh-tscroll button:hover,#bptab .sh-tscroll button:hover{color:var(--ink)}
#libtabs .sh-tscroll button.on,#bptab .sh-tscroll button.on{color:var(--accent);border-bottom-color:var(--accent)}
#libtabs .sh-tplus,#bptab .sh-tplus{padding:0;color:var(--accent)}
#libtabs .sh-trow,#bptab .sh-trow{border-bottom:1px solid var(--line)}
.cols{display:flex;gap:2px;align-items:center}
.cdot{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:50%;position:relative}
.cdot i{width:20px;height:20px;border-radius:50%;background:var(--c);display:block;box-shadow:0 0 0 2px var(--surface-0),0 0 0 3px transparent;transition:box-shadow var(--dur-1)}
.cdot[aria-pressed=true] i{box-shadow:0 0 0 2px var(--surface-0),0 0 0 4px var(--ink-soft)}
.cdot:hover{background:var(--hover)}
/* books grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:18px 16px;list-style:none;margin:12px 0;padding:0}
.bk{position:relative;display:flex;flex-direction:column;height:100%;border-radius:var(--r-lg);background:var(--surface-0);border:1px solid var(--line);overflow:hidden;transition:box-shadow var(--dur-2),transform var(--dur-2) var(--ease-out)}
.bk:hover{box-shadow:var(--elev-2)}
.bk.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cvb{display:block;width:100%;aspect-ratio:3/4;border:0;padding:0;cursor:pointer;background:var(--surface-2);overflow:hidden;position:relative}
.cv{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px;text-align:left;color:#fff;background:linear-gradient(150deg,hsl(var(--h) 52% 44%),hsl(calc(var(--h) + 38) 58% 26%));position:relative}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.08) 6%,transparent 12%);pointer-events:none}
.cv b{font-size:15px;line-height:1.2;letter-spacing:-.01em;font-weight:700}
.cv i{font-style:normal;font-size:11.5px;opacity:.85}
.cv .kic svg{width:30px;height:30px;stroke-width:1.4}
.cv.kind{justify-content:center;align-items:center;text-align:center;gap:6px}
.cm{position:absolute;top:2px;right:2px;background:color-mix(in srgb,var(--surface-0) 78%,transparent);border-radius:50%;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bi{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;flex:1}
.bi h3{font-size:14px;line-height:1.3;margin:0;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bi p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi .cta{margin-top:auto}
.pb{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--accent);border-radius:99px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;color:var(--muted)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.st.reading{color:var(--accent)}.st.reading::before{background:var(--accent)}
.st.finished{color:var(--success)}.st.finished::before{background:var(--success)}
.chk{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;z-index:2}
.chk::before{content:"";position:absolute;inset:-8px}
.chk svg{width:16px;height:16px;opacity:0}.bk.sel .chk{background:var(--accent);border-color:var(--accent)}.bk.sel .chk svg{opacity:1}
/* list view */
.lst{list-style:none;margin:10px 0;padding:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface-0)}
.lst>li+li{border-top:1px solid var(--line)}
.lr{display:grid;grid-template-columns:var(--cols);align-items:center;gap:10px;padding:6px 10px;min-height:60px}
.lr.hd{min-height:36px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:650;background:var(--surface-1)}
.lr .t{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;text-align:left;cursor:pointer;min-height:48px;padding:0}
.lr .t:hover b{color:var(--accent)}
.lr .mc{width:32px;height:44px;border-radius:5px;overflow:hidden;flex:none}.lr .mc .cv{padding:3px;font-size:0}.lr .mc .cv b,.lr .mc .cv i{display:none}.lr .mc .kic svg{width:16px;height:16px}
.lr .tt{min-width:0}.lr .tt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .tt span{font-size:12px;color:var(--muted)}
.lr .c{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.lr .pbw{min-width:60px}
.lr input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
@container lib (max-width:700px){.lr .c-op,.lr .c-hl,.lr .c-tg{display:none}}
@container lib (max-width:520px){.lr .c-st{display:none}}
#main{container:lib/inline-size}
/* drop + status */
.drop{display:none;border:2px dashed var(--accent);border-radius:var(--r-lg);padding:18px;text-align:center;color:var(--accent);background:var(--accent-soft);margin:8px 0;font-weight:600}
.lib.dragging .drop{display:block}
.busy{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--line);font-size:13.5px;margin:8px 0}
.busy .pb{flex:1;margin:0;max-width:160px}.busy .pb i{animation:bz 1s ease-in-out infinite alternate;width:40%}
@keyframes bz{to{margin-left:60%}}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .ei{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}.empty .ei svg{width:28px;height:28px}
.empty h3{color:var(--ink);font-size:17px;margin:0 0 4px}.empty p{margin:0 0 14px;font-size:14px}
/* knowledge */
.kn{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:8px}
.kn.pane{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.klist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.kr{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-0);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;min-height:64px;align-items:flex-start;transition:background var(--dur-1),border-color var(--dur-1)}
.kr:hover{background:var(--surface-1)}.kr[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.kr .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--c)}
.kr .bd{flex:1;min-width:0}
.kr .meta{display:block}.kr .q{margin:0;font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kr .nt{margin:4px 0 0;font-size:13px;color:var(--ink-soft);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kr .meta{margin:4px 0 0;font-size:12px;color:var(--muted)}
.kr .stx{color:var(--warn);flex:none}.kr .stx svg{width:16px;height:16px;fill:currentColor}
.kr input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.snip{height:56px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--surface-3) 8px 16px);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;color:var(--muted);margin-top:4px}
.pv{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.pv h3{margin:0;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650}
.pv .ctx{font-size:14px;line-height:1.6;color:var(--muted)}
.pv .ctx mark{background:color-mix(in srgb,var(--c) 40%,transparent);color:var(--ink);border-radius:4px;padding:1px 2px}
.pv textarea{width:100%;min-height:72px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-0);padding:10px 12px;resize:vertical;font-size:14px}
.pv .acts,.acts{display:flex;flex-wrap:wrap;gap:8px}
.pv .hd{display:flex;align-items:center;gap:8px}.pv .hd .sp{flex:1}
.tg{display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 10px;min-height:32px;border-radius:999px;background:var(--hover);font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.tg button{width:28px;height:28px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.tg button::before{content:"";position:absolute;inset:-8px}
.tg svg{width:14px;height:14px}
.tg.ro{padding:0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctxh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.lsc{position:fixed;inset:0;z-index:81;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity var(--dur-2)}.lsc.on{opacity:1;pointer-events:auto}
.lsh{position:fixed;z-index:82;left:50%;width:min(560px,100%);bottom:0;top:10%;transform:translate(-50%,102%);transition:transform var(--dur-3) var(--ease-out),visibility 0s var(--dur-3);visibility:hidden;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--elev-3);display:flex;flex-direction:column;overflow:hidden}
.lsh.on{transform:translate(-50%,0);visibility:visible;transition:transform var(--dur-3) var(--ease-out),visibility 0s}
.lsh .hd{display:flex;align-items:center;padding:8px 8px 0 16px;font-weight:650}.lsh .hd span{flex:1}
.lsh .bd{overflow:auto;padding:4px 16px calc(16px + var(--sh-safe-b));flex:1}
.lsh .pv{position:static;border:0;padding:0;background:none}
/* bank / cards / panels */
.cardx{background:var(--surface-0);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin:12px 0}
.cardx h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.cardx>p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow .gr{flex:1;min-width:0}.frow .gr b{display:block;font-size:14px;font-weight:600}.frow .gr span{font-size:12.5px;color:var(--muted)}
.dq{display:flex;flex-direction:column;gap:10px}
.dh{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.dh.done{opacity:.55}
.dh q{display:block;quotes:none;font-size:15px;line-height:1.5;margin-bottom:4px}
.dh .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.thg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.th{border:1px solid var(--line);background:var(--surface-0);border-radius:var(--r-md);padding:14px;text-align:left;cursor:pointer;min-height:84px}
.th:hover{background:var(--surface-1)}.th b{display:block;font-size:15px}.th span{font-size:12.5px;color:var(--muted)}
.bh{display:flex;gap:14px;align-items:center;max-width:440px;border:1px solid var(--line);background:var(--surface-0);border-radius:var(--r-lg);padding:12px;margin:8px 0;box-shadow:var(--elev-1,none)}
.bh .bc{width:84px;flex:none;aspect-ratio:3/4;border-radius:10px;overflow:hidden}
.bh .bc .cv{padding:10px 8px}.bh .bc .cv b{font-size:12px}.bh .bc .cv i{font-size:10px}
.bh .bm{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bh h2{margin:0;font-size:17px;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bh .sub{font-size:12.5px;color:var(--muted)}
.bh .pbr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.bh .pbr .pb{flex:1;max-width:140px;margin:0}
.bh .acts{margin-top:2px;flex-wrap:nowrap;align-items:center}
.bx{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-1);padding:4px 14px;margin:8px 0}
.bxr{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}.bxr:first-child{border-top:0}
.bxl{width:92px;flex:none;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:650;min-height:44px;display:flex;align-items:center}
.bxv{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:44px}.bxv .tgx{width:100%}.bxv .tgx .lrow{margin:6px 0 0}
.tg.sug{background:transparent;border:1px dashed var(--accent);color:var(--accent);padding:0 2px 0 10px;gap:6px}
.tg.sug button{color:var(--accent)}.tg.sug button.ok{background:var(--accent-soft)}
.tg .aut{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.tg.auto{padding-right:4px}
.kst{position:relative;align-items:stretch}.kst .kx{align-self:center;flex:none}
.tmap{list-style:none;margin:0;padding:0}.tmap .tmap{margin-left:18px;padding-left:10px;border-left:1px solid var(--line)}
.tn{display:flex;align-items:center;gap:4px;min-height:44px}
.tn .tl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:none;border-radius:var(--r-sm);padding:0 8px;cursor:pointer;text-align:left;font-size:14.5px}
.tn .tl:hover{background:var(--hover)}.tn .tl svg{width:18px;height:18px;color:var(--muted)}.tn .tl .n{font-size:12px;color:var(--muted)}
.tn .tc{display:flex;flex:none}.tn .tc .ib{width:40px}
.sg{border:1px dashed var(--accent);border-radius:var(--r-md);padding:12px 14px;margin:8px 0;background:var(--accent-soft)}
.sg .sgh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.sg .sgh b{font-size:15px}.sg .acts{margin-top:10px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:8px 0}
.sk{border-radius:var(--r-md);background:color-mix(in srgb,var(--c) 30%,var(--surface-0));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);padding:10px;display:flex;flex-direction:column;gap:4px}
.sk textarea{width:100%;min-height:96px;border:0;background:transparent;resize:vertical;font-size:14px;line-height:1.5;padding:2px}
.skf{display:flex;align-items:center}
.sumbox{width:100%;min-height:150px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-0);padding:12px 14px;font-size:15px;line-height:1.6;resize:vertical}
.lay{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.lay div{flex:1;min-width:120px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;background:var(--surface-0)}.lay b{display:block;font-size:20px}.lay span{font-size:12px;color:var(--muted)}
.lay div.on{border-color:var(--accent);background:var(--accent-soft)}
.qa{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--surface-0);margin:8px 0}.qa b{display:block;margin-bottom:4px}.qa span{font-size:13.5px;color:var(--ink-soft)}
.rs{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:var(--r-sm);padding:6px 8px;min-height:48px;cursor:pointer;font-size:13.5px}
.rs:hover,.rs.on{background:var(--hover)}.rs.on{color:var(--accent);font-weight:600}.rs small{display:block;color:var(--muted);font-size:11.5px}
.rs .g{flex:1;min-width:0}
.ptile{flex:none;min-width:120px;min-height:44px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-0);padding:8px 12px;text-align:left;cursor:pointer;font-size:13px;font-weight:600}
.ptile[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ptile small{display:block;font-weight:500;color:var(--muted)}
.sbp{display:flex;gap:8px;padding:0 0 4px;overflow-x:auto;scrollbar-width:none}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.grp{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:18px 0 8px}
.hint{font-size:12.5px;color:var(--muted)}
.hm{border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:10px 12px;background:var(--surface-1);font-size:13px}
.sh-side .sb-i{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:0;background:none;border-radius:var(--r-sm);text-align:left;padding:0 8px;cursor:pointer;font-size:14px;color:var(--ink)}
.sb-i:hover{background:var(--hover)}.sb-i[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sb-i span.g{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sb-i .n{font-size:12px;color:var(--muted)}
.sb-h{display:flex;align-items:center;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:10px 8px 2px}.sb-h span{flex:1}
.demo-b{min-height:36px}
.ro-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
 .lh h1{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
 .bh .bc{width:72px}.sh-demo .t{flex-basis:100%}.bxr{flex-direction:column;gap:2px}.bxl{width:auto;min-height:28px}.bxv{width:100%}
 .lib{padding:4px 8px 24px}
}
/* ===== Library v2: one place for where, one row for how, content first. Card system from toolbar v7 ===== */
:root{--c7-bg:color-mix(in srgb,var(--surface-1) 90%,transparent);--c7-shadow:0 1px 2px rgba(0,0,0,.10),0 18px 44px -12px rgba(0,0,0,.34);--c7-hi:inset 0 1px 0 rgba(255,255,255,.10);--well:var(--hover);--spring:cubic-bezier(.34,1.45,.64,1);--out7:cubic-bezier(.2,.8,.2,1)}
.lib{max-width:1120px;padding:6px 20px 32px}
/* header: title, shelf picker (only when the side panel is closed), one Add */
.lh2{display:flex;align-items:center;gap:10px;margin:2px 0 8px;min-height:48px}

function walk(nodes,f,d,par){d=d||1;for(const n of nodes){f(n,d,par||null);if(n.kids&&n.kids.length)walk(n.kids,f,d+1,n)}}
function findNode(name){let r=null;const k=String(name).toLowerCase();walk(S.tree,(n,d,p)=>{if(!r&&n.n.toLowerCase()===k)r={n,d,p}});return r}
function family(t){const f=findNode(t);const out=[t];if(f)walk(f.n.kids||[],n=>out.push(n.n),f.d+1,f.n);return out}
const height=n=>1+Math.max(0,...(n.kids||[]).map(height));
function removeNode(name){const f=findNode(name);if(!f)return null;const arr=f.p?f.p.kids:S.tree;arr.splice(arr.indexOf(f.n),1);return f.n}
function canPlace(name,parent){const pf=findNode(parent);if(!pf)return false;const ex=findNode(name);if(ex&&ex.d===1)return false;const node=ex?ex.n:{n:name,kids:[]};if(ex&&findNode(parent)&&(function inside(n){return(n.kids||[]).some(k=>k.n.toLowerCase()===parent.toLowerCase()||inside(k))})(node))return false;return pf.d+height(node)<=3}
function placeUnder(name,parent){if(!canPlace(name,parent))return false;const pf=findNode(parent),ex=findNode(name);const node=ex?ex.n:{n:name,kids:[]};if(ex)removeNode(name);pf.n.kids=pf.n.kids||[];pf.n.kids.push(node);return true}
function parentsFor(h){const out=[];walk(S.tree,(n,d)=>{if(d+h<=3)out.push({n:n.n,d})});return out}
function itemsByTag(t){const fam=family(t);return{bs:S.books.filter(b=>(b.tags||[]).some(x=>fam.includes(x))),hs:S.hls.filter(h=>!!bk(h.b)&&h.tags.some(x=>fam.includes(x)))}}
const cntTag=t=>{const {bs,hs}=itemsByTag(t);return bs.length+hs.length};
function suggestTags(it){const txt=itemText(it),no=U.sugNo[it.id]||[];
 const sc=Object.entries(TAGMAP).map(([t,ks])=>[t,ks.reduce((n,k)=>n+(txt.includes(k)?1:0),0)]).filter(([t,n])=>n>0&&!it.tags.includes(t)&&!no.includes(t)&&!S.tagMem[t]);
 sc.sort((a,b)=>b[1]-a[1]);let out=sc.slice(0,4).map(x=>x[0]);
 if(!out.length)out=['ideas'].filter(t=>!it.tags.includes(t)&&!no.includes(t));return out}
function autoApply(it){const txt=itemText(it),out=[];
 for(const t in S.tagMem){const m=S.tagMem[t];if(it.tags.includes(t))continue;
  if((m.kw||[]).some(k=>txt.includes(k))||(m.words||[]).filter(w=>txt.includes(w)).length>=2){it.tags.push(t);out.push(t)}}
 return out}
function remember(t,it){const txt=itemText(it),f={};(txt.match(/[a-z]{6,}/g)||[]).forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1});
 S.tagMem[t]={kw:[...new Set([t.replace(/-/g,' '),...(TAGMAP[t]||[])])],words:Object.keys(f).sort((a,b)=>f[b]-f[a]).slice(0,6)}}

 case'tpcreate':{const par=($('#tpparent')||{}).value||'';const its=tpItems();act('Create tag',()=>{its.forEach(i=>{if(!i.tags.includes(id))i.tags.push(id)});if(par)placeUnder(id,par);tpRecent(id)});pvRefresh();TP.q='';const q=$('#tpq');if(q){q.value='';q.focus()}tpDraw();T('Tag #'+id+' created'+(par?' under '+par:''),undo);return true}
 case'tpclear':U.ktags=[];rer();renderSide();tpDraw();return true;
 case'tpmatch':U.ktAll=id==='all';rer();tpDraw();return true;
 case'tpsub':U.ktSub=!U.ktSub;rer();tpDraw();return true;
 case'tpclose':tpClose();return true;
 }
 return false}

/* ---------- mount ---------- */
Shell.mount({space:'library',due:12,
 onSpace:k=>{if(k==='library'){if(Shell.isPhone())Shell.col('side',Shell.col('side')==='over'?'hidden':'over');else if(U.book||U.tab!=='books')go({tab:'books'});return}T(Shell.SPACES.find(s=>s[0]===k)[1]+' is a separate mock-up');return false},
 onCorner:k=>T(k.charAt(0).toUpperCase()+k.slice(1)+' is a separate mock-up'),
 onChange:(what,v)=>{
  if(what==='col'&&!Shell.isPhone()){const s=Shell.col(v);if(v==='side'){if(s==='dock'&&U.book&&Shell.col('panel')==='dock'&&innerWidth<1180)Shell.col('side','over');else if(s!=='over')U.sideWant=s==='dock'}else{if(s!=='over')U.panelWant=s==='dock';applyCols()}}
  if(what==='col'&&v==='panel'&&U.book&&!Shell.isPhone()){setPanelPref(U.book,Shell.col('panel')==='dock')}
  if(what==='mode'){if(!libTabs.list().some(t=>t.id===U.tab))U.tab=libTabs.list()[0].id;if(U.theme&&!isPro())U.theme=null;renderAll(true)}
 }});
$('[data-a=pvclose]').innerHTML=ic('x');
U.nav=[view()];U.navI=0;
renderAll();
addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(()=>{applyCols();$$('[data-rw]').forEach(r=>Shell.track(r.firstElementChild,r.querySelector('.track')));if(U.kcur||U.tab==='knowledge'){(U.book?renderBookBody:renderBody)()}},80)});
</script>
