<!doctype html>

<title>Notebooks mock-up v2</title>
<style>
/* ==== shell.css · the ONE shared app shell for every mock-up (12 Nov 2026) ====
   Paste this whole file at the top of a mock's <style>. See shell-spec.md.
   Structure classes are prefixed sh-. Primitives (.btn .seg .sw .ib .badge .glass .track) are the one shared version. */
:root{--canvas:#0f0e13;--surface-0:#16151b;--surface-1:#1d1c23;--surface-2:#25242c;--surface-3:#2e2d36;--ink:#ecebf2;--ink-soft:#b8b6c3;--muted:#9a98a6;--line:#2a2931;--line-strong:#7f7d8c;--hover:rgba(255,255,255,.06);--pressed:rgba(255,255,255,.1);--accent:#a08cff;--on-accent:#16112e;--accent-soft:rgba(160,140,255,.16);--danger:#ff7a6b;--success:#5fd39a;--warn:#f0b35a;--glass-fill:rgba(29,28,35,.7);--glass-line:rgba(255,255,255,.08);--elev-1:0 0 0 1px rgba(255,255,255,.06);--elev-2:0 8px 24px rgba(0,0,0,.4);--elev-3:0 16px 48px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.48);--wash:radial-gradient(at 15% 0%,oklch(.35 .12 290/.45),transparent 55%),radial-gradient(at 90% 10%,oklch(.32 .1 255/.35),transparent 50%);
 --r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--dur-1:120ms;--dur-2:180ms;--dur-3:240ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);
 --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter Variable',Inter,system-ui,sans-serif;
 /* shell sizes: change here only */
 --sh-rail:56px;--sh-side:264px;--sh-panel:264px;--sh-top:52px;--sh-tabbar:56px;--sh-gap:12px;--sh-sheet:440px;--sh-hit:44px;
 --sh-safe-b:env(safe-area-inset-bottom,0px);--sh-bottom:0px;--sh-bar:0px;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="sepia"]){--canvas:#f4f3f8;--surface-0:#ffffff;--surface-1:#fafafc;--surface-2:#ffffff;--surface-3:#ffffff;--ink:#18171c;--ink-soft:#4d4b55;--muted:#6b6976;--line:#eceaf1;--line-strong:#8a8796;--hover:rgba(24,23,28,.05);--pressed:rgba(24,23,28,.09);--accent:#6941e0;--on-accent:#ffffff;--accent-soft:rgba(105,65,224,.1);--danger:#c0352b;--success:#1a7248;--warn:#8f5200;--glass-fill:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.6);--elev-1:0 1px 2px rgba(24,23,28,.06);--elev-2:0 4px 16px rgba(24,23,28,.08),0 1px 2px rgba(24,23,28,.06);--elev-3:0 16px 48px rgba(24,23,28,.14);--scrim:rgba(0,0,0,.24);--wash:radial-gradient(at 15% 0%,oklch(.92 .06 290/.55),transparent 55%),radial-gradient(at 90% 10%,oklch(.93 .05 250/.45),transparent 50%);color-scheme:light}}
:root[data-theme="light"]{--canvas:#f4f3f8;--surface-0:#ffffff;--surface-1:#fafafc;--surface-2:#ffffff;--surface-3:#ffffff;--ink:#18171c;--ink-soft:#4d4b55;--muted:#6b6976;--line:#eceaf1;--line-strong:#8a8796;--hover:rgba(24,23,28,.05);--pressed:rgba(24,23,28,.09);--accent:#6941e0;--on-accent:#ffffff;--accent-soft:rgba(105,65,224,.1);--danger:#c0352b;--success:#1a7248;--warn:#8f5200;--glass-fill:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.6);--elev-1:0 1px 2px rgba(24,23,28,.06);--elev-2:0 4px 16px rgba(24,23,28,.08),0 1px 2px rgba(24,23,28,.06);--elev-3:0 16px 48px rgba(24,23,28,.14);--scrim:rgba(0,0,0,.24);--wash:radial-gradient(at 15% 0%,oklch(.92 .06 290/.55),transparent 55%),radial-gradient(at 90% 10%,oklch(.93 .05 250/.45),transparent 50%);color-scheme:light}
:root[data-theme="sepia"]{--canvas:#f3e9d2;--surface-0:#fbf3e0;--surface-1:#f7eed8;--surface-2:#fbf3e0;--surface-3:#fbf3e0;--ink:#3b2f1e;--ink-soft:#5c4b33;--muted:#74644a;--line:#e6d8b8;--line-strong:#8e7d5e;--hover:rgba(59,47,30,.06);--pressed:rgba(59,47,30,.1);--accent:#8a4b1f;--on-accent:#fff;--accent-soft:rgba(138,75,31,.12);--danger:#b3341f;--success:#2f6b3f;--warn:#8f5200;--glass-fill:rgba(251,243,224,.78);--glass-line:rgba(255,255,255,.5);--elev-1:0 1px 2px rgba(59,47,30,.08);--elev-2:0 4px 16px rgba(59,47,30,.1);--elev-3:0 16px 48px rgba(59,47,30,.18);--scrim:rgba(30,22,8,.34);--wash:radial-gradient(at 15% 0%,oklch(.9 .05 80/.55),transparent 55%);color-scheme:light}

/* ---- base ---- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--canvas);background-image:var(--wash);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass-fill);border:1px solid var(--glass-line);box-shadow:var(--elev-2);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--surface-2);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ---- primitives ---- */
.ib{width:var(--sh-hit);height:var(--sh-hit);border:0;border-radius:var(--r-md);background:transparent;color:var(--ink-soft);display:grid;place-items:center;cursor:pointer;transition:background var(--dur-1),color var(--dur-1);flex:none;position:relative}
.ib:hover{background:var(--hover);color:var(--ink)}.ib:active{background:var(--pressed)}.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib.sm{width:36px;height:36px}.ib.sm svg{width:18px;height:18px}
.ib.sm::before{content:"";position:absolute;inset:-4px}/* 44pt hit area on small icons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--sh-hit);padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background var(--dur-1),transform var(--dur-1)}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}.btn.pri:hover{filter:brightness(1.06)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;position:relative}
.btn.sm::before,.seg.sm button::before{content:"";position:absolute;inset:-4px 0}/* small controls still get a 44pt hit area */
.btn.more{background:var(--accent-soft);color:var(--accent);border-color:transparent}/* the More button: sliders icon + label, FIRST in its row */
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--hover);max-width:100%}
.seg button{border:0;background:transparent;color:var(--ink-soft);font-size:13px;font-weight:600;padding:0 14px;min-height:var(--sh-hit);border-radius:999px;cursor:pointer;white-space:nowrap;transition:background var(--dur-1),color var(--dur-1)}
.seg.sm button{min-height:36px;padding:0 11px;font-size:12.5px;position:relative;min-width:44px}
.seg button.on{background:var(--surface-2);color:var(--accent);box-shadow:var(--elev-1)}
.sw{position:relative;width:52px;height:32px;border-radius:999px;border:0;background:var(--line-strong);cursor:pointer;flex:none;transition:background var(--dur-1)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform var(--dur-1) var(--ease-out)}
.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.sw::before{content:"";position:absolute;inset:-6px 0}
.badge{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.inp{min-height:var(--sh-hit);border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-0);padding:0 12px;width:100%}
.mini{font-size:12px;color:var(--muted)}
.scrollx{overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}.scrollx::-webkit-scrollbar{display:none}
.track{height:3px;border-radius:3px;background:var(--line);margin-top:2px;position:relative}.track i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--line-strong)}
.track.off{visibility:hidden}
.utabs{display:flex;gap:2px}
.utabs button{background:none;border:0;border-bottom:2px solid transparent;min-height:var(--sh-hit);min-width:var(--sh-hit);justify-content:center;padding:0 12px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.utabs button.on{color:var(--accent);border-color:var(--accent)}
[data-mode=beg] .pro{display:none!important}

/* ---- frame ---- */
.sh-wrap{height:100dvh;display:flex;flex-direction:column;max-width:1320px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.sh-demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;flex:none}
.sh-demo .t{font-size:13px;font-weight:600;color:var(--muted);margin-right:auto}
.sh-shell{flex:1;min-height:0;display:flex;gap:var(--sh-gap);align-items:stretch;position:relative}

/* ---- rail (left edge) / tab bar (phone) ---- */
.sh-rail{width:var(--sh-rail);flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:var(--r-lg);-webkit-user-select:none;user-select:none}
.sh-rail .mk{width:32px;height:32px;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;margin-bottom:8px;font-size:15px;flex:none}
.sh-rail .grow{flex:1}
.sh-rail .ib svg{width:24px;height:24px}
.sh-rail .ib .lbl{display:none}
.sh-rail .ib .bd{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.sh-rail .ib.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}

/* ---- sidebar + left panel (two columns that dock, overlay or hide) ---- */
.sh-side,.sh-panel{flex:none;border-radius:var(--r-lg);background:var(--surface-1);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sh-side{width:var(--sh-side)}.sh-panel{width:var(--sh-panel)}
.sh-side[data-state=hidden],.sh-panel[data-state=hidden]{display:none}
.sh-side[data-state=over],.sh-panel[data-state=over]{position:fixed;left:max(8px,env(safe-area-inset-left,0px));top:8px;bottom:8px;width:min(86vw,320px);z-index:60;box-shadow:var(--elev-3);animation:shIn var(--dur-2) var(--ease-out)}
.sh-colhd{display:flex;align-items:center;gap:4px;padding:8px 8px 4px;flex:none}
.sh-colhd h2{font-size:15px;margin:0 auto 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-coltabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
.sh-coltabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;min-height:var(--sh-hit);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.sh-coltabs button svg{width:16px;height:16px}
.sh-coltabs button.on{color:var(--accent);border-color:var(--accent)}
.sh-colscroll{overflow:auto;padding:6px 8px 12px;flex:1;min-height:0;overscroll-behavior:contain;position:relative}
.sh-colfoot{flex:none;border-top:1px solid var(--line);padding:6px 8px;display:flex;gap:6px;align-items:center}

/* ---- main column + top bar ---- */
.sh-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.sh-top{display:flex;align-items:center;gap:4px;min-height:var(--sh-top);padding:0 4px;flex:none}
.sh-crumbs{display:flex;align-items:center;gap:2px;min-width:0;font-size:13px;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;padding-left:4px}
.sh-crumbs svg{width:14px;height:14px;flex:none}
.sh-crumbs button{border:0;background:none;color:inherit;cursor:pointer;padding:0 4px;min-height:var(--sh-hit);border-radius:var(--r-xs);font-size:13px}
.sh-crumbs button:hover{color:var(--ink);background:var(--hover)}
.sh-crumbs b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.sh-saved{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
.sh-scroll{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border-radius:var(--r-lg);padding-bottom:calc(84px + var(--sh-safe-b))}

/* ---- floating bar (bottom centre of the main column) + minimise chips (right edge) ---- */
.sh-fbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;max-width:calc(100% - 24px);transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out);-webkit-user-select:none;user-select:none}
.sh-fbar[hidden]{display:none!important}
.sh-fbar .lab{font-size:13px;font-weight:600;padding:0 10px;white-space:nowrap}
.sh-fbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.sh-fbar .minb{color:var(--muted)}.sh-fbar .minb svg{width:18px;height:18px}
.sh-mdock{position:fixed;right:0;top:calc(12px + var(--sh-top) + 64px);z-index:41;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.sh-mchip{pointer-events:auto;display:flex;align-items:center;gap:6px;height:var(--sh-hit);padding:0 12px 0 8px;border:1.5px solid var(--accent);border-right:0;border-radius:14px 0 0 14px;background:color-mix(in srgb,var(--accent) 16%,var(--surface-2));box-shadow:var(--elev-2);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;animation:shChip 150ms var(--ease-out);transition:padding 150ms var(--ease-out),background 150ms var(--ease-out)}
.sh-mchip:hover{padding-right:16px;background:color-mix(in srgb,var(--accent) 24%,var(--surface-2))}
.sh-mchip svg.c{width:14px;height:14px}.sh-mchip span{color:var(--ink)}

/* ---- scrim, More sheet (fixed, full height, scrolls inside), dialog, pop, toast ---- */
.sh-scrim{position:fixed;inset:0;background:var(--scrim);z-index:59;opacity:0;pointer-events:none;transition:opacity var(--dur-2)}
.sh-scrim.on{opacity:1;pointer-events:auto}
.sh-scrim.hi{z-index:79}
.sh-sheet{position:fixed;z-index:80;top:12px;bottom:12px;right:max(12px,env(safe-area-inset-right,0px));width:min(var(--sh-sheet),calc(100vw - 24px));display:flex;flex-direction:column;border-radius:var(--r-xl);background:var(--surface-1);border:1px solid var(--line);box-shadow:var(--elev-3);overflow:hidden;transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform var(--dur-3) var(--ease-out),visibility 0s linear var(--dur-3)}
.sh-sheet.on{transform:none;visibility:visible;transition:transform var(--dur-3) var(--ease-out),visibility 0s}
.sh-shd{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 14px;flex:none}
.sh-shd h3{margin:0;font-size:17px}.sh-shd p{margin:0;font-size:12.5px;color:var(--muted)}.sh-shd .gr{flex:1;min-width:0}
.sh-spick{flex:none;padding:0 12px 4px}
.sh-stabs{flex:none;padding:0 10px}
.sh-stabs .utabs{border-bottom:1px solid var(--line)}
.sh-sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 20px}
.sh-sft{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + var(--sh-safe-b));border-top:1px solid var(--line);background:var(--surface-0)}
.sh-sft .gr{flex:1;font-size:12.5px;color:var(--muted)}
.sh-dialog{position:fixed;z-index:85;left:50%;top:50%;width:min(420px,calc(100vw - 24px));transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;transition:opacity var(--dur-2),transform var(--dur-2) var(--ease-out);border-radius:var(--r-xl);background:var(--surface-1);border:1px solid var(--line);box-shadow:var(--elev-3);padding:18px}
.sh-dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sh-dialog h3{margin:0 0 10px;font-size:17px}
.sh-dialog .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.sh-pop{position:fixed;z-index:86;min-width:220px;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow:auto;border-radius:var(--r-md);padding:6px;background:var(--surface-2);border:1px solid var(--line);box-shadow:var(--elev-3);animation:shPop var(--dur-1) var(--ease-out)}
.sh-pop .mi{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--sh-hit);padding:0 10px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;text-align:left;font-size:14px}
.sh-pop .mi:hover{background:var(--hover)}.sh-pop .mi svg{width:18px;height:18px;color:var(--muted)}
.sh-pop .mi.dng,.sh-pop .mi.dng svg{color:var(--danger)}
.sh-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.sh-pop .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);padding:6px 10px 2px}
.sh-toast{position:fixed;left:50%;bottom:calc(24px + var(--sh-bottom) + var(--sh-bar) + var(--sh-safe-b));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:90;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 6px 0 18px;border-radius:999px;background:var(--surface-3);color:var(--ink);border:1px solid var(--line);box-shadow:var(--elev-3);transition:opacity var(--dur-2),transform var(--dur-2) var(--ease-out);max-width:calc(100vw - 24px);font-size:14px;font-weight:500}
.sh-toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.sh-toast span{padding-right:12px}
.sh-toast button{border:0;background:none;color:var(--accent);font-weight:700;min-height:var(--sh-hit);padding:0 12px;cursor:pointer;border-radius:999px}
.sh-tabbar{display:none}
@keyframes shIn{from{transform:translateX(-24px);opacity:0}}
@keyframes shChip{from{transform:translateX(100%)}}
@keyframes shPop{from{opacity:0;transform:translateY(-4px)}}

/* ---- phone (640 and under): rail becomes the bottom tab bar, columns become drawers, the sheet fills the screen ---- */
@media (max-width:640px){
 :root{--sh-bottom:var(--sh-tabbar)}
 .sh-wrap{padding:8px 8px calc(var(--sh-tabbar) + var(--sh-safe-b))}
 .sh-rail{display:none}
 .sh-side:not([data-state=over]),.sh-panel:not([data-state=over]){display:none}
 .sh-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--sh-tabbar) + var(--sh-safe-b));padding:0 4px var(--sh-safe-b);justify-content:space-around;align-items:center;border-radius:0;border-left:0;border-right:0;border-bottom:0}
 .sh-tabbar .ib{flex:1;width:auto;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:600;border-radius:var(--r-sm)}
 .sh-tabbar .ib svg{width:22px;height:22px}
 .sh-tabbar .ib .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:grid;place-items:center}
 .sh-fbar{bottom:12px}
 .sh-sheet{top:max(8px,env(safe-area-inset-top,0px));bottom:0;right:0;left:0;width:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(105%)}
 .sh-mdock{top:calc(8px + var(--sh-top) + 56px)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

/* Many sheet tabs: keep each tab its natural width and scroll the row instead of squeezing. */
.sh-stabs .utabs button{flex:none}

/* ==== 12 Nov 2026 (U3): dialog close, universal minimise button, edge handle, customisable tabs ==== */
/* every #sh-dialog has a visible close button */
.sh-dialog>.sh-dx{position:absolute;top:4px;right:4px;z-index:3}
.sh-dialog>.sh-dx svg{width:20px;height:20px}

 case'tmv':{const par=D.tags.find(p=>p.ch.some(c=>c.id===v));if(par){const t=par.ch.find(c=>c.id===v);par.ch=par.ch.filter(c=>c!==t);D.tags.push(t)}else{toast('Already at the top level');return}break}
 case'tmg':{const t=findTag(D.tags,v),i=D.tags.indexOf(t),o=D.tags[i+1]||D.tags[i-1];if(i<0||!o||o===t){toast('Nothing to merge into here');return}o.n+=t.n;D.tags.splice(i,1);toast(`Merged into #${o.t}`);break}
 case'tdl':delTag(D.tags,v);toast('Tag deleted. Your notes are kept.');break;
 case'tuse':toast('New page from “'+D.tpl.find(x=>x.id===v).t+'”');return;
 case'tdel':D.tpl=D.tpl.filter(x=>x.id!==v);break;
 case'tnew':Shell.ask('New template','Untitled template',x=>{if(x&&D){D.tpl.push({id:'tp'+uid++,t:x});redraw()}});return;
 case'rest':{const i=D.trash.findIndex(x=>x.id===v),t=D.trash[i];D.trash.splice(i,1);if(t.k==='notebook'&&t.nb)D.nbs.push(t.nb);toast(`Restored “${t.t}” with everything deleted with it`);break}
 case'purge':{if(k.dataset.arm!=='1'){k.dataset.arm='1';k.textContent='Tap again to erase';setTimeout(()=>{if(k.isConnected){k.dataset.arm='0';k.textContent='Delete forever'}},3000);return}D.trash=D.trash.filter(x=>x.id!==v);toast('Erased for good');break}
 default:return}
 redraw()});
const livePrev=()=>{const n=dn(),pv=$('#lookprev');if(!n||!pv)return;pv.querySelector('.cover').outerHTML=coverHTML(n);pv.querySelector('b').textContent=n.t;const o=$('#pickSel option:checked');if(o)o.textContent=n.t;const d=$('.pickdd .nbdot');if(d)d.innerHTML=coverHTML(n)};
const photoCss=p=>`object-position:${p.x}% ${p.y}%;transform:scale(${p.z});transform-origin:${p.x}% ${p.y}%`;
document.addEventListener('input',e=>{const el=e.target;if(!D||!el.closest('#sh-sheet')||!el.dataset.k)return;const n=dn(),[key,arg]=el.dataset.k.split(':');if(!n)return;
 if(key==='nm'){n.t=el.value.trim()||n.t;livePrev()}
 if(key==='lb'){n.label=el.value.toUpperCase();livePrev()}
 if(key==='tn'){const v=el.value.trim().slice(0,100);if(v)n.tabNames[arg]=v;else delete n.tabNames[arg]}
 if(key==='zoom'&&n.photo){n.photo.z=+el.value;const i=$('#cropst img');if(i)i.style.cssText=photoCss(n.photo);livePrev()}});
function setPhoto(src,w,h){const n=dn();if(!n)return;n.photo={src,x:50,y:50,z:1,w,h};n.cv={k:'photo',i:0};cvTab='photo';redraw()}
$('#photoIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/')){toast('Choose an image file (JPG, PNG, HEIC or WebP)');return}if(f.size>12e6){toast('That photo is over 12 MB. Choose a smaller one.');return}
 const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>setPhoto(fr.result,im.naturalWidth,im.naturalHeight);im.onerror=()=>toast('That photo could not be opened');im.src=fr.result};fr.readAsDataURL(f)});
/* crop: drag the photo inside the 3:4 frame; hold-to-unlock ring */
document.addEventListener('pointerdown',e=>{const st=e.target.closest('#cropst');
 if(st&&D){const n=dn(),p=n.photo;if(!p)return;try{st.setPointerCapture(e.pointerId)}catch(_){}let x0=e.clientX,y0=e.clientY;const w=st.clientWidth,h=st.clientHeight,img=st.querySelector('img');
  const mv=ev=>{p.x=Math.max(0,Math.min(100,p.x-(ev.clientX-x0)/w*100/p.z));p.y=Math.max(0,Math.min(100,p.y-(ev.clientY-y0)/h*100/p.z));x0=ev.clientX;y0=ev.clientY;img.style.cssText=photoCss(p)};
  const up=()=>{st.removeEventListener('pointermove',mv);st.removeEventListener('pointerup',up);st.removeEventListener('pointercancel',up);livePrev()};st.addEventListener('pointermove',mv);st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);return}
 const r=e.target.closest('.ring');if(!r||!D)return;const n=D.nbs.find(x=>x.id===r.dataset.ring);
 if(!n.locked){n.locked=true;toast('Locked');redraw();return}
 try{r.setPointerCapture(e.pointerId)}catch(_){}const t0=performance.now();const step=()=>{const p=Math.min(100,(performance.now()-t0)/900*100);r.style.setProperty('--p',p);if(p>=100){n.locked=false;toast('Unlocked');redraw()}else holdT=requestAnimationFrame(step)};holdT=requestAnimationFrame(step);
 const stop=()=>{cancelAnimationFrame(holdT);r.style.setProperty('--p',0);r.removeEventListener('pointerup',stop);r.removeEventListener('pointercancel',stop)};r.addEventListener('pointerup',stop);r.addEventListener('pointercancel',stop)});

function audit(){const cov=new Set(),f=document.createElement('div');const add=h=>{f.innerHTML=h;f.querySelectorAll('[data-cov]').forEach(x=>x.dataset.cov.split(' ').forEach(c=>cov.add(c)))};
 const keepU=JSON.stringify(U),keepS=JSON.stringify(S),kD=D,kP=pickId,kC=cvTab;forcePro=true;
 try{const nb=S.nbs[0];add(nbMenuHTML(nb)+addMenuHTML(nb)+rowMenuHTML(nb.pages[0].ch[0]));
  for(const t of['all','starred','recent'])for(const l of['shelf','list']){U.tab=t;S.prefs.layout=l;add(homeHTML())}

  add(sideHTML());U.open='bio';U.page=null;S.nbs[0].layout='board';add(nbScreen());S.nbs[0].pages=[];add(nbScreen());S=JSON.parse(keepS);
  U.page=S.nbs[0].pages[0].id;add(nbScreen());for(const t of['pages','outline','res']){U.ptab=t;add(panelHTML())}U.addRes='audio';add(addFormHTML());
  add(topActions(S.nbs[0]));add(barHTML(findAny(U.page)));
  D=JSON.parse(JSON.stringify({nbs:S.nbs,trash:S.trash,tags:S.tags,tpl:S.tpl,prefs:S.prefs}));pickId='all';add(pickerHTML());for(const p of PANES.all)add(paneHTML(p[0]));
  pickId='bio';dn().layout='board';dn().pages[0].lock=true;for(const k of KINDS){cvTab=k[0];add(paneHTML('look'))}pickId='trv';cvTab='photo';add(paneHTML('look'));pickId='bio';for(const p of PANES.nb)add(paneHTML(p[0]));
 }catch(err){console.error('audit',err)}
 forcePro=false;S=JSON.parse(keepS);U=JSON.parse(keepU);D=kD;pickId=kP;cvTab=kC;
 if($('#sh-rail [data-sh-space]'))cov.add('S01');f.innerHTML=Shell.cornerHTML();
 [['settings','S14'],['save','S15'],['trash','S16'],['device','S17'],['help','S18']].forEach(([q,c])=>{if(f.querySelector('[data-sh-q="'+q+'"]'))cov.add(c)});if(f.querySelector('[data-sh-th="Sepia"]'))cov.add('S19');
 const missing=INV.filter(c=>!cov.has(c)),chip=$('#covChip');chip.textContent=`Coverage ${INV.length-missing.length}/${INV.length}`;chip.title=missing.length?'Missing: '+missing.join(' '):'Every inventory item (83 existing + 15 added) is present';chip.dataset.missing=missing.join(' ')}

Shell.mount({space:'notebooks',due:dueAll(),
 onSpace:k=>{if(k==='notebooks'){if(Shell.isPhone())Shell.col('side',Shell.col('side')==='over'?'hidden':'over');else goHome();return}toast(Shell.SPACES.find(s=>s[0]===k)[1]+' is a separate mock-up');return false},
 onCorner:q=>{if(q==='trash')openMore('trash','all');else toast({settings:'Settings',save:'Save & restore',device:'Device mode: Computer / Touch / Pencil',help:'Help'}[q]+' opens here')},

   if(v==='panel'&&s!=='over'){U.panelWant=s==='dock';applyCols()}}
  if(what==='col'&&v==='panel')renderPanel()}});
document.addEventListener('click',e=>{const c=e.target.closest('[data-sh-crumb]');if(c){if(c.dataset.shCrumb==='0')goHome();else{U.page=null;renderAll()}return}
 const nv=e.target.closest('[data-sh-nav]');if(nv){if(nv.dataset.shNav==='back'){if(U.page){U.page=null;renderAll()}else if(U.open)goHome();else toast('Nothing to go back to')}else toast('Nothing to go forward to');return}
 if(e.target.closest('[data-sh-search]')){toast('Search opens here (Ctrl K)');return}
 });
