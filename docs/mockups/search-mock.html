<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Search mock-up</title>
    <style>
      /* ==== shell.css · the ONE shared app shell for every mock-up (12 Nov 2026) ====
   Paste this whole file at the top of a mock's <style>. See shell-spec.md.
   Structure classes are prefixed sh-. Primitives (.btn .seg .sw .ib .badge .glass .track) are the one shared version. */
      :root {
        --canvas: #0f0e13;
        --surface-0: #16151b;
        --surface-1: #1d1c23;
        --surface-2: #25242c;
        --surface-3: #2e2d36;
        --ink: #ecebf2;
        --ink-soft: #b8b6c3;
        --muted: #9a98a6;
        --line: #2a2931;
        --line-strong: #7f7d8c;
        --hover: rgba(255, 255, 255, 0.06);
        --pressed: rgba(255, 255, 255, 0.1);
        --accent: #a08cff;
        --on-accent: #16112e;
        --accent-soft: rgba(160, 140, 255, 0.16);
        --danger: #ff7a6b;
        --success: #5fd39a;
        --warn: #f0b35a;
        --glass-fill: rgba(29, 28, 35, 0.7);
        --glass-line: rgba(255, 255, 255, 0.08);
        --elev-1: 0 0 0 1px rgba(255, 255, 255, 0.06);
        --elev-2: 0 8px 24px rgba(0, 0, 0, 0.4);
        --elev-3: 0 16px 48px rgba(0, 0, 0, 0.55);
        --scrim: rgba(0, 0, 0, 0.48);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.35 0.12 290/0.45),
            transparent 55%
          ),
          radial-gradient(at 90% 10%, oklch(0.32 0.1 255/0.35), transparent 50%);
        --r-xs: 6px;
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 24px;
        --dur-1: 120ms;
        --dur-2: 180ms;
        --dur-3: 240ms;
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --ease-in: cubic-bezier(0.4, 0, 1, 1);
        --sans:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter Variable',
          Inter, system-ui, sans-serif;
        /* shell sizes: change here only */
        --sh-rail: 56px;
        --sh-side: 264px;
        --sh-panel: 264px;
        --sh-top: 52px;
        --sh-tabbar: 56px;
        --sh-gap: 12px;
        --sh-sheet: 440px;
        --sh-hit: 44px;
        --sh-safe-b: env(safe-area-inset-bottom, 0px);
        --sh-bottom: 0px;
        --sh-bar: 0px;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']):not([data-theme='sepia']) {
          --canvas: #f4f3f8;
          --surface-0: #ffffff;
          --surface-1: #fafafc;
          --surface-2: #ffffff;
          --surface-3: #ffffff;
          --ink: #18171c;
          --ink-soft: #4d4b55;
          --muted: #6b6976;
          --line: #eceaf1;
          --line-strong: #8a8796;
          --hover: rgba(24, 23, 28, 0.05);
          --pressed: rgba(24, 23, 28, 0.09);
          --accent: #6941e0;
          --on-accent: #ffffff;
          --accent-soft: rgba(105, 65, 224, 0.1);
          --danger: #c0352b;
          --success: #1a7248;
          --warn: #8f5200;
          --glass-fill: rgba(255, 255, 255, 0.72);
          --glass-line: rgba(255, 255, 255, 0.6);
          --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-2:
            0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
          --scrim: rgba(0, 0, 0, 0.24);
          --wash:
            radial-gradient(
              at 15% 0%,
              oklch(0.92 0.06 290/0.55),
              transparent 55%
            ),
            radial-gradient(
              at 90% 10%,
              oklch(0.93 0.05 250/0.45),
              transparent 50%
            );
          color-scheme: light;
        }
      }
      :root[data-theme='light'] {
        --canvas: #f4f3f8;
        --surface-0: #ffffff;
        --surface-1: #fafafc;
        --surface-2: #ffffff;
        --surface-3: #ffffff;
        --ink: #18171c;
        --ink-soft: #4d4b55;
        --muted: #6b6976;
        --line: #eceaf1;
        --line-strong: #8a8796;
        --hover: rgba(24, 23, 28, 0.05);
        --pressed: rgba(24, 23, 28, 0.09);
        --accent: #6941e0;
        --on-accent: #ffffff;
        --accent-soft: rgba(105, 65, 224, 0.1);
        --danger: #c0352b;
        --success: #1a7248;
        --warn: #8f5200;
        --glass-fill: rgba(255, 255, 255, 0.72);
        --glass-line: rgba(255, 255, 255, 0.6);
        --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-2:
          0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
        --scrim: rgba(0, 0, 0, 0.24);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.92 0.06 290/0.55),
            transparent 55%
          ),
          radial-gradient(
            at 90% 10%,
            oklch(0.93 0.05 250/0.45),
            transparent 50%
          );
        color-scheme: light;
      }
      :root[data-theme='sepia'] {
        --canvas: #f3e9d2;
        --surface-0: #fbf3e0;
        --surface-1: #f7eed8;
        --surface-2: #fbf3e0;
        --surface-3: #fbf3e0;
        --ink: #3b2f1e;
        --ink-soft: #5c4b33;
        --muted: #74644a;
        --line: #e6d8b8;
        --line-strong: #8e7d5e;
        --hover: rgba(59, 47, 30, 0.06);
        --pressed: rgba(59, 47, 30, 0.1);
        --accent: #8a4b1f;
        --on-accent: #fff;
        --accent-soft: rgba(138, 75, 31, 0.12);
        --danger: #b3341f;
        --success: #2f6b3f;
        --warn: #8f5200;
        --glass-fill: rgba(251, 243, 224, 0.78);
        --glass-line: rgba(255, 255, 255, 0.5);
        --elev-1: 0 1px 2px rgba(59, 47, 30, 0.08);
        --elev-2: 0 4px 16px rgba(59, 47, 30, 0.1);
        --elev-3: 0 16px 48px rgba(59, 47, 30, 0.18);
        --scrim: rgba(30, 22, 8, 0.34);
        --wash: radial-gradient(
          at 15% 0%,
          oklch(0.9 0.05 80/0.55),
          transparent 55%
        );
        color-scheme: light;
      }

      /* ---- base ---- */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--canvas);
        background-image: var(--wash);
        background-attachment: fixed;
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        width: 20px;
        height: 20px;
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .glass {
        background: var(--glass-fill);
        border: 1px solid var(--glass-line);
        box-shadow: var(--elev-2);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        backdrop-filter: blur(18px) saturate(160%);
      }
      @media (prefers-reduced-transparency: reduce) {
        .glass {
          background: var(--surface-2);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }

      /* ---- primitives ---- */
      .ib {
        width: var(--sh-hit);
        height: var(--sh-hit);
        border: 0;
        border-radius: var(--r-md);
        background: transparent;
        color: var(--ink-soft);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background var(--dur-1),
          color var(--dur-1);
        flex: none;
        position: relative;
      }
      .ib:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .ib:active {
        background: var(--pressed);
      }
      .ib.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ib:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .ib.sm {
        width: 36px;
        height: 36px;
      }
      .ib.sm svg {
        width: 18px;
        height: 18px;
      }
      .ib.sm::before {
        content: '';
        position: absolute;
        inset: -4px;
      } /* 44pt hit area on small icons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: var(--sh-hit);
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          transform var(--dur-1);
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
      }
      .btn.pri:hover {
        filter: brightness(1.06);
      }
      .btn.dng {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
        position: relative;
      }
      .btn.sm::before,
      .seg.sm button::before {
        content: '';
        position: absolute;
        inset: -4px 0;
      } /* small controls still get a 44pt hit area */
      .btn.more {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: transparent;
      } /* the More button: sliders icon + label, FIRST in its row */
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: 999px;
        background: var(--hover);
        max-width: 100%;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
        padding: 0 14px;
        min-height: var(--sh-hit);
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          color var(--dur-1);
      }
      .seg.sm button {
        min-height: 36px;
        padding: 0 11px;
        font-size: 12.5px;
        position: relative;
        min-width: 44px;
      }
      .seg button.on {
        background: var(--surface-2);
        color: var(--accent);
        box-shadow: var(--elev-1);
      }
      .sw {
        position: relative;
        width: 52px;
        height: 32px;
        border-radius: 999px;
        border: 0;
        background: var(--line-strong);
        cursor: pointer;
        flex: none;
        transition: background var(--dur-1);
      }
      .sw::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        transition: transform var(--dur-1) var(--ease-out);
      }
      .sw[aria-checked='true'] {
        background: var(--accent);
      }
      .sw[aria-checked='true']::after {
        transform: translateX(20px);
      }
      .sw:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .sw::before {
        content: '';
        position: absolute;
        inset: -6px 0;
      }
      .badge {
        font-size: 11.5px;
        font-weight: 700;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
      }
      .inp {
        min-height: var(--sh-hit);
        border-radius: var(--r-sm);
        border: 1px solid var(--line);
        background: var(--surface-0);
        padding: 0 12px;
        width: 100%;
      }
      .mini {
        font-size: 12px;
        color: var(--muted);
      }
      .scrollx {
        overflow-x: auto;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }
      .scrollx::-webkit-scrollbar {
        display: none;
      }
      .track {
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        margin-top: 2px;
        position: relative;
      }
      .track i {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 3px;
        background: var(--line-strong);
      }
      .track.off {
        visibility: hidden;
      }
      .utabs {
        display: flex;
        gap: 2px;
      }
      .utabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        min-width: var(--sh-hit);
        justify-content: center;
        padding: 0 12px;
        font-weight: 600;
        font-size: 13.5px;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .utabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      [data-mode='beg'] .pro {
        display: none !important;
      }

      /* ---- frame ---- */
      .sh-wrap {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 1320px;
        margin: 0 auto;
        padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px
          max(12px, env(safe-area-inset-left, 0px));
      }
      .sh-demo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex: none;
      }
      .sh-demo .t {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin-right: auto;
      }
      .sh-shell {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: var(--sh-gap);
        align-items: stretch;
        position: relative;
      }

      /* ---- rail (left edge) / tab bar (phone) ---- */
      .sh-rail {
        width: var(--sh-rail);
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 6px;
        border-radius: var(--r-lg);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-rail .mk {
        width: 32px;
        height: 32px;
        border-radius: var(--r-md);
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 15px;
        flex: none;
      }
      .sh-rail .grow {
        flex: 1;
      }
      .sh-rail .ib svg {
        width: 24px;
        height: 24px;
      }
      .sh-rail .ib .lbl {
        display: none;
      }
      .sh-rail .ib .bd {
        position: absolute;
        top: 2px;
        right: 0;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 10.5px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      .sh-rail .ib.on::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }

      /* ---- sidebar + left panel (two columns that dock, overlay or hide) ---- */
      .sh-side,
      .sh-panel {
        flex: none;
        border-radius: var(--r-lg);
        background: var(--surface-1);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      .sh-side {
        width: var(--sh-side);
      }
      .sh-panel {
        width: var(--sh-panel);
      }
      .sh-side[data-state='hidden'],
      .sh-panel[data-state='hidden'] {
        display: none;
      }
      .sh-side[data-state='over'],
      .sh-panel[data-state='over'] {
        position: fixed;
        left: max(8px, env(safe-area-inset-left, 0px));
        top: 8px;
        bottom: 8px;
        width: min(86vw, 320px);
        z-index: 60;
        box-shadow: var(--elev-3);
        animation: shIn var(--dur-2) var(--ease-out);
      }
      .sh-colhd {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 8px 4px;
        flex: none;
      }
      .sh-colhd h2 {
        font-size: 15px;
        margin: 0 auto 0 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sh-coltabs {
        display: flex;
        gap: 2px;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .sh-coltabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
      }
      .sh-coltabs button svg {
        width: 16px;
        height: 16px;
      }
      .sh-coltabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .sh-colscroll {
        overflow: auto;
        padding: 6px 8px 12px;
        flex: 1;
        min-height: 0;
        overscroll-behavior: contain;
        position: relative;
      }
      .sh-colfoot {
        flex: none;
        border-top: 1px solid var(--line);
        padding: 6px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* ---- main column + top bar ---- */
      .sh-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }
      .sh-top {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: var(--sh-top);
        padding: 0 4px;
        flex: none;
      }
      .sh-crumbs {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        font-size: 13px;
        color: var(--muted);
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        padding-left: 4px;
      }
      .sh-crumbs svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .sh-crumbs button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0 4px;
        min-height: var(--sh-hit);
        border-radius: var(--r-xs);
        font-size: 13px;
      }
      .sh-crumbs button:hover {
        color: var(--ink);
        background: var(--hover);
      }
      .sh-crumbs b {
        font-weight: 500;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }
      .sh-saved {
        font-size: 12px;
        color: var(--muted);
        padding: 0 6px;
        white-space: nowrap;
      }
      .sh-scroll {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        border-radius: var(--r-lg);
        padding-bottom: calc(84px + var(--sh-safe-b));
      }

      /* ---- floating bar (bottom centre of the main column) + minimise chips (right edge) ---- */
      .sh-fbar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        max-width: calc(100% - 24px);
        transition:
          opacity 150ms var(--ease-out),
          transform 150ms var(--ease-out);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-fbar[hidden] {
        display: none !important;
      }
      .sh-fbar .lab {
        font-size: 13px;
        font-weight: 600;
        padding: 0 10px;
        white-space: nowrap;
      }
      .sh-fbar .sep {
        width: 1px;
        height: 24px;
        background: var(--line);
        margin: 0 4px;
        flex: none;
      }
      .sh-fbar .minb {
        color: var(--muted);
      }
      .sh-fbar .minb svg {
        width: 18px;
        height: 18px;
      }
      .sh-mdock {
        position: fixed;
        right: 0;
        top: calc(12px + var(--sh-top) + 64px);
        z-index: 41;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
      }
      .sh-mchip {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        height: var(--sh-hit);
        padding: 0 12px 0 8px;
        border: 1.5px solid var(--accent);
        border-right: 0;
        border-radius: 14px 0 0 14px;
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        box-shadow: var(--elev-2);
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        animation: shChip 150ms var(--ease-out);
        transition:
          padding 150ms var(--ease-out),
          background 150ms var(--ease-out);
      }
      .sh-mchip:hover {
        padding-right: 16px;
        background: color-mix(in srgb, var(--accent) 24%, var(--surface-2));
      }
      .sh-mchip svg.c {
        width: 14px;
        height: 14px;
      }
      .sh-mchip span {
        color: var(--ink);
      }

      /* ---- scrim, More sheet (fixed, full height, scrolls inside), dialog, pop, toast ---- */
      .sh-scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 59;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-2);
      }
      .sh-scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .sh-scrim.hi {
        z-index: 79;
      }
      .sh-sheet {
        position: fixed;
        z-index: 80;
        top: 12px;
        bottom: 12px;
        right: max(12px, env(safe-area-inset-right, 0px));
        width: min(var(--sh-sheet), calc(100vw - 24px));
        display: flex;
        flex-direction: column;
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        overflow: hidden;
        transform: translateX(calc(100% + 24px));
        visibility: hidden;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s linear var(--dur-3);
      }
      .sh-sheet.on {
        transform: none;
        visibility: visible;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s;
      }
      .sh-shd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 8px 6px 14px;
        flex: none;
      }
      .sh-shd h3 {
        margin: 0;
        font-size: 17px;
      }
      .sh-shd p {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-shd .gr {
        flex: 1;
        min-width: 0;
      }
      .sh-spick {
        flex: none;
        padding: 0 12px 4px;
      }
      .sh-stabs {
        flex: none;
        padding: 0 10px;
      }
      .sh-stabs .utabs {
        border-bottom: 1px solid var(--line);
      }
      .sh-sbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 16px 20px;
      }
      .sh-sft {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px calc(8px + var(--sh-safe-b));
        border-top: 1px solid var(--line);
        background: var(--surface-0);
      }
      .sh-sft .gr {
        flex: 1;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-dialog {
        position: fixed;
        z-index: 85;
        left: 50%;
        top: 50%;
        width: min(420px, calc(100vw - 24px));
        transform: translate(-50%, -48%) scale(0.98);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        padding: 18px;
      }
      .sh-dialog.on {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      .sh-dialog h3 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .sh-dialog .ft {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .sh-pop {
        position: fixed;
        z-index: 86;
        min-width: 220px;
        max-width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        overflow: auto;
        border-radius: var(--r-md);
        padding: 6px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        animation: shPop var(--dur-1) var(--ease-out);
      }
      .sh-pop .mi {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: var(--sh-hit);
        padding: 0 10px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        text-align: left;
        font-size: 14px;
      }
      .sh-pop .mi:hover {
        background: var(--hover);
      }
      .sh-pop .mi svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .sh-pop .mi.dng,
      .sh-pop .mi.dng svg {
        color: var(--danger);
      }
      .sh-pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      .sh-pop .lbl {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
        color: var(--muted);
        padding: 6px 10px 2px;
      }
      .sh-toast {
        position: fixed;
        left: 50%;
        bottom: calc(
          24px + var(--sh-bottom) + var(--sh-bar) + var(--sh-safe-b)
        );
        transform: translate(-50%, 16px);
        opacity: 0;
        pointer-events: none;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 6px 0 18px;
        border-radius: 999px;
        background: var(--surface-3);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        max-width: calc(100vw - 24px);
        font-size: 14px;
        font-weight: 500;
      }
      .sh-toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .sh-toast span {
        padding-right: 12px;
      }
      .sh-toast button {
        border: 0;
        background: none;
        color: var(--accent);
        font-weight: 700;
        min-height: var(--sh-hit);
        padding: 0 12px;
        cursor: pointer;
        border-radius: 999px;
      }
      .sh-tabbar {
        display: none;
      }
      @keyframes shIn {
        from {
          transform: translateX(-24px);
          opacity: 0;
        }
      }
      @keyframes shChip {
        from {
          transform: translateX(100%);
        }
      }
      @keyframes shPop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }

      /* ---- phone (640 and under): rail becomes the bottom tab bar, columns become drawers, the sheet fills the screen ---- */
      @media (max-width: 640px) {
        :root {
          --sh-bottom: var(--sh-tabbar);
        }
        .sh-wrap {
          padding: 8px 8px calc(var(--sh-tabbar) + var(--sh-safe-b));
        }
        .sh-rail {
          display: none;
        }
        .sh-side:not([data-state='over']),
        .sh-panel:not([data-state='over']) {
          display: none;
        }
        .sh-tabbar {
          display: flex;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          height: calc(var(--sh-tabbar) + var(--sh-safe-b));
          padding: 0 4px var(--sh-safe-b);
          justify-content: space-around;
          align-items: center;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
        }
        .sh-tabbar .ib {
          flex: 1;
          width: auto;
          height: 48px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1px;
          font-size: 10px;
          font-weight: 600;
          border-radius: var(--r-sm);
        }
        .sh-tabbar .ib svg {
          width: 22px;
          height: 22px;
        }
        .sh-tabbar .ib .bd {
          position: absolute;
          top: 2px;
          left: calc(50% + 6px);
          min-width: 16px;
          height: 16px;
          padding: 0 4px;
          border-radius: 999px;
          background: var(--accent);
          color: var(--on-accent);
          font-size: 10px;
          font-weight: 700;
          display: grid;
          place-items: center;
        }
        .sh-fbar {
          bottom: 12px;
        }
        .sh-sheet {
          top: max(8px, env(safe-area-inset-top, 0px));
          bottom: 0;
          right: 0;
          left: 0;
          width: auto;
          border-radius: var(--r-xl) var(--r-xl) 0 0;
          transform: translateY(105%);
        }
        .sh-mdock {
          top: calc(8px + var(--sh-top) + 56px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Many sheet tabs: keep each tab its natural width and scroll the row instead of squeezing. */
      .sh-stabs .utabs button {
        flex: none;
      }

      /* ==== 12 Nov 2026 (U3): dialog close, universal minimise button, edge handle, customisable tabs ==== */
      /* every #sh-dialog has a visible close button */
      .sh-dialog > .sh-dx {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 3;
      }
      .sh-dialog > .sh-dx svg {
        width: 20px;
        height: 20px;
      }
      .sh-dialog h3 {
        padding-right: 40px;
      }
      /* the minimise button: the same in every bar, large, clearly visible; pulses gently until first used */
      .ib.minb,
      .ib.sm.minb {
        width: 44px;
        height: 44px;
        border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line));
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: var(--r-md);
        flex: none;
      }
      .ib.minb:hover,
      .ib.sm.minb:hover {
        background: color-mix(in srgb, var(--accent) 24%, transparent);
        color: var(--accent);
      }
      .ib.minb svg,
      .ib.sm.minb svg {
        width: 22px;
        height: 22px;
      }
      .ib.minb.pulse {
        animation: shPulse 1.6s ease-in-out 2;
      }
      @keyframes shPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
        50% {
          box-shadow: 0 0 0 7px
            color-mix(in srgb, var(--accent) 30%, transparent);
        }
      }
      /* edge handle: a minimised bar docked to the left or right edge; drag it anywhere, tap to restore */
      .sh-handle {
        position: fixed;
        z-index: 42;
        width: 36px;
        height: 56px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        color: var(--accent);
        box-shadow: var(--elev-2);
        cursor: grab;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        transition:
          left 180ms var(--ease-out),
          top 180ms var(--ease-out);
      }
      .sh-handle[data-side='r'] {
        border-right: 0;
        border-radius: 14px 0 0 14px;
      }
      .sh-handle[data-side='l'] {
        border-left: 0;
        border-radius: 0 14px 14px 0;
      }
      .sh-handle svg {
        width: 20px;
        height: 20px;
        pointer-events: none;
      }
      .sh-handle.drag {
        cursor: grabbing;
        transition: none;
        box-shadow: var(--elev-3);
        border-radius: 14px;
        border-width: 1.5px;
      }
      .sh-handle:hover {
        background: color-mix(in srgb, var(--accent) 26%, var(--surface-2));
      }
      /* customisable tabs: scrolling tabs, "+" always visible at the end */
      .sh-coltabs.sh-tabs {
        display: block;

      .sh-tabs .sh-trow {

                  '</small></button><button class="pinb" data-pin="' +
                  r[2] +
                  '" aria-label="Pin ' +
                  esc(r[0]) +
                  '">' +
                  ic('pin', 16) +
                  '</button></div>'
                )
              }).join('')
          } else {
            p =
              '<h4>Handwriting</h4>' +
              sw(
                'inkOn',
                'Search drawing labels',
                'Words you typed on a drawing are found like notes',
                S.inkOn,
              ) +
              sw(
                'scribOn',
                'Pencil scribble search',
                'Write the word by hand in the box',
                S.scribble,
              ) +
              '<h4>Also found</h4><p class="ex">Database rows: text cells, ticked checkbox columns (so "done" finds ticked rows) and formula results.</p><p class="ex">Words match from the start of a word, ignoring accents and capitals. Locked pages show the title only. Everything runs on this device, even offline.</p><h4>History</h4><button type="button" class="btn" id="clrAll">Clear recent searches</button>'
          }
          return (
            p +
            (tid === 'filters' || tid === 'sort'
              ? '<div style="margin-top:14px"><button type="button" class="btn" id="mReset">Reset filters</button></div>'
              : '')
          )
        }
        var snap = null
        function pickerHTML() {
          if (Shell.sheet.tab() !== 'saved') return ''
          return (
            '<div class="pickrow scrollx" id="pickrow" role="radiogroup" aria-label="Which saved search"><button type="button" class="ptile' +
            (S.pickS === 'all' ? ' on' : '') +
            '" role="radio" aria-checked="' +
            (S.pickS === 'all') +
            '" data-pks="all"><span class="all">' +
            ic('star') +
            '</span><span>All saved</span></button>' +
            S.saved
              .map(function (s) {
                return (
                  '<button type="button" class="ptile' +
                  (String(s.id) === String(S.pickS) ? ' on' : '') +
                  '" role="radio" aria-checked="' +
                  (String(s.id) === String(S.pickS)) +
                  '" data-pks="' +
                  s.id +
                  '"><span class="all">' +
                  ic('search') +
                  '</span><span>' +
                  esc(s.name) +
                  '</span></button>'
                )
              })
              .join('') +
            '</div><div class="track" id="picktrk"><i></i></div>'
          )
        }
        function openMore(t) {
          if (!isPro()) return
          snap = JSON.stringify({
            f: S.filters,
            scope: S.scope,
            chip: S.chip,
            view: S.view,
            saved: S.saved,
            ink: S.inkOn,
            scr: S.scribble,
            rec: S.recents,
            fn: S.fNext,
            fg: S.fGlow,
          })
          Shell.sheet.open({
            title: 'More search options',
            sub: 'Where, filters, order, view and saved searches',
            picker: pickerHTML,
            tabs: TABS,
            tab: t || S.tab,
            body: function (id) {
              S.tab = id
              return paneHTML(id)
            },
            hint: 'Live preview. Nothing is kept until you tap Done',
            after: function () {
              var sh = $('#sh-sheet')
              paintIcons(sh)
              var pk = $('.sh-spick', sh)
              pk.hidden = !pk.innerHTML.trim()
              Shell.track($('#pickrow'), $('#picktrk'))
            },
            onClose: function (commit) {
              if (!commit && snap) {
                var o = JSON.parse(snap)
                S.filters = o.f
                S.scope = o.scope
                S.chip = o.chip
                S.view = o.view
                S.saved = o.saved
                S.inkOn = o.ink
                S.scribble = o.scr
                S.recents = o.rec
                S.fNext = o.fn
                S.fGlow = o.fg
                ss('scope', S.scope)
                ss('view', S.view)
                ss('saved', S.saved)
                ss('ink', S.inkOn)
                ss('scr', S.scribble)
                ss('recents', S.recents)
              }
              snap = null
              S.sel = 0
              render()
            },
          })
        }
        function fixTrack() {
          Shell.track($('#chipRow'), $('#trk'))
        }
        var INV = {
          E1: 'Ctrl/Cmd+K popup',
          E2: 'Ctrl/Cmd+Shift+K features',
          E3: 'Search buttons',
          E4: 'Keys hint',
          E5: 'Close / See all',
          E6: 'Chips with counts',
          E7: 'Books, Highlights coming',
          E8: 'Result groups',
          E9: 'Tasks results',
          E10: 'Features rows and pin',
          E11: 'Recent pages',
          E12: 'Recent and recommended tools',
          E13: 'No results, Search Trash',
          E14: 'Notebook filter',
          E15: 'Tag filter',
          E16: 'Card status',
          E17: 'Changed, Include, Sort',
          E18: 'Views',
          E19: 'Clear filter x',
          E20: 'Review these',
          E21: 'Did you mean',
          E22: 'Empty cards, Again count',
          E23: 'Save and saved searches',
          E24: 'Highlight and snippet',
          E25: 'Location line',
          E26: 'Locked pages',
          E27: 'Ranking',
          E28: 'Word matching',
          E29: 'Offline index',
          E30: 'Row search (checkbox, formula)',
          E31: 'Handwriting labels',
          E32: 'Find scope row',
          E33: 'Find x of y, prev/next, next page',
          E34: 'Jump with glow',
          A1: 'Scope switch in both modes',
          A2: 'Recent searches',
          A3: 'Minimise chip and dock',
          A4: 'Pencil scribble',
          A5: 'Manage saved (rename, duplicate, undo)',
        }
        /* items whose data is visible in the sample results or the More card; each is wired to a live control or sample row */
        var LIVE = {
          E8: 'Grouped view',
          E9: 'Tasks chip',
          E10: 'Features chip',
          E13: 'type zzz',
          E18: 'View switch',
          E20: 'Cards results',
          E21: 'type photosyntesis',
          E2: 'Tools tab + Ctrl+Shift+K',
          E14: 'Filters tab',
          E15: 'Filters tab',
          E16: 'Filters tab',
          E17: 'Time & order tab',
          E22: 'sample empty/Again cards',
          E24: 'marks + snippets',
          E25: 'location line',
          E26: 'locked page sample',
          E27: 'ranking',
          E28: 'word start match',
          E29: 'local data',
          E30: 'sample database rows',
          E31: 'drawing label sample + switch',
          E34: 'jump glow',
          A5: 'Saved tab',
        }
        function coverage() {
          var seen = {}
          $$('[data-cov]').forEach(function (e) {
            e.dataset.cov.split(' ').forEach(function (k) {
              seen[k] = 1
            })
          })
          Object.keys(LIVE).forEach(function (k) {
            seen[k] = 1
          })
          var keys = Object.keys(INV),
            n = keys.filter(function (k) {
              return seen[k]
            }).length
          $('#cov').textContent = 'Coverage ' + n + '/' + keys.length
          $('#covs').textContent =
            'Coverage ' +
            n +
            '/' +
            keys.length +
            ' inventory items (Professional shows all; Beginner the calm essentials)'
          $('#covu').innerHTML = keys
            .map(function (k) {
              return (
                '<li class="' +
                (seen[k] ? 'ok' : '') +
                '">' +
                k +
                ' ' +
                INV[k] +
                (LIVE[k] ? ' (' + LIVE[k] + ')' : '') +
                '</li>'
              )
            })
            .join('')
        }
        function proxy(attr) {
          var b = document.createElement('button')
          b.hidden = true
          b.setAttribute(attr, 'search')
          document.body.appendChild(b)
          b.click()
          b.remove()
        }
        function syncMin() {
          Shell.bar('search', {
            label: 'Search',
            icon: 'search',
            html: '',
            show: Shell.isMin('search'),
          })
        }
        function setMini(v) {
          proxy(v ? 'data-sh-min' : 'data-sh-unmin')
        }
        function openSearch() {
          if (Shell.isMin('search')) {
            setMini(false)
            return
          }
          S.sideWant = true
          Shell.col('side', Shell.isPhone() ? 'over' : 'dock')
          setTimeout(function () {
            $('#q').focus()
            $('#q').select()
          }, 30)
        }
        function applyCols() {
          if (Shell.isPhone()) {
            if (Shell.col('side') !== 'over') Shell.col('side', 'hidden')
            return
          }
          Shell.col(
            'side',
            Shell.isMin('search') || !S.sideWant ? 'hidden' : 'dock',
          )
        }
        document.addEventListener('click', function (e) {
          var t = e.target,
            b = function (s) {
              return t.closest(s)
            },
            x
          if ((x = b('#scopeSeg button'))) {
            S.scope = x.dataset.s
            ss('scope', S.scope)
            S.sel = 0
            render()
            return
          }
          if ((x = b('#chips .chip'))) {
            S.chip = x.dataset.c
            S.sel = 0
            render()
            return
          }
          if (b('#moreB')) {
            openMore()
            return
          }
          if ((x = b('[data-sh-min]'))) {
            syncMin()
            Shell.col('side', 'hidden')
            return
          }
          if (b('[data-sh-unmin]')) {
            syncMin()
            S.sideWant = true
            Shell.col('side', Shell.isPhone() ? 'over' : 'dock')
            setTimeout(function () {
              $('#q').focus()
            }, 30)
            return
          }
          if (b('[data-sh-search]')) {
            openSearch()
            return
          }
          if ((x = b('[data-sh-crumb]'))) {
            toast('Opens ' + x.textContent)
            return
          }
          if ((x = b('[data-sh-nav]'))) {
            toast(
              x.dataset.shNav === 'back'
                ? 'Nothing to go back to'
                : 'Nothing to go forward to',
            )
            return
          }
          if ((x = b('[data-pks]'))) {
            S.pickS = x.dataset.pks
            Shell.sheet.draw()
            var sb = $('#sh-sheet .sh-sbody')
            if (sb) sb.scrollTop = 0
            return
          }
          if ((x = b('[data-sw]'))) {
            var id = x.dataset.sw,
              on = x.getAttribute('aria-checked') !== 'true'
            if (id === 'iJ') S.filters.journal = on
            else if (id === 'iT') S.filters.templates = on
            else if (id === 'iTr') S.filters.trash = on
            else if (id === 'inkOn') {
              S.inkOn = on
              ss('ink', on)
            } else if (id === 'scribOn') {
              S.scribble = on
              ss('scr', on)
            } else if (id === 'fNext') S.fNext = on
            else if (id === 'fGlow') S.fGlow = on
            render()
            return
          }
          if (b('#clr')) {
            setText('')
            $('#q').focus()
            return
          }
          if (b('#fprev') || b('#mp')) {
            findStep(-1)
            return
          }
          if (b('#fnext') || b('#mn')) {
            findStep(1)
            return
          }
          if ((x = b('[data-fx]'))) {
            var k = x.dataset.fx
            S.filters[k] = JSON.parse(DEF)[k]
            render()
            return
          }
          if ((x = b('[data-did]'))) {
            setText(x.dataset.did)
            return
          }
          if (b('#reviewB')) {
            toast('Review started with the matching cards')
            return
          }
          if (b('#saveB') || b('#saveCur')) {
            var nm = S.text.trim() || 'My search'
            S.saved.push({
              id: Date.now(),
              name: nm,
              text: S.text.trim(),
              chip: S.chip,
              filters: Object.assign({}, S.filters),
            })
            ss('saved', S.saved)
            toast('Saved "' + nm + '"')
            render()
            return
          }
          if ((x = b('#viewSeg button'))) {
            S.view = x.dataset.v
            ss('view', S.view)
            render()
            return
          }
          if (b('#clrRec') || b('#clrAll')) {
            S.recents = []
            ss('recents', [])
            render()
            return
          }
          if (b('#trashB')) {
            S.filters.trash = true
            render()
            return
          }
          if (b('#widen')) {
            S.scope = 'everywhere'
            render()
            return
          }
          if ((x = b('[data-pin]'))) {
            toast('Pinned ' + x.dataset.pin + ' to your Home')
            return
          }
          if ((x = b('[data-ft]'))) {
            S.recentTools = [x.dataset.ft]
              .concat(
                S.recentTools.filter(function (k) {
                  return k !== x.dataset.ft
                }),
              )
              .slice(0, 6)
            ss('rt', S.recentTools)
            toast('Opened tool')
            return
          }
          if ((x = b('#mScope button'))) {
            S.scope = x.dataset.v
            ss('scope', S.scope)
            render()
            return
          }
          if ((x = b('[data-mc]'))) {
            S.chip = x.dataset.mc
            render()
            return
          }
          if (b('[data-fnb]')) {
            S.filters.nb = b('[data-fnb]').dataset.fnb || null
            render()
            return
          }
          if (b('[data-ftag]')) {
            S.filters.tag = b('[data-ftag]').dataset.ftag || null
            render()
            return
          }
          if (b('[data-fst]')) {
            S.filters.st = b('[data-fst]').dataset.fst || null
            render()
            return
          }
          if ((x = b('#mCh button'))) {
            S.filters.changed = x.dataset.v
            render()
            return
          }
          if ((x = b('#mSort button'))) {
            S.filters.sort = x.dataset.v
            render()
            return
          }
          if ((x = b('[data-tv]'))) {
            S.view = x.dataset.tv
            ss('view', S.view)
            render()
            return
          }
          if ((x = b('[data-run]'))) {
            var s = S.saved.filter(function (s) {
              return String(s.id) === x.dataset.run
            })[0]
            if (s) {
              S.filters = Object.assign(JSON.parse(DEF), s.filters)
              S.chip = s.chip
              Shell.sheet.close(true)
              setText(s.text)
            }
            return
          }
          if ((x = b('[data-dup]'))) {
            var o = S.saved.filter(function (s) {
              return String(s.id) === x.dataset.dup
            })[0]
            S.saved.push(
              Object.assign({}, o, { id: Date.now(), name: o.name + ' copy' }),
            )
            ss('saved', S.saved)
            render()
            return
          }
          if ((x = b('[data-del]'))) {
            var i = S.saved.findIndex(function (s) {
                return String(s.id) === x.dataset.del
              }),
              rm = S.saved[i]
            S.saved.splice(i, 1)
            ss('saved', S.saved)
            render()
            toast('Deleted "' + rm.name + '"', function () {
              S.saved.splice(i, 0, rm)
              ss('saved', S.saved)
              render()
            })
            return
          }
          if (b('#mReset')) {
            S.filters = JSON.parse(DEF)
            S.chip = 'all'
            render()
            return
          }
          if (b('#scribbleB')) {
            scribble()
            return
          }
          if ((x = b('.res')) && x.dataset.n != null) {
            S.sel = +x.dataset.n
            activate(S.sel)
            return
          }
          if ((x = b('.row2[data-n]'))) {
            S.sel = +x.dataset.n
            activate(S.sel)
            return
          }
        })
        document.addEventListener('input', function (e) {
          var t = e.target
          if (t.id === 'q') {
            S.text = t.value
            S.sel = 0
            S.fi = 0
            render()
            return
          }
          if (t.classList.contains('nm')) {
            var id = t.closest('[data-sid]').dataset.sid,
              s = S.saved.filter(function (s) {
                return String(s.id) === id
              })[0]
            if (s) {
              s.name = t.value
              ss('saved', S.saved)
            }
          }
        })
        $('#q').addEventListener('keydown', function (e) {
          var pf = S.text.trim() && S.scope === 'page'
          if (e.key === 'ArrowDown') {
            e.preventDefault()
            S.sel = Math.min(S.sel + 1, FLAT.length - 1)
            render()
          } else if (e.key === 'ArrowUp') {
            e.preventDefault()
            S.sel = Math.max(S.sel - 1, 0)
            render()
          } else if (e.key === 'Enter') {
            e.preventDefault()
            if (pf) findStep(e.shiftKey ? -1 : 1)
            else activate(S.sel)
          } else if (e.key === 'Escape') {
            if (Shell.sheet.isOpen()) return
            e.stopPropagation()
            if (S.text) setText('')
            else setMini(true)
          }
        })
        document.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault()
            if (e.shiftKey) {
              S.chip = 'feature'
              render()
            }
            openSearch()
          }
        })
        function scribble() {
          var ex = $('#padWrap')
          if (ex) {
            ex.remove()
            return
          }
          var w = document.createElement('div')
          w.id = 'padWrap'
          w.innerHTML =
            '<canvas class="pad" id="pad" aria-label="Write a word here with your Pencil"></canvas><div class="fbar"><span>Write a word, lift the Pencil: it is searched.</span><span class="sp1"></span><button class="link" id="padGo">Use “photosynthesis”</button></div>'
          $('#spin').insertBefore(w, $('#scopeRow'))
          var c = $('#pad')
          c.width = Math.max(300, c.clientWidth * 2)
          c.height = 240
          var g = c.getContext('2d')
          g.lineWidth = 4
          g.lineCap = 'round'
          g.strokeStyle = getComputedStyle(
            document.documentElement,
          ).getPropertyValue('--ink')
          var dn = false,
            to = 0
          function xy(e) {
            var r = c.getBoundingClientRect()
            return [
              ((e.clientX - r.left) * c.width) / r.width,
              ((e.clientY - r.top) * c.height) / r.height,
            ]
          }
          c.addEventListener('pointerdown', function (e) {
            dn = true
            c.setPointerCapture(e.pointerId)
            clearTimeout(to)
            var p = xy(e)
            g.beginPath()
            g.moveTo(p[0], p[1])
          })
          c.addEventListener('pointermove', function (e) {
            if (!dn) return
            var p = xy(e)
            g.lineTo(p[0], p[1])
            g.stroke()
          })
          c.addEventListener('pointerup', function () {
            dn = false
            to = setTimeout(go, 900)
          })
          function go() {
            var p = $('#padWrap')
            if (p) p.remove()
            setText('photosynthesis')
          }
          $('#padGo').onclick = go
        }
        ;(function init() {
          var due = IT.filter(function (i) {
            return i.type === 'card' && (i.st === 'due' || i.st === 'wrong')
          }).length
          Shell.mount({
            space: 'notebooks',
            due: due,
            onSpace: function (k) {
              toast(
                Shell.SPACES.filter(function (s) {
                  return s[0] === k
                })[0][1] + ' is a separate mock-up',
              )
              return false
            },
            onCorner: function (q) {
              toast(
                {
                  settings: 'Settings',
                  save: 'Save & restore',
                  trash: 'Trash',
                  device: 'Device mode: Computer / Touch / Pencil',
                  help: 'Help',
                }[q] + ' opens here',
              )
            },
            onChange: function (what, v) {
              if (what === 'mode') {
                if (
                  v !== 'pro' &&
                  ['feature', 'task', 'book', 'hl'].indexOf(S.chip) >= 0
                )
                  S.chip = 'all'
                Shell.sheet.close(false)
                render()
              }
              if (what === 'col' && v === 'side' && !Shell.isPhone()) {
                var st = Shell.col('side')
                if (st === 'dock' && Shell.isMin('search')) {
                  setMini(false)
                } else S.sideWant = st === 'dock'
              }
            },
          })
          syncMin()
          applyCols()
          paintIcons(document)
          render()
          var rT
          addEventListener('resize', function () {
            clearTimeout(rT)
            rT = setTimeout(function () {
              applyCols()
              fixTrack()
            }, 80)
          })
          window.__S = S
        })()
      })()
    </script>
