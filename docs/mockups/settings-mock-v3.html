<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>Settings Mock-up</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata&display=swap"
    />
    <style>
      /* ==== shell.css · the ONE shared app shell for every mock-up (12 Nov 2026) ====
   Paste this whole file at the top of a mock's <style>. See shell-spec.md.
   Structure classes are prefixed sh-. Primitives (.btn .seg .sw .ib .badge .glass .track) are the one shared version. */
      :root {
        --canvas: #0f0e13;
        --surface-0: #16151b;
        --surface-1: #1d1c23;
        --surface-2: #25242c;
        --surface-3: #2e2d36;
        --ink: #ecebf2;
        --ink-soft: #b8b6c3;
        --muted: #9a98a6;
        --line: #2a2931;
        --line-strong: #7f7d8c;
        --hover: rgba(255, 255, 255, 0.06);
        --pressed: rgba(255, 255, 255, 0.1);
        --accent: #a08cff;
        --on-accent: #16112e;
        --accent-soft: rgba(160, 140, 255, 0.16);
        --danger: #ff7a6b;
        --success: #5fd39a;
        --warn: #f0b35a;
        --glass-fill: rgba(29, 28, 35, 0.7);
        --glass-line: rgba(255, 255, 255, 0.08);
        --elev-1: 0 0 0 1px rgba(255, 255, 255, 0.06);
        --elev-2: 0 8px 24px rgba(0, 0, 0, 0.4);
        --elev-3: 0 16px 48px rgba(0, 0, 0, 0.55);
        --scrim: rgba(0, 0, 0, 0.48);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.35 0.12 290/0.45),
            transparent 55%
          ),
          radial-gradient(at 90% 10%, oklch(0.32 0.1 255/0.35), transparent 50%);
        --r-xs: 6px;
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 24px;
        --dur-1: 120ms;
        --dur-2: 180ms;
        --dur-3: 240ms;
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --ease-in: cubic-bezier(0.4, 0, 1, 1);
        --sans:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter Variable',
          Inter, system-ui, sans-serif;
        /* shell sizes: change here only */
        --sh-rail: 56px;
        --sh-side: 264px;
        --sh-panel: 264px;
        --sh-top: 52px;
        --sh-tabbar: 56px;
        --sh-gap: 12px;
        --sh-sheet: 440px;
        --sh-hit: 44px;
        --sh-safe-b: env(safe-area-inset-bottom, 0px);
        --sh-bottom: 0px;
        --sh-bar: 0px;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']):not([data-theme='sepia']) {
          --canvas: #f4f3f8;
          --surface-0: #ffffff;
          --surface-1: #fafafc;
          --surface-2: #ffffff;
          --surface-3: #ffffff;
          --ink: #18171c;
          --ink-soft: #4d4b55;
          --muted: #6b6976;
          --line: #eceaf1;
          --line-strong: #8a8796;
          --hover: rgba(24, 23, 28, 0.05);
          --pressed: rgba(24, 23, 28, 0.09);
          --accent: #6941e0;
          --on-accent: #ffffff;
          --accent-soft: rgba(105, 65, 224, 0.1);
          --danger: #c0352b;
          --success: #1a7248;
          --warn: #8f5200;
          --glass-fill: rgba(255, 255, 255, 0.72);
          --glass-line: rgba(255, 255, 255, 0.6);
          --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-2:
            0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
          --scrim: rgba(0, 0, 0, 0.24);
          --wash:
            radial-gradient(
              at 15% 0%,
              oklch(0.92 0.06 290/0.55),
              transparent 55%
            ),
            radial-gradient(
              at 90% 10%,
              oklch(0.93 0.05 250/0.45),
              transparent 50%
            );
          color-scheme: light;
        }
      }
      :root[data-theme='light'] {
        --canvas: #f4f3f8;
        --surface-0: #ffffff;
        --surface-1: #fafafc;
        --surface-2: #ffffff;
        --surface-3: #ffffff;
        --ink: #18171c;
        --ink-soft: #4d4b55;
        --muted: #6b6976;
        --line: #eceaf1;
        --line-strong: #8a8796;
        --hover: rgba(24, 23, 28, 0.05);
        --pressed: rgba(24, 23, 28, 0.09);
        --accent: #6941e0;
        --on-accent: #ffffff;
        --accent-soft: rgba(105, 65, 224, 0.1);
        --danger: #c0352b;
        --success: #1a7248;
        --warn: #8f5200;
        --glass-fill: rgba(255, 255, 255, 0.72);
        --glass-line: rgba(255, 255, 255, 0.6);
        --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-2:
          0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
        --scrim: rgba(0, 0, 0, 0.24);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.92 0.06 290/0.55),
            transparent 55%
          ),
          radial-gradient(
            at 90% 10%,
            oklch(0.93 0.05 250/0.45),
            transparent 50%
          );
        color-scheme: light;
      }
      :root[data-theme='sepia'] {
        --canvas: #f3e9d2;
        --surface-0: #fbf3e0;
        --surface-1: #f7eed8;
        --surface-2: #fbf3e0;
        --surface-3: #fbf3e0;
        --ink: #3b2f1e;
        --ink-soft: #5c4b33;
        --muted: #74644a;
        --line: #e6d8b8;
        --line-strong: #8e7d5e;
        --hover: rgba(59, 47, 30, 0.06);
        --pressed: rgba(59, 47, 30, 0.1);
        --accent: #8a4b1f;
        --on-accent: #fff;
        --accent-soft: rgba(138, 75, 31, 0.12);
        --danger: #b3341f;
        --success: #2f6b3f;
        --warn: #8f5200;
        --glass-fill: rgba(251, 243, 224, 0.78);
        --glass-line: rgba(255, 255, 255, 0.5);
        --elev-1: 0 1px 2px rgba(59, 47, 30, 0.08);
        --elev-2: 0 4px 16px rgba(59, 47, 30, 0.1);
        --elev-3: 0 16px 48px rgba(59, 47, 30, 0.18);
        --scrim: rgba(30, 22, 8, 0.34);
        --wash: radial-gradient(
          at 15% 0%,
          oklch(0.9 0.05 80/0.55),
          transparent 55%
        );
        color-scheme: light;
      }

      /* ---- base ---- */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--canvas);
        background-image: var(--wash);
        background-attachment: fixed;
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        width: 20px;
        height: 20px;
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .glass {
        background: var(--glass-fill);
        border: 1px solid var(--glass-line);
        box-shadow: var(--elev-2);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        backdrop-filter: blur(18px) saturate(160%);
      }
      @media (prefers-reduced-transparency: reduce) {
        .glass {
          background: var(--surface-2);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }

      /* ---- primitives ---- */
      .ib {
        width: var(--sh-hit);
        height: var(--sh-hit);
        border: 0;
        border-radius: var(--r-md);
        background: transparent;
        color: var(--ink-soft);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background var(--dur-1),
          color var(--dur-1);
        flex: none;
        position: relative;
      }
      .ib:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .ib:active {
        background: var(--pressed);
      }
      .ib.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ib:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .ib.sm {
        width: 36px;
        height: 36px;
      }
      .ib.sm svg {
        width: 18px;
        height: 18px;
      }
      .ib.sm::before {
        content: '';
        position: absolute;
        inset: -4px;
      } /* 44pt hit area on small icons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: var(--sh-hit);
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          transform var(--dur-1);
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
      }
      .btn.pri:hover {
        filter: brightness(1.06);
      }
      .btn.dng {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
        position: relative;
      }
      .btn.sm::before,
      .seg.sm button::before {
        content: '';
        position: absolute;
        inset: -4px 0;
      } /* small controls still get a 44pt hit area */
      .btn.more {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: transparent;
      } /* the More button: sliders icon + label, FIRST in its row */
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: 999px;
        background: var(--hover);
        max-width: 100%;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
        padding: 0 14px;
        min-height: var(--sh-hit);
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          color var(--dur-1);
      }
      .seg.sm button {
        min-height: 36px;
        padding: 0 11px;
        font-size: 12.5px;
        position: relative;
        min-width: 44px;
      }
      .seg button.on {
        background: var(--surface-2);
        color: var(--accent);
        box-shadow: var(--elev-1);
      }
      .sw {
        position: relative;
        width: 52px;
        height: 32px;
        border-radius: 999px;
        border: 0;
        background: var(--line-strong);
        cursor: pointer;
        flex: none;
        transition: background var(--dur-1);
      }
      .sw::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        transition: transform var(--dur-1) var(--ease-out);
      }
      .sw[aria-checked='true'] {
        background: var(--accent);
      }
      .sw[aria-checked='true']::after {
        transform: translateX(20px);
      }
      .sw:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .sw::before {
        content: '';
        position: absolute;
        inset: -6px 0;
      }
      .badge {
        font-size: 11.5px;
        font-weight: 700;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
      }
      .inp {
        min-height: var(--sh-hit);
        border-radius: var(--r-sm);
        border: 1px solid var(--line);
        background: var(--surface-0);
        padding: 0 12px;
        width: 100%;
      }
      .mini {
        font-size: 12px;
        color: var(--muted);
      }
      .scrollx {
        overflow-x: auto;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }
      .scrollx::-webkit-scrollbar {
        display: none;
      }
      .track {
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        margin-top: 2px;
        position: relative;
      }
      .track i {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 3px;
        background: var(--line-strong);
      }
      .track.off {
        visibility: hidden;
      }
      .utabs {
        display: flex;
        gap: 2px;
      }
      .utabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        min-width: var(--sh-hit);
        justify-content: center;
        padding: 0 12px;
        font-weight: 600;
        font-size: 13.5px;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .utabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      [data-mode='beg'] .pro {
        display: none !important;
      }

      /* ---- frame ---- */
      .sh-wrap {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 1320px;
        margin: 0 auto;
        padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px
          max(12px, env(safe-area-inset-left, 0px));
      }
      .sh-demo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex: none;
      }
      .sh-demo .t {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin-right: auto;
      }
      .sh-shell {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: var(--sh-gap);
        align-items: stretch;
        position: relative;
      }

      /* ---- rail (left edge) / tab bar (phone) ---- */
      .sh-rail {
        width: var(--sh-rail);
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 6px;
        border-radius: var(--r-lg);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-rail .mk {
        width: 32px;
        height: 32px;
        border-radius: var(--r-md);
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 15px;
        flex: none;
      }
      .sh-rail .grow {
        flex: 1;
      }
      .sh-rail .ib svg {
        width: 24px;
        height: 24px;
      }
      .sh-rail .ib .lbl {
        display: none;
      }
      .sh-rail .ib .bd {
        position: absolute;
        top: 2px;
        right: 0;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 10.5px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      .sh-rail .ib.on::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }

      /* ---- sidebar + left panel (two columns that dock, overlay or hide) ---- */
      .sh-side,
      .sh-panel {
        flex: none;
        border-radius: var(--r-lg);
        background: var(--surface-1);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      .sh-side {
        width: var(--sh-side);
      }
      .sh-panel {
        width: var(--sh-panel);
      }
      .sh-side[data-state='hidden'],
      .sh-panel[data-state='hidden'] {
        display: none;
      }
      .sh-side[data-state='over'],
      .sh-panel[data-state='over'] {
        position: fixed;
        left: max(8px, env(safe-area-inset-left, 0px));
        top: 8px;
        bottom: 8px;
        width: min(86vw, 320px);
        z-index: 60;
        box-shadow: var(--elev-3);
        animation: shIn var(--dur-2) var(--ease-out);
      }
      .sh-colhd {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 8px 4px;
        flex: none;
      }
      .sh-colhd h2 {
        font-size: 15px;
        margin: 0 auto 0 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sh-coltabs {
        display: flex;
        gap: 2px;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .sh-coltabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
      }
      .sh-coltabs button svg {
        width: 16px;
        height: 16px;
      }
      .sh-coltabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .sh-colscroll {
        overflow: auto;
        padding: 6px 8px 12px;
        flex: 1;
        min-height: 0;
        overscroll-behavior: contain;
        position: relative;
      }
      .sh-colfoot {
        flex: none;
        border-top: 1px solid var(--line);
        padding: 6px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* ---- main column + top bar ---- */
      .sh-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }
      .sh-top {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: var(--sh-top);
        padding: 0 4px;
        flex: none;
      }
      .sh-crumbs {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        font-size: 13px;
        color: var(--muted);
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        padding-left: 4px;
      }
      .sh-crumbs svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .sh-crumbs button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0 4px;
        min-height: var(--sh-hit);
        border-radius: var(--r-xs);
        font-size: 13px;
      }
      .sh-crumbs button:hover {
        color: var(--ink);
        background: var(--hover);
      }
      .sh-crumbs b {
        font-weight: 500;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }
      .sh-saved {
        font-size: 12px;
        color: var(--muted);
        padding: 0 6px;
        white-space: nowrap;
      }
      .sh-scroll {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        border-radius: var(--r-lg);
        padding-bottom: calc(84px + var(--sh-safe-b));
      }

      /* ---- floating bar (bottom centre of the main column) + minimise chips (right edge) ---- */
      .sh-fbar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        max-width: calc(100% - 24px);
        transition:
          opacity 150ms var(--ease-out),
          transform 150ms var(--ease-out);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-fbar[hidden] {
        display: none !important;
      }
      .sh-fbar .lab {
        font-size: 13px;
        font-weight: 600;
        padding: 0 10px;
        white-space: nowrap;
      }
      .sh-fbar .sep {
        width: 1px;
        height: 24px;
        background: var(--line);
        margin: 0 4px;
        flex: none;
      }
      .sh-fbar .minb {
        color: var(--muted);
      }
      .sh-fbar .minb svg {
        width: 18px;
        height: 18px;
      }
      .sh-mdock {
        position: fixed;
        right: 0;
        top: calc(12px + var(--sh-top) + 64px);
        z-index: 41;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
      }
      .sh-mchip {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        height: var(--sh-hit);
        padding: 0 12px 0 8px;
        border: 1.5px solid var(--accent);
        border-right: 0;
        border-radius: 14px 0 0 14px;
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        box-shadow: var(--elev-2);
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        animation: shChip 150ms var(--ease-out);
        transition:
          padding 150ms var(--ease-out),
          background 150ms var(--ease-out);
      }
      .sh-mchip:hover {
        padding-right: 16px;
        background: color-mix(in srgb, var(--accent) 24%, var(--surface-2));
      }
      .sh-mchip svg.c {
        width: 14px;
        height: 14px;
      }
      .sh-mchip span {
        color: var(--ink);
      }

      /* ---- scrim, More sheet (fixed, full height, scrolls inside), dialog, pop, toast ---- */
      .sh-scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 59;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-2);
      }
      .sh-scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .sh-scrim.hi {
        z-index: 79;
      }
      .sh-sheet {
        position: fixed;
        z-index: 80;
        top: 12px;
        bottom: 12px;
        right: max(12px, env(safe-area-inset-right, 0px));
        width: min(var(--sh-sheet), calc(100vw - 24px));
        display: flex;
        flex-direction: column;
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        overflow: hidden;
        transform: translateX(calc(100% + 24px));
        visibility: hidden;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s linear var(--dur-3);
      }
      .sh-sheet.on {
        transform: none;
        visibility: visible;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s;
      }
      .sh-shd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 8px 6px 14px;
        flex: none;
      }
      .sh-shd h3 {
        margin: 0;
        font-size: 17px;
      }
      .sh-shd p {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-shd .gr {
        flex: 1;
        min-width: 0;
      }
      .sh-spick {
        flex: none;
        padding: 0 12px 4px;
      }
      .sh-stabs {
        flex: none;
        padding: 0 10px;
      }
      .sh-stabs .utabs {
        border-bottom: 1px solid var(--line);
      }
      .sh-sbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 16px 20px;
      }
      .sh-sft {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px calc(8px + var(--sh-safe-b));
        border-top: 1px solid var(--line);
        background: var(--surface-0);
      }
      .sh-sft .gr {
        flex: 1;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-dialog {
        position: fixed;
        z-index: 85;
        left: 50%;
        top: 50%;
        width: min(420px, calc(100vw - 24px));
        transform: translate(-50%, -48%) scale(0.98);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        padding: 18px;
      }
      .sh-dialog.on {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      .sh-dialog h3 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .sh-dialog .ft {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .sh-pop {
        position: fixed;
        z-index: 86;
        min-width: 220px;
        max-width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        overflow: auto;
        border-radius: var(--r-md);
        padding: 6px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        animation: shPop var(--dur-1) var(--ease-out);
      }
      .sh-pop .mi {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: var(--sh-hit);
        padding: 0 10px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        text-align: left;
        font-size: 14px;
      }
      .sh-pop .mi:hover {
        background: var(--hover);
      }
      .sh-pop .mi svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .sh-pop .mi.dng,
      .sh-pop .mi.dng svg {
        color: var(--danger);
      }
      .sh-pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      .sh-pop .lbl {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
        color: var(--muted);
        padding: 6px 10px 2px;
      }
      .sh-toast {
        position: fixed;
        left: 50%;
        bottom: calc(
          24px + var(--sh-bottom) + var(--sh-bar) + var(--sh-safe-b)
        );
        transform: translate(-50%, 16px);
        opacity: 0;
        pointer-events: none;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 6px 0 18px;
        border-radius: 999px;
        background: var(--surface-3);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        max-width: calc(100vw - 24px);
        font-size: 14px;
        font-weight: 500;
      }
      .sh-toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .sh-toast span {
        padding-right: 12px;
      }
      .sh-toast button {
        border: 0;
        background: none;
        color: var(--accent);
        font-weight: 700;
        min-height: var(--sh-hit);
        padding: 0 12px;
        cursor: pointer;
        border-radius: 999px;
      }
      .sh-tabbar {
        display: none;
      }
      @keyframes shIn {
        from {
          transform: translateX(-24px);
          opacity: 0;
        }
      }
      @keyframes shChip {
        from {
          transform: translateX(100%);
        }
      }
      @keyframes shPop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }

      /* ---- phone (640 and under): rail becomes the bottom tab bar, columns become drawers, the sheet fills the screen ---- */
      @media (max-width: 640px) {
        :root {
          --sh-bottom: var(--sh-tabbar);
        }
        .sh-wrap {
          padding: 8px 8px calc(var(--sh-tabbar) + var(--sh-safe-b));
        }
        .sh-rail {
          display: none;
        }
        .sh-side:not([data-state='over']),
        .sh-panel:not([data-state='over']) {
          display: none;
        }
        .sh-tabbar {
          display: flex;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          height: calc(var(--sh-tabbar) + var(--sh-safe-b));
          padding: 0 4px var(--sh-safe-b);
          justify-content: space-around;
          align-items: center;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
        }
        .sh-tabbar .ib {
          flex: 1;
          width: auto;
          height: 48px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1px;
          font-size: 10px;
          font-weight: 600;
          border-radius: var(--r-sm);
        }
        .sh-tabbar .ib svg {
          width: 22px;
          height: 22px;
        }
        .sh-tabbar .ib .bd {
          position: absolute;
          top: 2px;
          left: calc(50% + 6px);
          min-width: 16px;
          height: 16px;
          padding: 0 4px;
          border-radius: 999px;
          background: var(--accent);
          color: var(--on-accent);
          font-size: 10px;
          font-weight: 700;
          display: grid;
          place-items: center;
        }
        .sh-fbar {
          bottom: 12px;
        }
        .sh-sheet {
          top: max(8px, env(safe-area-inset-top, 0px));
          bottom: 0;
          right: 0;
          left: 0;
          width: auto;
          border-radius: var(--r-xl) var(--r-xl) 0 0;
          transform: translateY(105%);
        }
        .sh-mdock {
          top: calc(8px + var(--sh-top) + 56px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Many sheet tabs: keep each tab its natural width and scroll the row instead of squeezing. */
      .sh-stabs .utabs button {
        flex: none;
      }

      /* ==== 12 Nov 2026 (U3): dialog close, universal minimise button, edge handle, customisable tabs ==== */
      /* every #sh-dialog has a visible close button */
      .sh-dialog > .sh-dx {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 3;
      }
      .sh-dialog > .sh-dx svg {
        width: 20px;
        height: 20px;
      }
      .sh-dialog h3 {
        padding-right: 40px;
      }
      /* the minimise button: the same in every bar, large, clearly visible; pulses gently until first used */
      .ib.minb,
      .ib.sm.minb {
        width: 44px;
        height: 44px;
        border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line));
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: var(--r-md);
        flex: none;
      }
      .ib.minb:hover,
      .ib.sm.minb:hover {
        background: color-mix(in srgb, var(--accent) 24%, transparent);
        color: var(--accent);
      }
      .ib.minb svg,
      .ib.sm.minb svg {
        width: 22px;
        height: 22px;
      }
      .ib.minb.pulse {
        animation: shPulse 1.6s ease-in-out 2;
      }
      @keyframes shPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
        50% {
          box-shadow: 0 0 0 7px
            color-mix(in srgb, var(--accent) 30%, transparent);
        }
      }
      /* edge handle: a minimised bar docked to the left or right edge; drag it anywhere, tap to restore */
      .sh-handle {
        position: fixed;
        z-index: 42;
        width: 36px;
        height: 56px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        color: var(--accent);
        box-shadow: var(--elev-2);
        cursor: grab;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        transition:
          left 180ms var(--ease-out),
          top 180ms var(--ease-out);
      }
      .sh-handle[data-side='r'] {
        border-right: 0;
        border-radius: 14px 0 0 14px;
      }
      .sh-handle[data-side='l'] {
        border-left: 0;
        border-radius: 0 14px 14px 0;
      }
      .sh-handle svg {
        width: 20px;
        height: 20px;
        pointer-events: none;
      }
      .sh-handle.drag {
        cursor: grabbing;
        transition: none;
        box-shadow: var(--elev-3);
        border-radius: 14px;
        border-width: 1.5px;
      }
      .sh-handle:hover {
        background: color-mix(in srgb, var(--accent) 26%, var(--surface-2));
      }
      /* customisable tabs: scrolling tabs, "+" always visible at the end */
      .sh-coltabs.sh-tabs {
        display: block;
        padding: 0 4px 0 8px;
      }
      .sh-tabs .sh-trow {
        display: flex;
        align-items: stretch;
        gap: 2px;
      }
      .sh-tabs .sh-tscroll {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1;
        min-width: 0;
      }
      .sh-tabs .sh-tscroll::-webkit-scrollbar {
        display: none;
      }
      .sh-tabs .sh-tscroll button {
        flex: none;
        padding: 0 11px;
      }
      .sh-tabs .sh-tplus {
        flex: none;
        width: var(--sh-hit);
        padding: 0;
        color: var(--accent);
        border-bottom-color: transparent;
      }
      .sh-tabs .sh-tplus svg {
        display: block;
        width: 20px;
        height: 20px;
      }
      .sh-tabs .track {
        margin: 0 4px 0 0;
      }
      .sh-tedit {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: min(52vh, 360px);
        overflow: auto;
        margin: 4px -4px 0;
        padding: 2px 4px;
      }
      .sh-trw {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface-2);
        position: relative;
      }
      .sh-trw .gp {
        cursor: grab;
        touch-action: none;
        color: var(--muted);
      }
      .sh-trw .gp svg {
        width: 18px;
        height: 18px;
      }
      .sh-trw input {
        flex: 1;
        min-width: 0;
        min-height: 40px;
        border: 0;
        background: transparent;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
        padding: 0 6px;
        border-radius: var(--r-sm);
      }
      .sh-trw input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .sh-trw .ib[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }
      .sh-trw.drag {
        box-shadow: var(--elev-2);
        z-index: 2;
        border-color: var(--accent);
      }
      .sh-trw .rm {
        color: var(--danger);
      }
      .sh-tpop .mi small {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      /* ---- clear (x) button inside any text field (Shell.clearable / Shell.autoClear) ---- */
      .sh-clr {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
        align-items: center;
      }
      .sh-clr > input,
      .sh-clr > textarea {
        padding-right: 40px !important;
      }
      .sh-clr .sh-clrb {
        position: absolute;
        right: 2px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .sh-clr.ta .sh-clrb {
        top: 6px;
        transform: none;
      }
      .sh-clr > input:placeholder-shown ~ .sh-clrb,
      .sh-clr > textarea:placeholder-shown ~ .sh-clrb {
        display: none;
      }
      .sh-clr input[type='search']::-webkit-search-cancel-button {
        display: none;
      }
      /* ==== end shell.css (all) ==== */

      /* left: categories */
      .ttl {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 6px 4px 0;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin: 0 4px;
      }
      .search {
        position: relative;
      }
      .search svg {
        z-index: 1;
        position: absolute;
        left: 12px;
        top: 50%;
        margin-top: -9px;
        width: 18px;
        height: 18px;
        color: var(--muted);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        min-height: 44px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-1);
        color: var(--ink);
        font: inherit;
        padding: 0 40px 0 38px;
        outline: none;
        transition: border-color var(--dur-1);
      }
      .search input:focus {
        border-color: var(--accent);
      }
      .catlist {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        border-radius: var(--r-lg);
      }
      .cat {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 6px 10px;
        border: 0;
        background: transparent;
        border-radius: var(--r-md);
        cursor: pointer;
        text-align: left;
        transition:
          background var(--dur-1),
          color var(--dur-1);
        color: var(--ink-soft);
      }
      .cat:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .cat.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .cat svg {
        width: 22px;
        height: 22px;
      }
      .cat .tx {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .cat b {
        font-weight: 600;
        font-size: 15px;
        color: var(--ink);
      }
      .cat.on b {
        color: var(--accent);
      }
      .cat small {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat .n {
        font-size: 12px;
        color: var(--muted);
        min-width: 20px;
        text-align: right;
      }
      .more {
        font-size: 13px;
        color: var(--muted);
        margin: 0 6px;
      }
      .more button {
        border: 0;
        background: transparent;
        color: var(--accent);
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
        padding: 0 4px;
      }
      /* right: detail */
      .dhead {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dhead h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .dhint {
        margin: -8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .group {
        border-radius: var(--r-lg);
        background: var(--surface-0);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .gh {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 6px 6px -6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        min-height: 64px;
        border-top: 1px solid var(--line);
        transition: background var(--dur-3);
      }
      .row:first-child {
        border-top: 0;
      }
      .row.flash {
        background: var(--accent-soft);
      }
      .row .tx {
        flex: 1;
        min-width: 0;
      }
      .row .lb {
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row .ds {
        font-size: 13px;
        color: var(--muted);
        margin-top: 1px;
      }
      .row .ctl {
        flex: none;
        max-width: 56%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row .crumb {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 99px;
        padding: 1px 7px;
        line-height: 16px;
      }
      .tag.new {
        color: var(--on-accent);
        background: var(--accent);
      }
      select,
      input.num {
        min-height: 44px;
        border-radius: var(--r-md);
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        font: inherit;
        padding: 0 10px;
        max-width: 100%;
      }
      input.num {
        width: 84px;
        text-align: right;
      }
      .unit {
        font-size: 13px;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }
      .chip {
        min-height: 44px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink-soft);
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .chip.on {
        background: var(--accent-soft);
        border-color: transparent;
        color: var(--accent);
      }
      .info {
        font-size: 14px;
        color: var(--ink-soft);
      }
      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
      }
      /* ---- Professional features: one switch per Pro feature ---- */
      .pfbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pfbar .inp {
        flex: 1 1 200px;
        width: auto;
        min-width: 0;
      }
      .pfg {
        border-radius: var(--r-lg);
        background: var(--surface-0);
        border: 1px solid var(--line);
        overflow: hidden;
        margin-top: 10px;
      }
      .pfg > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;

              l.v +
              '" aria-pressed="' +
              (MD.view === l.v) +
              '"><span class="lvh"><b>' +
              l.n +
              '</b>' +
              (MD.view === l.v ? '<span class="tag">Chosen</span>' : '') +
              '</span><p>' +
              l.d +
              '</p></button>',
          ).join('')
        if (t === 'tours')
          return (
            '<p class="mini" style="margin:0 0 10px">Pick a tour. It starts when you tap Done. More tours to download are in Your experience.</p><div class="chips" style="justify-content:flex-start">' +
            TOPICS.map(
              (x) =>
                '<button type="button" class="chip' +
                (MD.tour === 't-' + x[0] ? ' on' : '') +
                '" data-mt="t-' +
                x[0] +
                '" aria-pressed="' +
                (MD.tour === 't-' + x[0]) +
                '">' +
                esc(x[1]) +
                '</button>',
            ).join('') +
            '</div>'
          )
        return (
          '<div class="group"><div class="row inl"><div class="tx"><div class="lb">Reset this mock-up</div><div class="ds">Clears the choices saved in this browser. You are asked to confirm.</div></div><div class="ctl"><button class="sw" role="switch" aria-checked="' +
          MD.reset +
          '" aria-label="Reset this mock-up" data-mr></button></div></div></div>'
        )
      }
      function openMore(tab) {
        MD = { view: S.view, tour: null, reset: false }
        Shell.sheet.open({
          title: 'Settings tools',
          sub: 'Level, tours and reset',
          tabs: [
            ['level', 'Level'],
            ['tours', 'Tours'],
            ['reset', 'Reset'],
          ],
          tab: tab || 'level',
          hint: 'Nothing changes until you tap Done',
          body: moreBody,
          onClose: (commit) => {
            const d = MD
            MD = null
            if (!commit || !d) return
            if (d.reset) {
              confirmBox(
                'Reset this mock-up?',
                'Clears the choices saved in this browser.',
                'Reset',
                () => {
                  store.clear()
                  PF.u = {}
                  S = {
                    vals: defaults(),
                    view: 'beginner',
                    picked: false,
                    cat: 'experience',
                    q: '',
                    lastToast: '',
                  }
                  render()
                  toast('Reset')
                  openPicker()
                },
              )
              return
            }
            if (d.view !== S.view) setView(d.view, true)
            if (d.tour) startTour(d.tour, { restore: true })
          },
        })
      }
      document.addEventListener('click', (e) => {
        const T = e.target
        if (!T.closest) return
        let b
        if ((b = T.closest('#sh-sheet [data-mv]')) && MD) {
          MD.view = b.dataset.mv
          Shell.sheet.draw()
          return
        }
        if ((b = T.closest('#sh-sheet [data-mt]')) && MD) {
          MD.tour = MD.tour === b.dataset.mt ? null : b.dataset.mt
          Shell.sheet.draw()
          return
        }
        if (T.closest('#sh-sheet [data-mr]') && MD) {
          MD.reset = !MD.reset
          Shell.sheet.draw()
          return
        }
        if (T.closest('[data-sh-search]')) {
          if (Shell.isPhone()) Shell.col('side', 'over')
          else if (Shell.col('side') === 'hidden') Shell.col('side', 'dock')
          setTimeout(() => $('#q').focus(), 60)
          return
        }
        if ((b = T.closest('[data-sh-crumb]'))) {
          goCat('experience')
          return
        }
        if ((b = T.closest('[data-sh-nav]'))) {
          if (b.dataset.shNav === 'back') {
            if (hist.i > 0) {
              hist.i--
              goCat(hist.st[hist.i])
            } else toast('Nothing to go back to')
          } else {
            if (hist.i < hist.st.length - 1) {
              hist.i++
              goCat(hist.st[hist.i])
            } else toast('Nothing to go forward to')
          }
          return
        }
        if ((b = T.closest('.cat'))) {
          const c = b.dataset.cat
          if (hist.st[hist.i] !== c) {
            hist.st = hist.st.slice(0, hist.i + 1)
            hist.st.push(c)
            hist.i++
          }
        }
      })
      addEventListener('resize', () => {
        if (!Shell.isPhone() && Shell.col('side') === 'over')
          Shell.col('side', 'dock')
      })
      Shell.mount({
        space: 'settings',
        due: 9,
        onSpace: (k) => {
          toast(
            Shell.SPACES.find((s) => s[0] === k)[1] + ' is a separate mock-up',
          )
          return false
        },
        onCorner: (q) => {
          if (q === 'settings') goCat('experience')
          else
            toast(
              {
                save: 'Save & restore',
                trash: 'Trash',
                device: 'Device mode: Computer / Touch / Pencil',
                help: 'Help',
              }[q] + ' opens here',
            )
        },
        onChange: (what, v) => {
          if (what === 'mode') {
            if (v === 'beg' && S.view !== 'beginner') {
              S.view = 'beginner'
              S.picked = true
              render()
            } else if (v === 'pro' && S.view === 'beginner') {
              S.view = 'pro'
              S.picked = true
              render()
            }
          }
          if (what === 'theme') {
            const i = ['Day', 'Night', 'Sepia'].indexOf(v)
            if (i >= 0 && V('general.theme') !== i) {
              S.vals['general.theme'] = i
              store.set()
              renderDetail(1)
              updatePreview()
            }
          }
        },
      })
      Shell.icons('A')
      if (document.documentElement.dataset.theme)
        S.vals['general.theme'] = Math.max(
          0,
          ['Day', 'Night', 'Sepia'].indexOf(Shell.theme()),
        )
      if (Shell.mode() === 'beg') S.view = 'beginner'
      else if (S.view === 'beginner') S.view = 'standard'
      syncRail()
      // ---- start
      render()
      if (!S.picked) openPicker()
    </script>
    <button type="button" class="ppill" id="ppill" aria-pressed="false">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="7" y="2.5" width="10" height="19" rx="2.5" />
        <path d="M11 18.5h2" /></svg
      ><span>Phone preview</span>
    </button>
    <div class="ppv" id="ppv" role="dialog" aria-label="Phone preview">
      <iframe id="ppf" title="Settings at phone width"></iframe>
    </div>
    <script>
      ;(function () {
        if (window.self !== window.top) {
          document.documentElement.classList.add('ppin')
          return
        }
        var b = document.getElementById('ppill'),
          v = document.getElementById('ppv'),
          f = document.getElementById('ppf'),
          l = b.querySelector('span')
        function set(on) {
          v.classList.toggle('on', on)
          b.setAttribute('aria-pressed', on)
          l.textContent = on ? 'Exit phone preview' : 'Phone preview'
          if (on && !f.src) f.src = location.href.split('#')[0]
        }
        b.addEventListener('click', function () {
          set(!v.classList.contains('on'))
        })
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && v.classList.contains('on')) set(false)
        })
        v.addEventListener('click', function (e) {
          if (e.target === v) set(false)
        })
      })()
    </script>
  </body>
</html>
