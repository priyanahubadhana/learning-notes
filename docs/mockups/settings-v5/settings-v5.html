<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>Settings v5b</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata&display=swap"
    />
    <style>
      /* ==== shell.css · the ONE shared app shell for every mock-up (12 Nov 2026) ====
   Paste this whole file at the top of a mock's <style>. See shell-spec.md.
   Structure classes are prefixed sh-. Primitives (.btn .seg .sw .ib .badge .glass .track) are the one shared version. */
      :root {
        --canvas: #0f0e13;
        --surface-0: #16151b;
        --surface-1: #1d1c23;
        --surface-2: #25242c;
        --surface-3: #2e2d36;
        --ink: #ecebf2;
        --ink-soft: #b8b6c3;
        --muted: #9a98a6;
        --line: #2a2931;
        --line-strong: #7f7d8c;
        --hover: rgba(255, 255, 255, 0.06);
        --pressed: rgba(255, 255, 255, 0.1);
        --accent: #a08cff;
        --on-accent: #16112e;
        --accent-soft: rgba(160, 140, 255, 0.16);
        --danger: #ff7a6b;
        --success: #5fd39a;
        --warn: #f0b35a;
        --glass-fill: rgba(29, 28, 35, 0.7);
        --glass-line: rgba(255, 255, 255, 0.08);
        --elev-1: 0 0 0 1px rgba(255, 255, 255, 0.06);
        --elev-2: 0 8px 24px rgba(0, 0, 0, 0.4);
        --elev-3: 0 16px 48px rgba(0, 0, 0, 0.55);
        --scrim: rgba(0, 0, 0, 0.48);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.35 0.12 290/0.45),
            transparent 55%
          ),
          radial-gradient(at 90% 10%, oklch(0.32 0.1 255/0.35), transparent 50%);
        --r-xs: 6px;
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 24px;
        --dur-1: 120ms;
        --dur-2: 180ms;
        --dur-3: 240ms;
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --ease-in: cubic-bezier(0.4, 0, 1, 1);
        --sans:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter Variable',
          Inter, system-ui, sans-serif;
        /* shell sizes: change here only */
        --sh-rail: 56px;
        --sh-side: 264px;
        --sh-panel: 264px;
        --sh-top: 52px;
        --sh-tabbar: 56px;
        --sh-gap: 12px;
        --sh-sheet: 440px;
        --sh-hit: 44px;
        --sh-safe-b: env(safe-area-inset-bottom, 0px);
        --sh-bottom: 0px;
        --sh-bar: 0px;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']):not([data-theme='sepia']) {
          --canvas: #f4f3f8;
          --surface-0: #ffffff;
          --surface-1: #fafafc;
          --surface-2: #ffffff;
          --surface-3: #ffffff;
          --ink: #18171c;
          --ink-soft: #4d4b55;
          --muted: #6b6976;
          --line: #eceaf1;
          --line-strong: #8a8796;
          --hover: rgba(24, 23, 28, 0.05);
          --pressed: rgba(24, 23, 28, 0.09);
          --accent: #6941e0;
          --on-accent: #ffffff;
          --accent-soft: rgba(105, 65, 224, 0.1);
          --danger: #c0352b;
          --success: #1a7248;
          --warn: #8f5200;
          --glass-fill: rgba(255, 255, 255, 0.72);
          --glass-line: rgba(255, 255, 255, 0.6);
          --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-2:
            0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
          --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
          --scrim: rgba(0, 0, 0, 0.24);
          --wash:
            radial-gradient(
              at 15% 0%,
              oklch(0.92 0.06 290/0.55),
              transparent 55%
            ),
            radial-gradient(
              at 90% 10%,
              oklch(0.93 0.05 250/0.45),
              transparent 50%
            );
          color-scheme: light;
        }
      }
      :root[data-theme='light'] {
        --canvas: #f4f3f8;
        --surface-0: #ffffff;
        --surface-1: #fafafc;
        --surface-2: #ffffff;
        --surface-3: #ffffff;
        --ink: #18171c;
        --ink-soft: #4d4b55;
        --muted: #6b6976;
        --line: #eceaf1;
        --line-strong: #8a8796;
        --hover: rgba(24, 23, 28, 0.05);
        --pressed: rgba(24, 23, 28, 0.09);
        --accent: #6941e0;
        --on-accent: #ffffff;
        --accent-soft: rgba(105, 65, 224, 0.1);
        --danger: #c0352b;
        --success: #1a7248;
        --warn: #8f5200;
        --glass-fill: rgba(255, 255, 255, 0.72);
        --glass-line: rgba(255, 255, 255, 0.6);
        --elev-1: 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-2:
          0 4px 16px rgba(24, 23, 28, 0.08), 0 1px 2px rgba(24, 23, 28, 0.06);
        --elev-3: 0 16px 48px rgba(24, 23, 28, 0.14);
        --scrim: rgba(0, 0, 0, 0.24);
        --wash:
          radial-gradient(
            at 15% 0%,
            oklch(0.92 0.06 290/0.55),
            transparent 55%
          ),
          radial-gradient(
            at 90% 10%,
            oklch(0.93 0.05 250/0.45),
            transparent 50%
          );
        color-scheme: light;
      }
      :root[data-theme='sepia'] {
        --canvas: #f3e9d2;
        --surface-0: #fbf3e0;
        --surface-1: #f7eed8;
        --surface-2: #fbf3e0;
        --surface-3: #fbf3e0;
        --ink: #3b2f1e;
        --ink-soft: #5c4b33;
        --muted: #74644a;
        --line: #e6d8b8;
        --line-strong: #8e7d5e;
        --hover: rgba(59, 47, 30, 0.06);
        --pressed: rgba(59, 47, 30, 0.1);
        --accent: #8a4b1f;
        --on-accent: #fff;
        --accent-soft: rgba(138, 75, 31, 0.12);
        --danger: #b3341f;
        --success: #2f6b3f;
        --warn: #8f5200;
        --glass-fill: rgba(251, 243, 224, 0.78);
        --glass-line: rgba(255, 255, 255, 0.5);
        --elev-1: 0 1px 2px rgba(59, 47, 30, 0.08);
        --elev-2: 0 4px 16px rgba(59, 47, 30, 0.1);
        --elev-3: 0 16px 48px rgba(59, 47, 30, 0.18);
        --scrim: rgba(30, 22, 8, 0.34);
        --wash: radial-gradient(
          at 15% 0%,
          oklch(0.9 0.05 80/0.55),
          transparent 55%
        );
        color-scheme: light;
      }

      /* ---- base ---- */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--canvas);
        background-image: var(--wash);
        background-attachment: fixed;
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        width: 20px;
        height: 20px;
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .glass {
        background: var(--glass-fill);
        border: 1px solid var(--glass-line);
        box-shadow: var(--elev-2);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        backdrop-filter: blur(18px) saturate(160%);
      }
      @media (prefers-reduced-transparency: reduce) {
        .glass {
          background: var(--surface-2);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }

      /* ---- primitives ---- */
      .ib {
        width: var(--sh-hit);
        height: var(--sh-hit);
        border: 0;
        border-radius: var(--r-md);
        background: transparent;
        color: var(--ink-soft);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background var(--dur-1),
          color var(--dur-1);
        flex: none;
        position: relative;
      }
      .ib:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .ib:active {
        background: var(--pressed);
      }
      .ib.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ib:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .ib.sm {
        width: 36px;
        height: 36px;
      }
      .ib.sm svg {
        width: 18px;
        height: 18px;
      }
      .ib.sm::before {
        content: '';
        position: absolute;
        inset: -4px;
      } /* 44pt hit area on small icons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: var(--sh-hit);
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          transform var(--dur-1);
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
      }
      .btn.pri:hover {
        filter: brightness(1.06);
      }
      .btn.dng {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
        position: relative;
      }
      .btn.sm::before,
      .seg.sm button::before {
        content: '';
        position: absolute;
        inset: -4px 0;
      } /* small controls still get a 44pt hit area */
      .btn.more {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: transparent;
      } /* the More button: sliders icon + label, FIRST in its row */
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: 999px;
        background: var(--hover);
        max-width: 100%;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
        padding: 0 14px;
        min-height: var(--sh-hit);
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--dur-1),
          color var(--dur-1);
      }
      .seg.sm button {
        min-height: 36px;
        padding: 0 11px;
        font-size: 12.5px;
        position: relative;
        min-width: 44px;
      }
      .seg button.on {
        background: var(--surface-2);
        color: var(--accent);
        box-shadow: var(--elev-1);
      }
      .sw {
        position: relative;
        width: 52px;
        height: 32px;
        border-radius: 999px;
        border: 0;
        background: var(--line-strong);
        cursor: pointer;
        flex: none;
        transition: background var(--dur-1);
      }
      .sw::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        transition: transform var(--dur-1) var(--ease-out);
      }
      .sw[aria-checked='true'] {
        background: var(--accent);
      }
      .sw[aria-checked='true']::after {
        transform: translateX(20px);
      }
      .sw:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .sw::before {
        content: '';
        position: absolute;
        inset: -6px 0;
      }
      .badge {
        font-size: 11.5px;
        font-weight: 700;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
      }
      .inp {
        min-height: var(--sh-hit);
        border-radius: var(--r-sm);
        border: 1px solid var(--line);
        background: var(--surface-0);
        padding: 0 12px;
        width: 100%;
      }
      .mini {
        font-size: 12px;
        color: var(--muted);
      }
      .scrollx {
        overflow-x: auto;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }
      .scrollx::-webkit-scrollbar {
        display: none;
      }
      .track {
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        margin-top: 2px;
        position: relative;
      }
      .track i {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 3px;
        background: var(--line-strong);
      }
      .track.off {
        visibility: hidden;
      }
      .utabs {
        display: flex;
        gap: 2px;
      }
      .utabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        min-width: var(--sh-hit);
        justify-content: center;
        padding: 0 12px;
        font-weight: 600;
        font-size: 13.5px;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .utabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      [data-mode='beg'] .pro {
        display: none !important;
      }

      /* ---- frame ---- */
      .sh-wrap {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 1320px;
        margin: 0 auto;
        padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px
          max(12px, env(safe-area-inset-left, 0px));
      }
      .sh-demo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex: none;
      }
      .sh-demo .t {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin-right: auto;
      }
      .sh-shell {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: var(--sh-gap);
        align-items: stretch;
        position: relative;
      }

      /* ---- rail (left edge) / tab bar (phone) ---- */
      .sh-rail {
        width: var(--sh-rail);
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 6px;
        border-radius: var(--r-lg);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-rail .mk {
        width: 32px;
        height: 32px;
        border-radius: var(--r-md);
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 15px;
        flex: none;
      }
      .sh-rail .grow {
        flex: 1;
      }
      .sh-rail .ib svg {
        width: 24px;
        height: 24px;
      }
      .sh-rail .ib .lbl {
        display: none;
      }
      .sh-rail .ib .bd {
        position: absolute;
        top: 2px;
        right: 0;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 10.5px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      .sh-rail .ib.on::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }

      /* ---- sidebar + left panel (two columns that dock, overlay or hide) ---- */
      .sh-side,
      .sh-panel {
        flex: none;
        border-radius: var(--r-lg);
        background: var(--surface-1);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      .sh-side {
        width: var(--sh-side);
      }
      .sh-panel {
        width: var(--sh-panel);
      }
      .sh-side[data-state='hidden'],
      .sh-panel[data-state='hidden'] {
        display: none;
      }
      .sh-side[data-state='over'],
      .sh-panel[data-state='over'] {
        position: fixed;
        left: max(8px, env(safe-area-inset-left, 0px));
        top: 8px;
        bottom: 8px;
        width: min(86vw, 320px);
        z-index: 60;
        box-shadow: var(--elev-3);
        animation: shIn var(--dur-2) var(--ease-out);
      }
      .sh-colhd {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 8px 4px;
        flex: none;
      }
      .sh-colhd h2 {
        font-size: 15px;
        margin: 0 auto 0 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sh-coltabs {
        display: flex;
        gap: 2px;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .sh-coltabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        min-height: var(--sh-hit);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
      }
      .sh-coltabs button svg {
        width: 16px;
        height: 16px;
      }
      .sh-coltabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .sh-colscroll {
        overflow: auto;
        padding: 6px 8px 12px;
        flex: 1;
        min-height: 0;
        overscroll-behavior: contain;
        position: relative;
      }
      .sh-colfoot {
        flex: none;
        border-top: 1px solid var(--line);
        padding: 6px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* ---- main column + top bar ---- */
      .sh-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }
      .sh-top {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: var(--sh-top);
        padding: 0 4px;
        flex: none;
      }
      .sh-crumbs {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        font-size: 13px;
        color: var(--muted);
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        padding-left: 4px;
      }
      .sh-crumbs svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .sh-crumbs button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0 4px;
        min-height: var(--sh-hit);
        border-radius: var(--r-xs);
        font-size: 13px;
      }
      .sh-crumbs button:hover {
        color: var(--ink);
        background: var(--hover);
      }
      .sh-crumbs b {
        font-weight: 500;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }
      .sh-saved {
        font-size: 12px;
        color: var(--muted);
        padding: 0 6px;
        white-space: nowrap;
      }
      .sh-scroll {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        border-radius: var(--r-lg);
        padding-bottom: calc(84px + var(--sh-safe-b));
      }

      /* ---- floating bar (bottom centre of the main column) + minimise chips (right edge) ---- */
      .sh-fbar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        max-width: calc(100% - 24px);
        transition:
          opacity 150ms var(--ease-out),
          transform 150ms var(--ease-out);
        -webkit-user-select: none;
        user-select: none;
      }
      .sh-fbar[hidden] {
        display: none !important;
      }
      .sh-fbar .lab {
        font-size: 13px;
        font-weight: 600;
        padding: 0 10px;
        white-space: nowrap;
      }
      .sh-fbar .sep {
        width: 1px;
        height: 24px;
        background: var(--line);
        margin: 0 4px;
        flex: none;
      }
      .sh-fbar .minb {
        color: var(--muted);
      }
      .sh-fbar .minb svg {
        width: 18px;
        height: 18px;
      }
      .sh-mdock {
        position: fixed;
        right: 0;
        top: calc(12px + var(--sh-top) + 64px);
        z-index: 41;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
      }
      .sh-mchip {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        height: var(--sh-hit);
        padding: 0 12px 0 8px;
        border: 1.5px solid var(--accent);
        border-right: 0;
        border-radius: 14px 0 0 14px;
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        box-shadow: var(--elev-2);
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        animation: shChip 150ms var(--ease-out);
        transition:
          padding 150ms var(--ease-out),
          background 150ms var(--ease-out);
      }
      .sh-mchip:hover {
        padding-right: 16px;
        background: color-mix(in srgb, var(--accent) 24%, var(--surface-2));
      }
      .sh-mchip svg.c {
        width: 14px;
        height: 14px;
      }
      .sh-mchip span {
        color: var(--ink);
      }

      /* ---- scrim, More sheet (fixed, full height, scrolls inside), dialog, pop, toast ---- */
      .sh-scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 59;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-2);
      }
      .sh-scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .sh-scrim.hi {
        z-index: 79;
      }
      .sh-sheet {
        position: fixed;
        z-index: 80;
        top: 12px;
        bottom: 12px;
        right: max(12px, env(safe-area-inset-right, 0px));
        width: min(var(--sh-sheet), calc(100vw - 24px));
        display: flex;
        flex-direction: column;
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        overflow: hidden;
        transform: translateX(calc(100% + 24px));
        visibility: hidden;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s linear var(--dur-3);
      }
      .sh-sheet.on {
        transform: none;
        visibility: visible;
        transition:
          transform var(--dur-3) var(--ease-out),
          visibility 0s;
      }
      .sh-shd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 8px 6px 14px;
        flex: none;
      }
      .sh-shd h3 {
        margin: 0;
        font-size: 17px;
      }
      .sh-shd p {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-shd .gr {
        flex: 1;
        min-width: 0;
      }
      .sh-spick {
        flex: none;
        padding: 0 12px 4px;
      }
      .sh-stabs {
        flex: none;
        padding: 0 10px;
      }
      .sh-stabs .utabs {
        border-bottom: 1px solid var(--line);
      }
      .sh-sbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 16px 20px;
      }
      .sh-sft {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px calc(8px + var(--sh-safe-b));
        border-top: 1px solid var(--line);
        background: var(--surface-0);
      }
      .sh-sft .gr {
        flex: 1;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sh-dialog {
        position: fixed;
        z-index: 85;
        left: 50%;
        top: 50%;
        width: min(420px, calc(100vw - 24px));
        transform: translate(-50%, -48%) scale(0.98);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        border-radius: var(--r-xl);
        background: var(--surface-1);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        padding: 18px;
      }
      .sh-dialog.on {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      .sh-dialog h3 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .sh-dialog .ft {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .sh-pop {
        position: fixed;
        z-index: 86;
        min-width: 220px;
        max-width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        overflow: auto;
        border-radius: var(--r-md);
        padding: 6px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        animation: shPop var(--dur-1) var(--ease-out);
      }
      .sh-pop .mi {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: var(--sh-hit);
        padding: 0 10px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        text-align: left;
        font-size: 14px;
      }
      .sh-pop .mi:hover {
        background: var(--hover);
      }
      .sh-pop .mi svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .sh-pop .mi.dng,
      .sh-pop .mi.dng svg {
        color: var(--danger);
      }
      .sh-pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      .sh-pop .lbl {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
        color: var(--muted);
        padding: 6px 10px 2px;
      }
      .sh-toast {
        position: fixed;
        left: 50%;
        bottom: calc(
          24px + var(--sh-bottom) + var(--sh-bar) + var(--sh-safe-b)
        );
        transform: translate(-50%, 16px);
        opacity: 0;
        pointer-events: none;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 6px 0 18px;
        border-radius: 999px;
        background: var(--surface-3);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: var(--elev-3);
        transition:
          opacity var(--dur-2),
          transform var(--dur-2) var(--ease-out);
        max-width: calc(100vw - 24px);
        font-size: 14px;
        font-weight: 500;
      }
      .sh-toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .sh-toast span {
        padding-right: 12px;
      }
      .sh-toast button {
        border: 0;
        background: none;
        color: var(--accent);
        font-weight: 700;
        min-height: var(--sh-hit);
        padding: 0 12px;
        cursor: pointer;
        border-radius: 999px;
      }
      .sh-tabbar {
        display: none;
      }
      @keyframes shIn {
        from {
          transform: translateX(-24px);
          opacity: 0;
        }
      }
      @keyframes shChip {
        from {
          transform: translateX(100%);
        }
      }
      @keyframes shPop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }

      /* ---- phone (640 and under): rail becomes the bottom tab bar, columns become drawers, the sheet fills the screen ---- */
      @media (max-width: 640px) {
        :root {
          --sh-bottom: var(--sh-tabbar);
        }
        .sh-wrap {
          padding: 8px 8px calc(var(--sh-tabbar) + var(--sh-safe-b));
        }
        .sh-rail {
          display: none;
        }
        .sh-side:not([data-state='over']),
        .sh-panel:not([data-state='over']) {
          display: none;
        }
        .sh-tabbar {
          display: flex;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          height: calc(var(--sh-tabbar) + var(--sh-safe-b));
          padding: 0 4px var(--sh-safe-b);
          justify-content: space-around;
          align-items: center;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
        }
        .sh-tabbar .ib {
          flex: 1;
          width: auto;
          height: 48px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1px;
          font-size: 10px;
          font-weight: 600;
          border-radius: var(--r-sm);
        }
        .sh-tabbar .ib svg {
          width: 22px;
          height: 22px;
        }
        .sh-tabbar .ib .bd {
          position: absolute;
          top: 2px;
          left: calc(50% + 6px);
          min-width: 16px;
          height: 16px;
          padding: 0 4px;
          border-radius: 999px;
          background: var(--accent);
          color: var(--on-accent);
          font-size: 10px;
          font-weight: 700;
          display: grid;
          place-items: center;
        }
        .sh-fbar {
          bottom: 12px;
        }
        .sh-sheet {
          top: max(8px, env(safe-area-inset-top, 0px));
          bottom: 0;
          right: 0;
          left: 0;
          width: auto;
          border-radius: var(--r-xl) var(--r-xl) 0 0;
          transform: translateY(105%);
        }
        .sh-mdock {
          top: calc(8px + var(--sh-top) + 56px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Many sheet tabs: keep each tab its natural width and scroll the row instead of squeezing. */
      .sh-stabs .utabs button {
        flex: none;
      }

      /* ==== 12 Nov 2026 (U3): dialog close, universal minimise button, edge handle, customisable tabs ==== */
      /* every #sh-dialog has a visible close button */
      .sh-dialog > .sh-dx {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 3;
      }
      .sh-dialog > .sh-dx svg {
        width: 20px;
        height: 20px;
      }
      .sh-dialog h3 {
        padding-right: 40px;
      }
      /* the minimise button: the same in every bar, large, clearly visible; pulses gently until first used */
      .ib.minb,
      .ib.sm.minb {
        width: 44px;
        height: 44px;
        border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line));
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: var(--r-md);
        flex: none;
      }
      .ib.minb:hover,
      .ib.sm.minb:hover {
        background: color-mix(in srgb, var(--accent) 24%, transparent);
        color: var(--accent);
      }
      .ib.minb svg,
      .ib.sm.minb svg {
        width: 22px;
        height: 22px;
      }
      .ib.minb.pulse {
        animation: shPulse 1.6s ease-in-out 2;
      }
      @keyframes shPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
        50% {
          box-shadow: 0 0 0 7px
            color-mix(in srgb, var(--accent) 30%, transparent);
        }
      }
      /* edge handle: a minimised bar docked to the left or right edge; drag it anywhere, tap to restore */
      .sh-handle {
        position: fixed;
        z-index: 42;
        width: 36px;
        height: 56px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
        color: var(--accent);
        box-shadow: var(--elev-2);
        cursor: grab;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        transition:
          left 180ms var(--ease-out),
          top 180ms var(--ease-out);
      }
      .sh-handle[data-side='r'] {
        border-right: 0;
        border-radius: 14px 0 0 14px;
      }
      .sh-handle[data-side='l'] {
        border-left: 0;
        border-radius: 0 14px 14px 0;
      }
      .sh-handle svg {
        width: 20px;
        height: 20px;
        pointer-events: none;
      }
      .sh-handle.drag {
        cursor: grabbing;
        transition: none;
        box-shadow: var(--elev-3);
        border-radius: 14px;
        border-width: 1.5px;
      }
      .sh-handle:hover {
        background: color-mix(in srgb, var(--accent) 26%, var(--surface-2));
      }
      /* customisable tabs: scrolling tabs, "+" always visible at the end */
      .sh-coltabs.sh-tabs {
        display: block;
        padding: 0 4px 0 8px;
      }
      .sh-tabs .sh-trow {
        display: flex;
        align-items: stretch;
        gap: 2px;
      }
      .sh-tabs .sh-tscroll {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1;
        min-width: 0;
      }
      .sh-tabs .sh-tscroll::-webkit-scrollbar {
        display: none;
      }
      .sh-tabs .sh-tscroll button {
        flex: none;
        padding: 0 11px;
      }
      .sh-tabs .sh-tplus {
        flex: none;
        width: var(--sh-hit);
        padding: 0;
        color: var(--accent);
        border-bottom-color: transparent;
      }
      .sh-tabs .sh-tplus svg {
        display: block;
        width: 20px;
        height: 20px;
      }
      .sh-tabs .track {
        margin: 0 4px 0 0;
      }
      .sh-tedit {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: min(52vh, 360px);
        overflow: auto;
        margin: 4px -4px 0;
        padding: 2px 4px;
      }
      .sh-trw {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface-2);
        position: relative;
      }
      .sh-trw .gp {
        cursor: grab;
        touch-action: none;
        color: var(--muted);
      }
      .sh-trw .gp svg {
        width: 18px;
        height: 18px;
      }
      .sh-trw input {
        flex: 1;
        min-width: 0;
        min-height: 40px;
        border: 0;
        background: transparent;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
        padding: 0 6px;
        border-radius: var(--r-sm);
      }
      .sh-trw input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .sh-trw .ib[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }
      .sh-trw.drag {
        box-shadow: var(--elev-2);
        z-index: 2;
        border-color: var(--accent);
      }
      .sh-trw .rm {
        color: var(--danger);
      }
      .sh-tpop .mi small {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      /* ---- clear (x) button inside any text field (Shell.clearable / Shell.autoClear) ---- */
      .sh-clr {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
        align-items: center;
      }
      .sh-clr > input,
      .sh-clr > textarea {
        padding-right: 40px !important;
      }
      .sh-clr .sh-clrb {
        position: absolute;
        right: 2px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .sh-clr.ta .sh-clrb {
        top: 6px;
        transform: none;
      }
      .sh-clr > input:placeholder-shown ~ .sh-clrb,
      .sh-clr > textarea:placeholder-shown ~ .sh-clrb {
        display: none;
      }
      .sh-clr input[type='search']::-webkit-search-cancel-button {
        display: none;
      }
      /* ==== end shell.css (all) ==== */

      /* left: categories */
      .ttl {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 6px 4px 0;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin: 0 4px;
      }
      .search {
        position: relative;
      }
      .search svg {
        z-index: 1;
        position: absolute;
        left: 12px;
        top: 50%;
        margin-top: -9px;
        width: 18px;
        height: 18px;
        color: var(--muted);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        min-height: 44px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-1);
        color: var(--ink);
        font: inherit;
        padding: 0 40px 0 38px;
        outline: none;
        transition: border-color var(--dur-1);
      }
      .search input:focus {
        border-color: var(--accent);
      }
      .catlist {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        border-radius: var(--r-lg);
      }
      .cat {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 6px 10px;
        border: 0;
        background: transparent;
        border-radius: var(--r-md);
        cursor: pointer;
        text-align: left;
        transition:
          background var(--dur-1),
          color var(--dur-1);
        color: var(--ink-soft);
      }
      .cat:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .cat.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .cat svg {
        width: 22px;
        height: 22px;
      }
      .cat .tx {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .cat b {
        font-weight: 600;
        font-size: 15px;
        color: var(--ink);
      }
      .cat.on b {
        color: var(--accent);
      }
      .cat small {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat .n {
        font-size: 12px;
        color: var(--muted);
        min-width: 20px;
        text-align: right;
      }
      .more {
        font-size: 13px;
        color: var(--muted);
        margin: 0 6px;
      }
      .more button {
        border: 0;
        background: transparent;
        color: var(--accent);
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
        padding: 0 4px;
      }
      /* right: detail */
      .dhead {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dhead h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .dhint {
        margin: -8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .group {
        border-radius: var(--r-lg);
        background: var(--surface-0);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .gh {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 6px 6px -6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        min-height: 64px;
        border-top: 1px solid var(--line);
        transition: background var(--dur-3);
      }
      .row:first-child {
        border-top: 0;
      }
      .row.flash {
        background: var(--accent-soft);
      }
      .row .tx {
        flex: 1;
        min-width: 0;
      }
      .row .lb {
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row .ds {
        font-size: 13px;
        color: var(--muted);
        margin-top: 1px;
      }
      .row .ctl {
        flex: none;
        max-width: 56%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row .crumb {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 99px;
        padding: 1px 7px;
        line-height: 16px;
      }
      .tag.new {
        color: var(--on-accent);
        background: var(--accent);
      }
      select,
      input.num {
        min-height: 44px;
        border-radius: var(--r-md);
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        font: inherit;
        padding: 0 10px;
        max-width: 100%;
      }
      input.num {
        width: 84px;
        text-align: right;
      }
      .unit {
        font-size: 13px;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }
      .chip {
        min-height: 44px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink-soft);
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .chip.on {
        background: var(--accent-soft);
        border-color: transparent;
        color: var(--accent);
      }
      .info {
        font-size: 14px;
        color: var(--ink-soft);
      }
      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
      }
      /* ---- Professional features: one switch per Pro feature ---- */
      .pfbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pfbar .inp {
        flex: 1 1 200px;
        width: auto;
        min-width: 0;
      }
      .pfg {
        border-radius: var(--r-lg);
        background: var(--surface-0);
        border: 1px solid var(--line);
        overflow: hidden;
        margin-top: 10px;
      }
      .pfg > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;

        font-size: 14px;
      }
      .lvh {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
      }
      .lvb {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .faq {
        border-top: 1px solid var(--line);
        padding: 0 14px;
      }
      .faq:first-child {
        border-top: 0;
      }
      .faq summary {
        min-height: 52px;
        display: flex;
        align-items: center;
        font-weight: 600;
        cursor: pointer;
      }
      .faq p {
        margin: 0 0 10px;
        color: var(--ink-soft);
        font-size: 14px;
      }
      .faq .btn {
        margin-bottom: 12px;
      }
      .tcard .tf2 {
        flex-wrap: wrap;
      }
      .tcard .dots {
        flex-basis: 100%;
        margin-bottom: 6px;
        min-height: 6px;
      }
      .tcard .btn {
        padding: 0 12px;
      }
      .tcard .tf2 .btn.pri {
        margin-left: auto;
      }

      /* ==== settings v3: screen-specific styles (everything shared lives in shell.css) ==== */
      :root {
        --guide: #ff3bd4;
      }
      .sh-side .sub {
        margin: 0 4px 8px;
      }
      .sh-side .search {
        margin-bottom: 8px;
      }
      .catlist {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .detail {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 4px 6px 0;
      }
      .dhead {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      #cov {
        padding: 0 6px;
      }

      /* S5: the preview sits beside the settings and never covers them */
      .cols {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .colL {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .colR {
        min-width: 0;
      }
      @media (min-width: 1180px) {
        .cols {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 18px;
          align-items: start;
        }
        .colR {
          order: 2;
          position: sticky;
          top: 0;
        }
        .colR .prev {
          max-height: calc(100vh - 150px);
          overflow: auto;
        }
      }
      /* S2: highlight what just changed (glow + short note) */
      .glow {
        outline: 2px solid transparent;
        outline-offset: 2px;
        animation: glw 1.5s ease-out 2;
      }
      .row.glow {
        outline-offset: -3px;
      }
      @keyframes glw {
        0% {
          outline-color: transparent;
          box-shadow: 0 0 0 0 transparent;
        }
        25%,
        55% {
          outline-color: var(--accent);
          box-shadow:
            0 0 0 5px color-mix(in srgb, var(--accent) 24%, transparent),
            0 0 22px color-mix(in srgb, var(--accent) 38%, transparent);
          background-color: color-mix(in srgb, var(--accent) 10%, transparent);
        }
        100% {
          outline-color: transparent;
          box-shadow: 0 0 0 0 transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow {
          animation: none;
          outline-color: var(--accent);
        }
      }
      .chg {
        flex: 1 1 100%;
        order: 6;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        padding: 8px 12px;
        border-radius: var(--r-md);
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 13px;
      }
      .chg .cb {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .chg s {
        color: var(--muted);
      }
      .chg .cx {
        color: var(--ink-soft);
        flex: 1 1 220px;
      }
      /* S1: the General preview is a mini app */
      .ma {
        display: flex;
        gap: 8px;
        padding: 8px;
        min-height: 0;
        font-size: 11px;
      }
      .ma .ra {
        width: 28px;
        border-radius: 8px;
        background: var(--s);
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 5px;
        align-items: center;
        align-self: flex-start;
      }
      .ma .ra i {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--l);
        color: var(--m);
        font: 600 9px/18px var(--sans);
        text-align: center;
        font-style: normal;
      }
      .ma .ra i.cur {
        background: var(--a);
        color: var(--c);
      }
      .ma .mm {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ma .mt {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: space-between;
        color: var(--m);
      }
      .ma .cr {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .ma .ok2 {
        color: var(--m);
        white-space: nowrap;
      }
      .ma .up {
        background: var(--a);
        color: var(--c);
        border-radius: 99px;
        padding: 2px 8px;
        font-weight: 600;
      }
      .ma .mp {
        background: var(--s);
        border-radius: 8px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .ma .mtabs {
        display: flex;
        gap: 2px;
        overflow: hidden;
        border-bottom: 1px solid var(--l);
        margin-bottom: 2px;
      }
      .ma .mtabs i {
        font-style: normal;
        padding: 2px 7px;
        color: var(--m);
        white-space: nowrap;
      }
      .ma .mtabs i.on {
        color: var(--a);
        box-shadow: inset 0 -2px var(--a);
      }
      .ma h4 {
        margin: 0;
        font-size: 14px;
      }
      .ma .meta {
        margin: 0;
        color: var(--m);
      }
      .ma .pp {
        position: relative;
        height: auto;
        min-height: 88px;
        margin: 4px 0 0;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: #2a2733;
      }
      .ma .pp b {
        font-size: 11px;
      }
      .ma .pp span {
        font-size: 11px;
        opacity: 0.75;
      }
      .ma .mn {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: var(--surface-3);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px;
        display: flex;
        flex-direction: column;
        box-shadow: var(--elev-2);
      }
      .ma .mn i {
        font-style: normal;
        padding: 2px 8px;
        border-radius: 5px;
      }
      .ma .mn i.on {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ma .mb {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 18px 0 6px;
        min-height: calc(var(--bh, 30px) + 30px);
      }
      .ma .bar {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 99px;
        font-size: 11px;
        margin: 0;
        min-height: var(--bh, 30px);
      }
      .ma .bar i {
        font-style: normal;
        font-weight: 700;
        width: var(--bh, 30px);
        height: var(--bh, 30px);
        border-radius: 99px;
        display: grid;
        place-items: center;
        background: var(--l);
        transform: scale(0.8);
      }
      .ma .bar .tip {
        position: absolute;
        bottom: calc(100% + 6px);
        left: 6px;
        font-style: normal;
        background: var(--i);
        color: var(--c);
        padding: 2px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .ma .mf {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ma .mf span {
        background: var(--s);
        border-radius: 99px;
        padding: 3px 8px;
        color: var(--i);
      }
      .ma .mf small {
        color: var(--m);
        font-size: 10px;
      }
      .paper.p0 {
        background-image: none;
      }
      /* S7: a real frosted-glass demo */
      .glv {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .gls {
        position: relative;
        height: 104px;
        border-radius: var(--r-md);
        overflow: hidden;
        background: linear-gradient(135deg, #6d5ce8, #e0709a 55%, #f3b45c);
      }
      .gls i {
        position: absolute;
        border-radius: 50%;
      }
      .gls .b1 {
        width: 70px;
        height: 70px;
        left: 14%;
        top: -10px;
        background: #3fd0c4;
      }
      .gls .b2 {
        width: 54px;
        height: 54px;
        right: 12%;
        top: 30px;
        background: #2b3a8c;
      }
      .gls .b3 {
        width: 44px;
        height: 44px;
        left: 46%;
        top: 52px;
        background: #fff6;
      }
      .gls .ln {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 16px;
        height: 6px;
        border-radius: 3px;
        background: #ffffffb0;
      }
      .gls .ln.s {
        top: 30px;
        right: 50%;
      }
      .glb {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        padding: 9px 18px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        transition: background var(--dur-3);
      }
      .glb.gl {
        background: rgba(255, 255, 255, 0.22);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        border: 1px solid rgba(255, 255, 255, 0.35);
      }
      .glb.sd {
        background: #2b2a33;
        border: 1px solid #4a4955;
      }
      .glt {
        font-size: 13px;
        color: var(--ink-soft);
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }
      .glt b {
        color: var(--ink);
      }
      /* S3 / S8 */
      .row .btn.busy {
        opacity: 0.7;
        pointer-events: none;
      }
      .pvw,
      .pvw .pv,
      .ptv {
        min-width: 0;
        max-width: 100%;
      }
      .ptv #ptabs {
        overflow: hidden;
      }
      .ptv {
        display: flex;
        flex-direction: column;
      }
      .ptl {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 2px 4px;
      }
      .ptv #ptabs {
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface-1);
        padding: 0 4px;
      }

      .opt {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        min-height: 64px;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--surface-2);
        border-radius: var(--r-lg);
        padding: 10px 14px;
        margin-top: 10px;
        cursor: pointer;
      }
      .opt:hover,
      .opt:focus-visible {
        border-color: var(--accent);
        background: var(--accent-soft);
        outline: none;
      }
      .opt b {
        display: block;
      }
      .opt small {
        color: var(--muted);
        font-size: 13px;
      }
      .opt .em {
        font-size: 26px;
        width: 34px;
        text-align: center;
      }
      button.lv {

        text-align: left;
        width: 100%;
        margin-bottom: 10px;
        cursor: pointer;
        color: inherit;
        font: inherit;
      }

          max-width: 100%;

          justify-content: flex-start;
        }
        .row.inl .ctl {
          flex: none;
          flex-basis: auto;
        }
        .chips {
          justify-content: flex-start;
        }
      }

      .nic{width:24px;height:24px;border-radius:0;background:none;color:var(--ink-soft)}

      .gtn{position:static;font-size:13px;color:var(--accent);font-weight:600}
      /* one quiet button everywhere on the page; the accent is kept for state (on, current, changed) */
      .detail .btn,.sh-sbody .btn,.ccard .btn{border:0;background:var(--fill);color:var(--ink);min-height:36px;padding:0 14px;font-size:14px;font-weight:600;position:relative}
      .detail .btn::before,.sh-sbody .btn::before,.ccard .btn::before{content:'';position:absolute;inset:-4px 0}
      .detail .btn:hover,.sh-sbody .btn:hover,.ccard .btn:hover{background:var(--pressed)}
      .detail .btn.dng,.sh-sbody .btn.dng{color:var(--danger)}
      .detail select,.detail input.num,.detail .inp{border-color:transparent;background-color:var(--fill)}
      .sw{background:color-mix(in srgb,var(--ink) 24%,transparent)}
      .lnk{font-size:14px}
      /* search fields: filled, no outline */
      .search input{border-color:transparent;background:var(--fill)}
      .search input:focus{border-color:var(--accent);background:var(--surface-0)}
      /* side list: one height, no line, short value lines */

      .sh-top .btn.more{border:0;background:none;color:var(--ink-soft);flex:none;padding:0 10px;min-height:44px;font-size:14px}
      .sh-top .btn.more:hover{background:var(--hover);color:var(--ink)}
      .sh-top .btn.more svg{width:20px;height:20px}

      .pfgs>.pfg:first-child{background-image:none}

      .cmi svg{width:18px;height:18px;color:var(--accent);flex:none}

      .sh-dialog .tehd{margin:-8px -8px 4px}
      .sh-dialog .tehd h3{padding-right:0}
      .sh-dialog .tehd+.mini{font-size:14px;line-height:1.5}

      .tbeb{border:0;background:var(--fill)}
      .tbtray{border:0;background:var(--fill);padding:14px 16px 18px}
      .tbtray .th{text-transform:none;letter-spacing:0;font-size:13px;margin-bottom:14px}
      .tbe .tbtile{border:0;background:var(--surface-0);font-size:12px}
      .tbe .tbtile:hover{background:var(--surface-0);box-shadow:inset 0 0 0 1px var(--line-strong)}
      .tbpp{border:0}
      .bdg.rm{background:var(--muted)}
      .advhd{margin:12px 16px -6px}
      .tbv{border:0}

      .tbv .tbz.ph .tbpaper{min-height:150px;padding:14px 18px;border-radius:14px}

      .tbv .tbz.ph .tbpaper p{font-size:14px;line-height:26px}
      .tbv .tbz.ph .tbpaper.p1{background-image:repeating-linear-gradient(var(--paper) 0 25px,var(--paper-line) 25px 26px)}
      .tbv .tbz.ph .tbpaper.p2,.tbv .tbz.ph .tbpaper.p3{background-size:26px 26px}

      /* phone: the preview is a pill at the bottom; tap it to open the preview as a sheet above the tab bar */
      .pvpill {
        display: none;
      }
      @media (max-width: 640px) {
        .pvpill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          position: fixed;
          left: 50%;
          transform: translateX(-50%);
          bottom: calc(var(--sh-tabbar) + var(--sh-safe-b) + 12px);
          z-index: 35;
          min-height: 44px;
          padding: 0 18px;
          border-radius: 999px;
          border: 1px solid var(--line);

          position: fixed;
          left: 8px;
          right: 8px;
          bottom: calc(var(--sh-tabbar) + var(--sh-safe-b) + 68px);
          z-index: 34;
          max-height: 46vh;
          overflow: auto;
          background: var(--surface-1);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        #app.pvopen .pvpill {
          background: var(--surface-2, var(--surface-1));
          color: var(--ink);
        }
        @keyframes pvPulse {
          0% {
            box-shadow: 0 0 0 0 var(--accent);
          }
          100% {
            box-shadow: 0 0 0 14px transparent;
          }
        }
      }

      /* phone preview: pill + framed 390px copy of this page (own viewport, so phone layout applies) */
      .ppill {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 80;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface-1) 82%, transparent);
        color: var(--ink);
        -webkit-backdrop-filter: blur(18px) saturate(1.6);
        backdrop-filter: blur(18px) saturate(1.6);
        font: 600 13px var(--sans);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .ppill:hover {
        transform: translateX(-50%) translateY(-1px);
      }
      .ppill:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .ppill svg {
        width: 16px;
        height: 16px;
      }
      .ppv {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 16px 16px 72px;
        background: rgba(0, 0, 0, 0.55);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }
      .ppv.on {
        display: flex;
        animation: ppin 0.25s ease;
      }
      .ppv iframe {
        width: 390px;
        max-width: 100%;
        height: 100%;
        max-height: 844px;
        border: 8px solid #111;
        border-radius: 36px;
        background: var(--canvas);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      @keyframes ppin {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ppv.on {
          animation: none;
        }
        .ppill {
          transition: none;
        }
      }
      @media (max-width: 640px) {
        .ppill {
          display: none;
        }
      }
      .ppin .ppill,
      .ppin .ppv {
        display: none !important;
      }

function fold(id,label,inner,icon,sub){const o=!!S.folds[id];return `<div class="fold${o?' open':''}"><button class="fh" ${A('fold',id)} aria-expanded="${o}">${icon?I(icon,18):''}<span>${label}</span>${sub?`<small>${sub}</small>`:''}${I('chevD',16,'chev')}</button>${o?`<div class="fb">${inner}</div>`:''}</div>`}

/* ---------- favourites ---------- */
function favPic(tool,f){if(tool==='pen')return `<span style="display:grid;place-items:center;width:28px;height:24px;border-radius:7px;background:var(--glass)">${stroke(f.type,f.colour).replace('width="64"','width="22"').replace('height="16"','height="12"')}</span>`;

 return I('lasso',18)}

function baseItems(tool){const p=isPro();return {pen:['type','size','colour','feel'],shapes:['shape','size','colour'],eraser:p?['emode','esize','erases','eback']:['emode'],lasso:p?['lshape','lpicks','lopts']:['lshape','lact'],text:p?['box','format','style','bold','italic','list']:['box','format','bold','italic']}[tool]}
function orderOf(tool){const base=baseItems(tool),fv=S.favs[tool].map(f=>'fav-'+f.id);const valid=[...base,...fv];let o=(S.order[tool]||[]).filter(k=>valid.includes(k));valid.forEach(k=>{if(!o.includes(k))o.push(k)});return o}
const favOf=(tool,k)=>S.favs[tool].find(f=>'fav-'+f.id===k);

/* ---------- row 1 ---------- */
function chipBtn(k,inner,o){o=o||{};const open=!o.g&&o.dd&&S.card===o.dd;return `<button class="chip${o.dd?' dd':''}${open?' open':''}${o.on?' on':''}${o.cls?' '+o.cls:''}${!o.g&&S.glow===k?' glow':''}" data-k="${k}" ${o.dd?`${A('dd',o.dd)} aria-expanded="${open}" aria-haspopup="dialog"`:A(o.a,o.v)}${!o.dd&&o.on!==undefined?` aria-pressed="${!!o.on}"`:''}${o.aria?` aria-label="${esc(o.aria)}"`:''}${o.title||o.aria?` title="${esc(o.title||o.aria)}"`:''}>${inner}${o.dd?I('chevD',14,'chev'):''}</button>`}
const TICON={text:'aa',pen:'penTool',eraser:'eraser',shapes:'shapes',lasso:'lasso'};
function row1(tool,dev,g){const phone=dev==='phone';const lab=g?isPro():(isPro()&&!phone&&!S.r1c);const fold=phone?['shapes','insert','back']:[];
 let h=[['text','Text','aa'],['pen','Pen','penTool'],['eraser','Eraser','eraser'],['shapes','Shapes','shapes'],['lasso','Lasso','lasso']].filter(t=>!fold.includes(t[0])).map(([id,l,ic])=>`<button class="tbtn${tool===id?' on':''}" ${A('tool',id)} data-k="t-${id}" aria-pressed="${tool===id}" title="${l}" aria-label="${l}">${I(ic,20)}${lab?`<span>${l}</span>`:''}</button>`).join('');
 if(!fold.includes('insert')){const open=!g&&S.card==='insert';h+=`<button class="tbtn${open?' open':''}" ${A('dd','insert')} data-k="insert" aria-expanded="${open}" aria-haspopup="dialog" title="Insert" aria-label="Insert">${I('grid',20)}${lab?'<span>Insert</span>':''}${I('chevD',14,'chev')}</button>`}
 if(isPro()&&!fold.includes('back')){const lt=S.last;h+=`<button class="tbtn" ${A('back')} data-k="back" title="Back to ${TOOLN[lt]}" aria-label="Back to ${TOOLN[lt]}"><span class="bkic">${I(TICON[lt],20)}<span class="bkb">${I('undo',10,'',2.6)}</span></span>${lab?`<span>Back to ${TOOLN[lt]}</span>`:''}</button>`}
 h+=`<span class="vd"></span><button class="tbtn key" ${A('key','Backspace')} title="Backspace" aria-label="Backspace">${I('bksp',20)}</button><button class="tbtn key" ${A('key','New line')} title="New line. Hold or double-tap for Heading, Checklist, Divider." aria-label="New line">${I('newline',20)}</button><span class="fl"></span>`;
 const mo=!g&&S.card==='more';h+=`<button class="tbtn${mo?' open':''}" ${A('dd','more')} data-k="more" aria-expanded="${mo}" aria-haspopup="dialog" title="More" aria-label="More">${I('dots',20,'',2.4)}</button>`;

/* ---------- row 2 ---------- */
function item(tool,k,g){const o={g};const p=S.pen,sh=S.shapes,e=S.er,l=S.la,t=S.t;
 if(k.startsWith('fav-')){const f=favOf(tool,k);return chipBtn(k,favPic(tool,f)+`<span class="cl" data-prevname>${esc(f.name)}</span>`,{g,a:'fav',v:k,on:favOn(tool,f),cls:'fav'})}

 case 'pen.colour':return chipBtn(k,cdot(p.colour),{g,dd:'pen.colour',aria:'Colour'});

 case 'shapes.shape':{const s=SHAPES.find(x=>x[0]===sh.shape);return chipBtn(k,I(s[2],18)+`<span class="cl">${s[1]}</span>`,{g,dd:'shapes.shape',aria:'Shape: '+s[1]})}
 case 'shapes.size':return chipBtn(k,`<span style="width:16px;display:grid;place-items:center">${dotEl(sh.size,sh.colour)}</span>`,{g,dd:'shapes.size',aria:'Size'});
 case 'shapes.colour':return chipBtn(k,cdot(sh.colour),{g,dd:'shapes.colour',aria:'Colour'});
 case 'eraser.emode':{const m=EMODES.find(x=>x[0]===e.mode);return chipBtn(k,I(m[2],18)+`<span class="cl">${m[1]}</span>`,{g,dd:'eraser.mode',aria:'Mode: '+m[1]})}
 case 'eraser.esize':return chipBtn(k,`<span style="width:16px;display:grid;place-items:center">${dotEl(e.size,'auto')}</span><span class="cl">${ESIZES[e.size-1][1]}</span>`,{g,dd:'eraser.size',aria:'Size'});
 case 'eraser.erases':return `<div class="cgrp" data-k="erases" role="group" aria-label="What it erases"><span class="cgl">Erases</span>${[['hl','Highlighter','hl'],['text','Text','type'],['pen','Pen','penLine']].map(([kk,lb,ic])=>chipBtn('er-'+kk,I(ic,17)+`<span class="cl">${lb}</span>`,{g,a:'tog',v:'er.'+kk,on:e[kk]})).join('')}</div>`;
 case 'eraser.eback':return `<div class="cgrp" data-k="eback">${chipBtn('eback-b',I('history',17)+'<span class="cl opt">Back after one</span>',{g,a:'tog',v:'er.back',on:e.back,aria:'Go back to the previous tool after one erase'})}</div>`;
 case 'lasso.lshape':if(!isPro()){return chipBtn(k,I(l.shape==='free'?'lasso':'sqDash',18)+`<span class="cl">${l.shape==='free'?'Free':'Rectangle'}</span>`,{g,dd:'lasso.shape',aria:'Shape'})}
   return `<div class="cgrp" data-k="lshape" role="radiogroup" aria-label="Lasso shape">${[['free','Free-hand','lasso'],['rect','Rectangle','sqDash']].map(([v,lb,ic])=>chipBtn('ls-'+v,I(ic,17)+`<span class="cl">${lb}</span>`,{g,a:'set',v:'la.shape|'+v,on:l.shape===v})).join('')}</div>`;
 case 'lasso.lpicks':return `<div class="cgrp" data-k="lpicks" role="group" aria-label="What it picks"><span class="cgl">Picks</span>${[['ink','Ink','penLine'],['pictures','Pictures','image'],['text','Text','type']].map(([kk,lb,ic])=>chipBtn('lp-'+kk,I(ic,17)+`<span class="cl">${lb}</span>`,{g,a:'tog',v:'la.'+kk,on:l[kk]})).join('')}</div>`;
 case 'lasso.lopts':return chipBtn(k,I('sliders',18)+'<span class="cl">Options</span>',{g,dd:'lasso.opts'});
 case 'lasso.lact':return chipBtn(k,I('scissors',18)+'<span class="cl">Actions</span>',{g,dd:'lasso.actions'});
 case 'text.box':return chipBtn(k,boxPrev(S.box.look,'Aa').replace('width:46px;height:30px','width:24px;height:20px').replace('font-size:12px','font-size:9.5px')+'<span class="cl">Box</span>',{g,dd:'text.box'});
 case 'text.format':return chipBtn(k,I('palette',18)+'<span class="cl">Format</span>',{g,dd:'text.format'});
 case 'text.style':{const s=STYLES.find(x=>x[0]===t.style);return chipBtn(k,`<span class="cl keep"><small>Style:</small> ${s[1]}</span>`,{g,dd:'text.style',aria:'Style: '+s[1]})}

 case 'text.italic':return chipBtn(k,I('italic',18,'',2),{g,a:'tog',v:'t.i',on:t.i,aria:'Italic',cls:'sq'});
 case 'text.list':{const li=LISTS.find(x=>x[0]===t.list);return chipBtn(k,I(li?li[2]:'list',18)+`<span class="cl">${li?li[1]:'List'}</span>`,{g,dd:'text.list',on:!!li,aria:'List'})}

function row2(tool,g){let its=orderOf(tool);let favFold='';
 if(!g&&S.compact>1){const fv=its.filter(k=>k.startsWith('fav-'));if(fv.length){its=its.filter(k=>!k.startsWith('fav-'));favFold=chipBtn('favs',I('star',17)+`<span class="cl keep">${fv.length}</span>`,{g,dd:'favs',aria:'Favourites'})}}
 let rowMore='';if(!g){S.rowFold=[];if(S.compact>2){const nf=its.filter(k=>!k.startsWith('fav-'));const n=Math.min(nf.length-1,S.compact-2);S.rowFold=nf.slice(nf.length-n);its=its.filter(k=>!S.rowFold.includes(k));rowMore=chipBtn('rowmore',I('dots',17,'',2.4)+`<span class="cl keep">${n}</span>`,{g,dd:'rowmore',aria:n+' more options'})}}
 const pl=!g&&S.sheet&&S.sheet.k==='add',mn=!g&&S.sheet&&S.sheet.k==='org';
 return `<div class="r2${!g&&S.compact?' c1':''}${!g&&S.compact>1?' c2':''}"><div class="items">${its.map(k=>item(tool,k,g)).join('')}${rowMore}${favFold}</div><span class="vd"></span><button class="ibtn${pl?' open':''}" data-k="plus" ${A('add')} title="Save this setup as a favourite" aria-label="Save this setup as a favourite">${I('plus',20)}</button><button class="ibtn${mn?' open':''}" data-k="menu" ${A('org')} title="Organise this row" aria-label="Organise this row">${I('menu',20)}</button></div>`}

 if(o.phone)return `<div class="hdr"><span class="hb${o.sideOn?' on':''}" title="Side list">${I('sidebar',20)}</span>${u}<b class="fl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title)}</b><span class="hb" title="Search">${I('search',20)}</span><span class="hb" title="Page options">${I('dots',20,'',2.4)}</span></div>`;

function setO(o){S.lvl=o.pro===false?'beg':'pro';S.tool=o.tool||'pen';S.dev=o.dev||'land';S.r1c=!!o.noNames;S.last=o.last||'text';S.card=null;S.sheet=null;S.compact=o.compact||0;S.glow=null}
function inner(o){setO(o);return '<div class="'+S.dev+(o.mode?' m-'+o.mode:'')+'">'+bar(S.tool,S.dev,false).replace(' id="tb"','')+'</div>'}
function barHTML(o){o=o||{};return '<div class="v9k" data-v9bar=\''+JSON.stringify(o)+'\'>'+inner(o)+'</div>'}

 for(let k=0;k<14;k++){const r1=el.querySelector('.r1'),it=el.querySelector('.items');if(!r1||!r1.clientWidth)break;const o1=r1.scrollWidth>r1.clientWidth+1,o2=it&&it.scrollWidth>it.clientWidth+1;
  if(o1&&!o.noNames)o.noNames=true;else if(o2&&(o.compact||0)<10)o.compact=(o.compact||0)+1;else break;el.innerHTML=inner(o)}
 el.setAttribute('data-v9bar',JSON.stringify(o))})}
const body=n=>{const b=P[n]||P.dots;return b[0]==='<'?b:pa(b)};
return {I,P,body,penPic,stroke,bar:barHTML,fit,
 top:o=>{o=o||{};return '<div class="v9k"><div class="'+(o.phone?'phone':'land')+'">'+topHTML(o)+'</div></div>'},

})();

          drawBars,
          isMin: (k) => !!st.min[k],
          track,
          tabs,
          handle,
          pulse,
          minUsed,
          setMin: (k, v) => {
            st.min[k] = !!v
            save()
            drawBars()
          },
          cornerHTML,
          theme: themeName,
          setTheme,
          mode: () => st.mode,
          setMode,
          icons: (v) => {
            if (v) {
              st.icons = v === 'B' ? 'B' : 'A'
              save()
              renderRail()
            }
            return st.icons
          },
        }

            on = S.tb.includes(k)
          batch((on ? 'Removed from the tool bar: ' : 'Added to the tool bar: ') + TBT[k][0], () => {
            S.tb = on ? S.tb.filter((x) => x !== k) : S.tb.slice(0, -3).concat(k, TBFIX)
          })
        } else if (act === 'tbreset') {
          batch('Tool bar reset on this device', () => {
            S.tb = TBDEF.slice()
          })
        }
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDot()
      })
      SC().addEventListener('scroll', closeDot, { passive: true })
      $('#q2').addEventListener('input', (e) => {
        S.q = e.target.value.trim()
        $('#q').value = e.target.value
        render()
      })
      // drag on the tool bar: hold to start, drag to move, drop on More tools to remove
      let TD = null
      document.addEventListener('pointerdown', (e) => {
        const t = e.target.closest && e.target.closest('#tbe [data-tool]')
        if (!t || e.target.closest('.bdg.rm')) return
        if (!S.tbEdit) {
          TD = { hold: setTimeout(() => { TD = null; tbStart() }, 500) }
          return
        }
        if (TBFIX.includes(t.dataset.tool)) return
        TD = { id: t.dataset.tool, x: e.clientX, y: e.clientY, moved: false }
      })
      document.addEventListener('pointermove', (e) => {
        if (!TD || !TD.id || !S.tbEdit) return
        if (!TD.moved && Math.hypot(e.clientX - TD.x, e.clientY - TD.y) < 8) return
        TD.moved = true
        const el = document.elementFromPoint(e.clientX, e.clientY)
        if (!el) return
        const a = S.tbEdit.slice(),
          i = a.indexOf(TD.id)
        const over = el.closest('#tber [data-tool]')
        if (over && over.dataset.tool !== TD.id && !TBFIX.includes(over.dataset.tool)) {
          const j = a.indexOf(over.dataset.tool)
          if (i >= 0) a.splice(i, 1)
          a.splice(j, 0, TD.id)
        } else if (el.closest('#tbtray') && i >= 0 && !TBT[TD.id][2]) a.splice(i, 1)
        else if (el.closest('#tber') && i < 0) a.splice(a.indexOf('bksp'), 0, TD.id)
        if (J(a) !== J(S.tbEdit)) {
          S.tbEdit = a
          tbRedraw(TD.id)
        } else {
          const d = $('#tbe [data-tool="' + TD.id + '"]')
          d && d.classList.add('drag')
        }
      })
      const tdEnd = () => {
        if (TD && TD.hold) clearTimeout(TD.hold)
        if (TD && TD.moved) tbRedraw()
        TD = null
      }
      document.addEventListener('pointerup', tdEnd)
      document.addEventListener('pointercancel', tdEnd)
      // hooks for screenshots
      window.__v5 = {
        dev: (id) => {
          const b = document.querySelector('button.devn[data-id="' + id + '"]')
          b && b.click()
        },
        pick: (k) => pickStarter(k),
        go: (c, sub) => {
          openCat(c)
          if (sub) {
            S.sub = sub
            render()
          }
        },
        search: (q) => {
          S.q = q
          $('#q').value = q
          $('#q2').value = q
          render()
        },
        starter: (k) => {
          applyStarter(k)
          render()
        },
        set: (o) => {
          Object.assign(S.vals, o)
          render()
        },
        feat: (ids) => {
          ids.forEach((id) => (PF.u[id] = 1))
          render()
        },
        tb: (list) => {
          S.q = ''
          S.cat = 'tbedit'
          S.tbEdit = list || S.tb.slice()
          render()
        },
        dot: (id) => {
          const b = document.querySelector('.cdot[data-id="' + id + '"]')
          b && b.click()
        },
        theme: (n) => {
          S.vals['general.theme'] = n
          S.base['general.theme'] = n
          render()
        },
      }
      if (!saved || !saved.v5) S.base['general.theme'] = S.vals['general.theme']
      new MutationObserver(() => S.cat === 'home' && !S.q && render()).observe($('#sh-side'), { attributes: true, attributeFilter: ['data-state'] })
      // ---- start
      render()
      if (!S.picked) openPicker()
    </script>
  </body>
</html>
