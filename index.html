<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Notes, summaries and recall cards in one place."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Learning Notes</title>
    <script>
      // Apply the saved theme before the first paint, so there is no flash
      // of the wrong theme. Must match src/app/theme.ts and uiPrefs.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('learning-notes:theme'))
        if (theme === 'night' || theme === 'sepia') {
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {
        // Storage blocked: Day theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
