<style>

:root {

  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161618; --side: #1e1e21; --ink: #ececee; --muted: #9a9aa0; --line: #2c2c30;
  --accent: #5e9bff; --hover: rgba(255,255,255,.055); --soft: #22252c; --danger: #ff7b6b;
  --chip: #2a2a2e; --mark: rgba(94,155,255,.24); --shadow: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161618; --side: #1e1e21; --ink: #ececee; --muted: #9a9aa0; --line: #2c2c30;
  --accent: #5e9bff; --hover: rgba(255,255,255,.055); --soft: #22252c; --danger: #ff7b6b;
  --chip: #2a2a2e; --mark: rgba(94,155,255,.24); --shadow: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark }
/* The mockup's own theme switch (app themes) wins over the viewer theme. */
body.t-day { --bg: #fff; --side: #f7f7f5; --ink: #1d1d1f; --muted: #6e6e73; --line: #ececec; --accent: #2f6feb; --hover: rgba(0,0,0,.045); --soft: #f4f6fb; --danger: #c8402f; --chip: #efefed; --mark: rgba(47,111,235,.16); --shadow: 0 12px 40px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.06); color-scheme: light }
body.t-night { --bg: #161618; --side: #1e1e21; --ink: #ececee; --muted: #9a9aa0; --line: #2c2c30; --accent: #5e9bff; --hover: rgba(255,255,255,.055); --soft: #22252c; --danger: #ff7b6b; --chip: #2a2a2e; --mark: rgba(94,155,255,.24); --shadow: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Mockup bar (not part of the app) */
.mockbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--soft); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }

.app { flex: 1; display: flex; min-height: 0; position: relative; }

.pill.wrong { color: var(--danger); background: color-mix(in srgb, var(--danger) 13%, var(--bg)); }
.blank { background: var(--mark); border-radius: 3px; padding: 0 2px; }
.try { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; margin: 18px 0; line-height: 1.7; min-height: 46px; outline: none; }
.try:focus { border-color: var(--accent); }
.try:empty::before { content: attr(data-ph); color: var(--muted); }

.backlinks { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 16px; }
.backlinks h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
.backlinks h3 span { color: var(--muted); font-weight: 400; }
.bl { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; }
.bl:hover { background: var(--hover); }
.bl .t { font-weight: 600; font-size: 13.5px; }

.bl .s { color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.5; }
.bl .s em { font-style: normal; color: var(--ink); background: var(--mark); border-radius: 3px; padding: 0 2px; }

/* Search popup */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 40; display: flex; justify-content: center; align-items: flex-start; padding: 10vh 16px 16px; }
.pop { width: 100%; max-width: 620px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 72vh; overflow: hidden; }
.sbox { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.sbox .ic { color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.chipf { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.chipf .c { font-variant-numeric: tabular-nums; opacity: .8; margin-left: 4px; }

.pres { overflow-y: auto; padding: 6px; }
.grp { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }

.res .ico { width: 18px; flex: none; color: var(--muted); text-align: center; }
.res .body { min-width: 0; flex: 1; }
.res .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .wh { font-size: 12px; color: var(--muted); }
.res .sn { font-size: 13px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
.res mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.res.sel, .res:hover { background: var(--hover); }
.res.sel { box-shadow: inset 2px 0 0 var(--accent); }
.popfoot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.popfoot button { color: var(--accent); font-weight: 600; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.nores { padding: 28px 18px; text-align: center; color: var(--muted); line-height: 1.6; }
.nores b { color: var(--ink); }
.nores button { color: var(--accent); }

/* Search screen */
.sscreen { max-width: 920px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sscreen .sbox { border: 1px solid var(--line); border-radius: 10px; }
.sscreen .chips { border: 0; padding: 10px 0 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin: 14px 0 6px; }
.facets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.facet { position: relative; }
.fbtn { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }

.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 220px; max-width: min(320px, 86vw); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; }

.views { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12.5px; }

.morepanel { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }

.sumline { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin: 14px 0 4px; }
.btn { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }

.list .res { border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 6px; }

.picker { position: fixed; z-index: 50; width: 300px; max-width: calc(100vw - 24px); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; }

@media (prefers-reduced-motion: reduce) { aside { transition: none; } }

    blocks: [{ p: ['Revised ', { link: 'heart' }, ' today; the S2 card keeps tripping me up.'] }] },

    blocks: [{ h: 'Detailed notes' }, { h: 'Keyword summary' }, { h: 'Flashcards' }] },

const STATUS = { new: 'New', due: 'Due', wrong: 'Got wrong', learned: 'In 12 days', suspended: 'Suspended' }

// ---------- state ----------
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } }
const S = {
  theme: null, emptyTags: false, view: 'page', pageId: 'heart', showAllTags: false, drawer: false,
  pop: null, // { q, chip, sel }
  q: '', chip: 'all', f: { nb: null, tag: null, status: null, changed: 'any', journal: true, templates: true, trash: false, sort: 'best' },
  more: false, open: null, layout: store.get('ln-view') || 'list', saved: [], openTag: null, tryHTML: '', savingName: null,
}

// ---------- helpers ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const fold = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase()
const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null
function words(s) {
  const f = fold(s)
  if (seg) return [...seg.segment(f)].filter((x) => x.isWordLike).map((x) => x.segment)
  return f.split(/[^\p{L}\p{N}]+/u).filter(Boolean)
}
const tag = (id) => tags.find((t) => t.id === id)
const kids = (id) => tags.filter((t) => t.parent === id).sort((a, b) => a.name.localeCompare(b.name))
function path(id) { const out = []; let t = tag(id); while (t) { out.unshift(t); t = tag(t.parent) } return out }
const pathName = (id) => path(id).map((t) => t.name).join('/')
function under(id, root) { let t = tag(id); while (t) { if (t.id === root) return true; t = tag(t.parent) } return false }
function chip(id, extra = '') {
  const p = path(id); if (!p.length) return ''
  const c = tagColor[id]
  const parents = p.slice(0, -1).map((t) => t.name).join('/')
  return `<button class="tag" data-act="openTag" data-id="${id}" ${c ? `data-c style="--c:${c}"` : ''} title="#${esc(pathName(id))}" ${extra}>${c ? '<span class="dot"></span>' : ''}#${parents ? `<span class="par">${esc(parents)}/</span>` : ''}${esc(p[p.length - 1].name)}</button>`
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600)
}
function inline(seg) {
  if (typeof seg === 'string') return esc(seg)
  if (seg.b) return `<span class="blank">${esc(seg.b)}</span>`
  if (seg.tag) return S.emptyTags ? '' : chip(seg.tag)
  if (seg.link) return `<a class="ilink" data-act="go" data-id="${seg.link}" data-anc="${esc(seg.anc || '')}">${esc(PAGES[seg.link].title)}${seg.anc ? `<span class="anc"> › ${esc(seg.anc)}</span>` : ''}</a>`
  return ''
}
const plain = (segs) => segs.map((s) => typeof s === 'string' ? s : s.b || (s.tag ? '' : s.link ? PAGES[s.link].title : '')).join('')

// ---------- search index (fake: built from PAGES) ----------
function items() {
  const out = []
  for (const [pid, p] of Object.entries(PAGES)) {
    const where = `${p.nb} · ${p.title}`
    out.push({ id: pid + ':t', type: 'page', pid, title: p.title, text: '', nb: p.nb, where: p.nb, tags: S.emptyTags ? [] : p.tags, kind: p.kind, trash: !!p.trash, updated: p.updated })
    p.blocks.forEach((b, i) => {
      if (b.p) out.push({ id: `${pid}:${i}`, type: 'note', pid, title: p.title, text: plain(b.p), nb: p.nb, where, tags: S.emptyTags ? [] : [...p.tags, ...b.p.filter((s) => s.tag).map((s) => s.tag)], kind: p.kind, trash: !!p.trash, updated: p.updated, blank: b.p.some((s) => s.b) })
      if (b.card) out.push({ id: `${pid}:${i}`, type: 'card', pid, title: b.card.q, text: b.card.a, nb: p.nb, where, tags: S.emptyTags ? [] : [...p.tags, ...b.card.tags], kind: p.kind, trash: !!p.trash, st: b.card.st, updated: p.updated, fails: b.card.st === 'wrong' ? 4 : b.card.st === 'due' ? 1 : 0 })
    })
  }
  // One card per blank (filter first: pushing while looping over `out` never ends).
  for (const it of out.filter((x) => x.blank)) out.push({ ...it, blank: false, id: it.id + ':b', type: 'card', title: it.text.replace('mitral', '…'), st: 'new', fails: 0 })
  return out
}
function score(it, qw) {
  if (!qw.length) return 1
  const tw = words(it.title), xw = words(it.text), gw = it.tags.flatMap((t) => words(pathName(t)))
  let s = 0
  for (const q of qw) {
    const hit = (ws) => ws.some((w) => w.startsWith(q))
    if (hit(tw)) s += it.type === 'page' ? 3 : 2
    else if (hit(xw)) s += 1
    else if (hit(gw)) s += 0.5
    else return 0
  }
  return s
}
const TYPES = { page: 'Pages', note: 'Notes', card: 'Cards' }
function run(q, chipv, f, skip) {
  const qw = words(q)
  return items().map((it) => ({ it, s: score(it, qw) })).filter(({ it, s }) => {
    if (!s) return false
    if (it.trash && !(f && f.trash)) return false
    if (!f) return chipv === 'all' || it.type === chipv
    if (skip !== 'chip' && chipv !== 'all' && it.type !== chipv) return false
    if (skip !== 'nb' && f.nb && it.nb !== f.nb) return false
    if (skip !== 'tag' && f.tag && !it.tags.some((t) => under(t, f.tag))) return false
    if (skip !== 'status' && f.status && it.st !== f.status) return false
    if (!f.journal && it.kind === 'journal') return false
    if (!f.templates && it.kind === 'template') return false
    if (f.changed === 'week' && it.updated > 7) return false
    if (f.changed === 'month' && it.updated > 31) return false
    return true
  }).sort((a, b) => f && f.sort === 'failed' ? (b.it.fails || 0) - (a.it.fails || 0) : f && f.sort === 'recent' ? a.it.updated - b.it.updated : b.s - a.s)
}
function hl(text, q) {
  const qw = words(q); if (!qw.length) return esc(text)
  // highlight word starts that match (accent-insensitive)
  let out = '', i = 0
  const parts = seg ? [...seg.segment(text)] : text.split(/(\s+)/).map((s) => ({ segment: s, isWordLike: /\S/.test(s) }))
  for (const p of parts) {
    const f = fold(p.segment); const m = p.isWordLike && qw.find((q) => f.startsWith(q))
    out += m ? `<mark>${esc(p.segment.slice(0, m.length))}</mark>${esc(p.segment.slice(m.length))}` : esc(p.segment)
    i++
  }
  return out
}
function snippet(text, q, n = 110) {
  const qw = words(q); const f = fold(text)
  let at = 0; for (const w of qw) { const k = f.indexOf(w); if (k >= 0) { at = k; break } }
  const start = Math.max(0, at - 40); let s = text.slice(start, start + n)
  return (start > 0 ? '…' : '') + hl(s, q) + (start + n < text.length ? '…' : '')
}
const ICON = { page: '▤', note: '¶', card: '◫' }
function resRow(r, q, sel, compact) {
  const it = r.it
  const st = it.type === 'card' ? `<span class="pill ${it.st === 'due' ? 'due' : it.st === 'wrong' ? 'wrong' : ''}">${STATUS[it.st]}</span>` : ''
  const extra = `${it.trash ? ' · <span style="color:var(--danger)">In Trash</span>' : ''}${it.kind === 'journal' ? ' · Journal' : ''}${it.kind === 'template' ? ' · Template' : ''}`
  if (compact) return `<button class="res${sel ? ' sel' : ''}" data-act="openRes" data-pid="${it.pid}"><span class="ico">${ICON[it.type]}</span><span class="tt">${hl(it.type === 'note' ? it.text : it.title, q)}</span>${st}<span class="wh">${esc(it.where)}</span></button>`
  return `<button class="res${sel ? ' sel' : ''}" data-act="openRes" data-pid="${it.pid}"><span class="ico">${ICON[it.type]}</span><span class="body">
    <div class="tt">${it.type === 'note' ? `<span class="wh" style="font-size:13px">${esc(it.title)}</span>` : hl(it.title, q)} ${st}</div>
    ${it.type === 'note' ? `<div class="sn">${snippet(it.text, q)}</div>` : it.type === 'card' ? `<div class="sn">${hl(it.text, q)}</div>` : ''}
    <div class="wh">${esc(it.where)}${extra}${it.tags.length && !S.emptyTags ? ' · ' + it.tags.slice(0, 2).map((t) => '#' + esc(tag(t)?.name || '')).join(' ') : ''}</div></span></button>`
}

// ---------- sidebar ----------
function tagTree(parent, depth) {
  return kids(parent).map((t) => {
    const k = kids(t.id); const open = S.openTags.has(t.id)
    const n = items().filter((it) => !it.trash && it.type !== 'note' && it.tags.some((x) => under(x, t.id))).length
    return `<div class="trow" style="padding-left:${depth * 14}px">
      <button class="tw" data-act="twist" data-id="${t.id}" aria-label="${open ? 'Collapse' : 'Expand'} ${esc(t.name)}" ${k.length ? '' : 'disabled style="visibility:hidden"'}>${open ? '▾' : '▸'}</button>
      <button class="tl" data-act="openTag" data-id="${t.id}"><span class="dot" style="--c:${tagColor[t.id] || 'transparent'}"></span>#${esc(t.name)}</button>
      <span class="n" style="font-size:11.5px;color:var(--muted);padding-right:2px">${n}</span>
      <button class="more" data-act="tagMenu" data-id="${t.id}" aria-label="Tag options for ${esc(t.name)}">⋯</button>
    </div>${open ? tagTree(t.id, depth + 1) : ''}`
  }).join('')
}

  }).join('')

    <div class="sect">Notebooks</div>${nbs}`
}
S.openTags = new Set(['med', 'cardio', 'hs', 'mur'])

// ---------- page ----------
function renderPage() {
  const p = PAGES[S.pageId]
  const ptags = S.emptyTags ? [] : p.tags.filter(tag)
  const MAX = 5
  const shown = S.showAllTags ? ptags : ptags.slice(0, MAX)
  const blocks = p.blocks.map((b, i) => {
    if (b.h) return `<h2 id="h-${esc(b.h)}">${esc(b.h)}</h2>`
    if (b.p) return `<p>${b.p.map(inline).join('')}</p>`
    if (b.card) return `<div class="card"><div class="lbl"><span>Card</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${S.emptyTags ? '' : b.card.tags.map((t) => chip(t)).join('')}<span class="pill ${b.card.st === 'due' ? 'due' : b.card.st === 'wrong' ? 'wrong' : ''}">${STATUS[b.card.st]}</span></span></div><div class="q">${esc(b.card.q)}</div><div class="a">${esc(b.card.a)}</div></div>`
    return ''
  }).join('')
  const back = []
  for (const [id, q] of Object.entries(PAGES)) {
    if (q.trash) continue
    q.blocks.forEach((b) => { if (b.p && b.p.some((s) => s.link === S.pageId)) back.push({ id, q, b }) })
  }
  const blHTML = back.map(({ id, q, b }) => {
    const l = b.p.find((s) => s.link === S.pageId)
    const sentence = b.p.map((s) => s === l ? `<em>${esc(p.title)}${l.anc ? ' › ' + esc(l.anc) : ''}</em>` : typeof s === 'string' ? esc(s) : s.link ? esc(PAGES[s.link].title) : s.b ? esc(s.b) : '').join('')
    return `<button class="bl" data-act="go" data-id="${id}"><div class="t">${esc(q.title)} <small>· ${esc(q.nb)}</small></div><div class="s">${sentence}</div></button>`
  }).join('')

    <button class="menubtn" data-act="drawer">☰ Menu</button>

        <button class="addtag" data-act="addTag">+ Add tag</button></div>

      </div>

        <h3>Linked from <span>${back.length}</span></h3>
        ${back.length ? blHTML : `<div class="empty-note" style="margin:0">No pages link here yet. Type <kbd>[[</kbd> in any page and pick <b style="color:var(--ink)">${esc(p.title)}</b>.</div>`}
      </section>
    </div>`
  const tr = document.getElementById('try')
  tr.addEventListener('input', onTryInput)
  tr.addEventListener('blur', () => { S.tryHTML = tr.innerHTML })
}

// ---------- search screen ----------
function facetCounts(key, values) {
  return values.map((v) => ({ v, n: run(S.q, S.chip, { ...S.f, [key]: v }, null).length })).filter((x) => x.n > 0)
}
function renderSearch() {
  const res = run(S.q, S.chip, S.f)
  const active = S.q.trim() || S.f.tag || S.f.nb || S.f.status
  const anyType = run(S.q, 'all', S.f, 'chip')
  const chipCounts = Object.fromEntries(['all', 'page', 'note', 'card'].map((c) => [c, anyType.filter((r) => c === 'all' || r.it.type === c).length]))
  const hasCards = res.some((r) => r.it.type === 'card') || S.chip === 'card'
  // facets

  const tagMenu = crumbs + (tagF.length ? tagF.map((x) => `<button class="mi" data-act="setF" data-k="tag" data-v="${x.t.id}"><span>#${esc(x.t.name)}${kids(x.t.id).length ? ' ›' : ''}</span><span class="n">${x.n}</span></button>`).join('') : `<div class="mh">${S.emptyTags ? 'No tags yet' : 'No narrower tags'}</div>`)
  const stMenu = stF.map((x) => `<button class="mi" data-act="setF" data-k="status" data-v="${x.v}"><span>${STATUS[x.v]}</span><span class="n">${x.n}</span></button>`).join('')
  const tagLabel = S.f.tag ? '#' + esc(pathName(S.f.tag)) : 'Tag'

      ${fb('nb', S.f.nb ? esc(S.f.nb) : 'Notebook', !!S.f.nb, nbMenu)}

        <label><input type="checkbox" id="inc-t" data-act="toggleF" data-k="templates" ${S.f.templates ? 'checked' : ''}> Templates</label>

      <div><h4>Sort</h4>${[['best', 'Best match'], ['recent', 'Recently changed'], ['failed', 'Most failed cards']].map(([v, l]) => `<label><input type="radio" name="srt" id="srt-${v}" data-act="setSort" data-v="${v}" ${S.f.sort === v ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    </div>` : ''
  let body
  if (!active) body = `<div class="nores">Search page titles, notes, cards and blanks, journal days, templates and tags.<br>Start typing, or pick a tag in the sidebar.</div>`
  else if (!res.length) body = `<div class="nores"><b>No results for “${esc(S.q || tagLabel)}”.</b><br>Try fewer words or remove a filter${trashN ? `, or <button data-act="incTrash">show ${trashN} match${trashN > 1 ? 'es' : ''} in Trash</button>` : ''}.</div>`
  else if (S.layout === 'grouped') {
    const g = {}; res.forEach((r) => { (g[r.it.where.split(' · ')[0] + ' · ' + r.it.title] ||= []).push(r) })
    const byPage = {}; res.forEach((r) => { const k = r.it.nb + ' › ' + PAGES[r.it.pid].title; (byPage[k] ||= []).push(r) })
    body = Object.entries(byPage).map(([k, rs]) => `<div class="gh">${esc(k)} <span>${rs.length}</span></div><div class="list compact">${rs.map((r) => resRow(r, S.q, false, true)).join('')}</div>`).join('')
  } else body = `<div class="list${S.layout === 'compact' ? ' compact' : ''}">${res.map((r) => resRow(r, S.q, false, S.layout === 'compact')).join('')}</div>`
  const cards = res.filter((r) => r.it.type === 'card').length
  document.getElementById('main').innerHTML = `
    <button class="menubtn" data-act="drawer">☰ Menu</button>
    <div class="sscreen">
      <div class="stitle">Search${S.f.tag && !S.q ? ` <span style="font-weight:400;color:var(--muted);font-size:15px">· everything tagged</span> ${chip(S.f.tag)}` : ''}</div>
      <div class="sbox"><span class="ic">🔍</span><input id="sq" type="search" aria-label="Search everything" placeholder="Search everything" value="${esc(S.q)}" autocomplete="off"></div>
      <div class="chips" role="group" aria-label="Show">${['all', 'page', 'note', 'card'].map((c) => `<button class="chipf" data-act="chip" data-v="${c}" aria-pressed="${S.chip === c}">${c === 'all' ? 'All' : TYPES[c]}${active ? `<span class="c">${chipCounts[c]}</span>` : ''}</button>`).join('')}</div>
      <div class="toolbar"><div class="facets">${facets}</div>
        <div class="views" role="group" aria-label="View">${[['list', 'List'], ['compact', 'Compact'], ['grouped', 'Grouped']].map(([v, l]) => `<button data-act="layout" data-v="${v}" aria-pressed="${S.layout === v}">${l}</button>`).join('')}</div></div>

// ---------- popup ----------

// ---------- pickers (tags, links) ----------

// ---------- render + events ----------

    case 'openPop': S.pop = { q: '', chip: 'all', sel: -1 }; S.drawer = false; render(); renderPop(); break
    case 'closePop': S.pop = null; renderPop(); break
    case 'popChip': S.pop.chip = a.dataset.v; S.pop.sel = -1; renderPop(); break

    case 'saveOk': doSave(); break
    case 'openSaved': { const s = S.saved[+a.dataset.i]; S.q = s.q; S.chip = s.chip; S.f = { ...s.f }; S.view = 'search'; S.drawer = false; render(); break }
    case 'reviewThese': toast('Review would start with these cards (saved searches work as decks)'); break
    case 'closeDlg': closeDlg(); break
  }
})
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.pop = { q: '', chip: 'all', sel: -1 }; renderPop() }
  else if (e.key === 'Escape') { if (document.querySelector('.dlg')) closeDlg(); closeMenus(); if (S.open) { S.open = null; render() } }
})
applyTheme(); render()
</script>

</html>
