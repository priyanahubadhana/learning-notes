<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Notes Phase 5 Mockup</title>
<style>
/* Phase 5 mockup: notebook tabs, Study tracker (Dashboard · Table · Board; column menus sort and filter), All databases, All cards, "/database" in a note.
   Colours = the app's own Day / Night / Sepia tokens (src/index.css). Fake data; nothing is saved. */
:root {
  --bg: #fff; --side: #f7f7f5; --ink: #1d1d1f; --muted: #6e6e73; --line: #ececec;
  --accent: #2f6feb; --hover: rgba(0,0,0,.045); --soft: #f4f6fb; --danger: #c8402f;
  --chip: #efefed; --mark: rgba(47,111,235,.16); --shadow: 0 12px 40px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.06);
  --s0: #a3a3a8; --s1: #d9922e; --s2: #2f6feb; --s3: #3f9d6a; --heat: 47,111,235;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161618; --side: #1e1e21; --ink: #ececee; --muted: #9a9aa0; --line: #2c2c30;
  --accent: #5e9bff; --hover: rgba(255,255,255,.055); --soft: #22252c; --danger: #ff7b6b;
  --chip: #2a2a2e; --mark: rgba(94,155,255,.24); --shadow: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161618; --side: #1e1e21; --ink: #ececee; --muted: #9a9aa0; --line: #2c2c30;
  --accent: #5e9bff; --hover: rgba(255,255,255,.055); --soft: #22252c; --danger: #ff7b6b;
  --chip: #2a2a2e; --mark: rgba(94,155,255,.24); --shadow: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark }
body.t-day { --bg: #fff; --side: #f7f7f5; --ink: #1d1d1f; --muted: #6e6e73; --line: #ececec; --accent: #2f6feb; --hover: rgba(0,0,0,.045); --soft: #f4f6fb; --danger: #c8402f; --chip: #efefed; --mark: rgba(47,111,235,.16); --s0: #a3a3a8; --s1: #d9922e; --s2: #2f6feb; --s3: #3f9d6a; --heat: 47,111,235; color-scheme: light }
body.t-night { --bg: #161618; --side: #1e1e21; --ink: #ececee; --muted: #9a9aa0; --line: #2c2c30; --accent: #5e9bff; --hover: rgba(255,255,255,.055); --soft: #22252c; --danger: #ff7b6b; --chip: #2a2a2e; --mark: rgba(94,155,255,.24); --shadow: 0 12px 40px rgba(0,0,0,.5); --s0: #6e6e75; --s1: #e8a54a; --s2: #5e9bff; --s3: #58b884; --heat: 94,155,255; color-scheme: dark }
body.t-sepia { --bg: #f8f1e3; --side: #f1e8d6; --ink: #433422; --muted: #85755c; --line: #e6dac3; --accent: #a8691f; --hover: rgba(90,60,20,.06); --soft: #efe4cc; --danger: #b23a2a; --chip: #ebdfc6; --mark: rgba(181,118,42,.2); --shadow: 0 12px 40px rgba(70,45,10,.18); --s0: #b3a68e; --s1: #c9822a; --s2: #5b7fa8; --s3: #5f8f4e; --heat: 168,105,31; color-scheme: light }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.mockbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 7px 16px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.mockbar b { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { padding: 3px 9px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.app { flex: 1; display: flex; min-height: 0; position: relative; }
aside { width: 250px; flex: none; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px 24px; display: flex; flex-direction: column; gap: 2px; }
.navbtn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 8px; border-radius: 6px; }
.navbtn:hover { background: var(--hover); }
.navbtn.on { background: var(--hover); font-weight: 600; }
.navbtn .n { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.navbtn .ic { width: 16px; text-align: center; color: var(--muted); }
.navbtn.sub { padding-left: 26px; }
.sect { margin: 14px 8px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.brand { font-weight: 700; padding: 6px 8px 10px; }
.menubtn { display: none; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; }

main { flex: 1; min-width: 0; overflow-y: auto; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 80px; }
.crumbs { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
h1 { font-size: 30px; margin: 0 0 12px; letter-spacing: -.01em; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tab { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.later { font-size: 10px; padding: 0 5px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-left: 4px; font-weight: 400; vertical-align: 1px; }
.tab-more { margin-left: auto; color: var(--muted); padding: 8px 10px; }

.dbhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.dbname { font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.dbname small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.vtabs { display: inline-flex; gap: 2px; background: var(--chip); padding: 3px; border-radius: 9px; flex-wrap: wrap; }
.vtabs button { padding: 3px 10px; border-radius: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.vtabs button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.vtabs button:disabled { opacity: .55; cursor: default; }
.grow { flex: 1; }
.btn { padding: 5px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.link { color: var(--accent); }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* Dashboard */
.dash { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.w { border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; position: relative; }
.w h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.w h3 button { color: var(--muted); font-weight: 400; font-size: 12px; opacity: 0; }
.w:hover h3 button, .w h3 button:focus-visible { opacity: 1; }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w5 { grid-column: span 5; } .w7 { grid-column: span 7; } .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
.tile .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tile .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.tile .up { color: var(--s3); }
svg text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 130px) 1fr 28px; gap: 8px; align-items: center; font-size: 12.5px; margin: 6px 0; }
.bar-row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .track { display: block; height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.bar-row .fill { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bar-row .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog { height: 12px; background: var(--chip); border-radius: 6px; overflow: hidden; display: flex; }
.prog span { height: 100%; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--chip); }

/* Table */
.tablewrap { border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13.5px; }
th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; text-align: left; white-space: nowrap; }
th:last-child, td:last-child { border-right: 0; }
tr:last-child td { border-bottom: 0; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; background: var(--soft); }
th > div, td > div { padding: 7px 10px; display: flex; align-items: center; gap: 6px; min-height: 20px; }
th .ty { font-family: var(--mono); font-size: 11px; opacity: .8; }
.auto { font-size: 10px; color: var(--accent); background: var(--mark); border-radius: 4px; padding: 0 4px; }
td input { border: 0; background: transparent; outline: 0; width: 100%; padding: 0; }
td:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.rowopen { opacity: 0; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-left: auto; }
tr:hover .rowopen, .rowopen:focus-visible { opacity: 1; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: color-mix(in srgb, var(--c) 18%, var(--bg)); color: var(--ink); }
.chip.dotc::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 5px; vertical-align: 1px; }
.stars button { color: var(--line); font-size: 15px; line-height: 1; padding: 0 1px; }
.stars button.on { color: var(--s1); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.addrow { display: block; width: 100%; text-align: left; padding: 7px 10px; color: var(--muted); border-top: 1px solid var(--line); }
.addrow:hover { background: var(--hover); color: var(--ink); }
.addcol { color: var(--muted); }
.colh { display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 10px; color: inherit; font: inherit; text-align: left; }
.colh:hover, .colh[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
.colh .ind { margin-left: auto; color: var(--accent); font-size: 11px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 0 10px; font-size: 12.5px; }
.fchip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 4px 2px 10px; border-radius: 999px; background: var(--mark); color: var(--ink); }
.fchip button { color: var(--muted); padding: 0 5px; }
.menu .mi.on::after { content: "✓"; margin-left: auto; color: var(--accent); }
.menu label.mi { cursor: pointer; align-items: center; }
.menu .mi input { margin: 0; }
.menu .hint { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 6px 8px 4px; max-width: 290px; }
.menu .hint b { color: var(--ink); font-weight: 500; }
.info { color: var(--muted); font-size: 12px; cursor: help; }
.menu { position: absolute; z-index: 30; min-width: 240px; max-width: min(320px, 90vw); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; }
.menu .mh { font-size: 11px; color: var(--muted); padding: 6px 8px 2px; text-transform: uppercase; letter-spacing: .05em; }
.menu .mi { display: flex; gap: 10px; width: 100%; box-sizing: border-box; text-align: left; padding: 6px 8px; border-radius: 6px; align-items: baseline; }
.menu .mi:hover { background: var(--hover); }
.menu .mi .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 22px; flex: none; }
.menu .mi small { color: var(--muted); display: block; font-size: 11.5px; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--soft); border-radius: 12px; padding: 10px; min-height: 160px; }
.col.over { box-shadow: inset 0 0 0 2px var(--accent); }
.col h4 { margin: 2px 4px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.col h4 .n { color: var(--muted); font-weight: 400; }
.bcard { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-bottom: 8px; cursor: grab; }
.bcard .t { font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 6px; }
.bcard .m { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.pick { position: relative; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.pick .caret { color: var(--muted); font-size: 10px; }
.bcard .moveto { display: none; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; margin-top: 6px; color: var(--muted); }
.pin { font-size: 11px; color: var(--s1); }

/* Panels and dialogs */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 40; display: flex; justify-content: flex-end; }
.scrim.center { justify-content: center; align-items: flex-start; padding: 10vh 16px 16px; }
.panel { width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; padding: 22px 22px 60px; box-sizing: border-box; }
.dialog { width: 100%; max-width: 560px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; box-sizing: border-box; }
.dialog h2, .panel h2 { margin: 0 0 4px; font-size: 20px; }
.props { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; margin: 16px 0 20px; font-size: 13.5px; align-items: center; }
.props .k { color: var(--muted); }
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.tpl { border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: left; }
.tpl:hover { border-color: var(--accent); }
.tpl b { display: block; margin-bottom: 3px; }
.tpl small { color: var(--muted); line-height: 1.4; display: block; }
.fx { font-family: var(--mono); background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
.ex { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.ex:hover { background: var(--hover); }
.ex code { font-family: var(--mono); font-size: 12px; }

/* Notes, cards, revise */
.list { border: 1px solid var(--line); border-radius: 10px; }
.li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; box-sizing: border-box; }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--hover); }
.li .r { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.doc p { line-height: 1.65; }
.embed { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 16px 0; }
.embed .eh { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.embed .eh b { color: var(--ink); }
.mark { border-radius: 4px; padding: 1px 3px; }
.mk-key { background: color-mix(in srgb, var(--s1) 22%, var(--bg)); }
.mk-word { background: color-mix(in srgb, var(--s2) 18%, var(--bg)); }
.mk-must { background: color-mix(in srgb, var(--danger) 16%, var(--bg)); }
.sheet { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.sheet h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.sheet ul { margin: 6px 0; padding-left: 18px; line-height: 1.7; }
.lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-right: 6px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .w3 { grid-column: span 6; } .w4, .w5, .w7, .w8 { grid-column: span 12; }
}
@media (max-width: 760px) {
  aside { position: absolute; inset: 0 auto 0 0; z-index: 35; box-shadow: var(--shadow); }
  aside:not(.open) { display: none; }
  .menubtn { display: inline-block; }
  .wrap { padding-top: 16px; }
  h1 { font-size: 24px; }
  .props { grid-template-columns: 1fr; gap: 2px; }
  .props .k { margin-top: 8px; }
  .bcard .moveto { display: inline-block; }
}
</style>
</head>

<div class="mockbar">
  <b>Phase 5 mockup</b> <span>Fake data · nothing is saved · try editing the Table, dragging on the Board</span>
  <span class="seg" role="group" aria-label="Theme">
    <button data-theme="day" aria-pressed="true">Day</button><button data-theme="night">Night</button><button data-theme="sepia">Sepia</button>
  </span>
</div>
<div class="app">
  <aside id="side"></aside>

<script>
const TODAY = new Date('2026-10-27');
const STATUSES = ['Not started', 'Learning', 'Review', 'Mastered'];
const SCOL = { 'Not started': 'var(--s0)', Learning: 'var(--s1)', Review: 'var(--s2)', Mastered: 'var(--s3)' };

const lessons = [
  { name: 'Heart sounds', conf: 5, last: '2026-10-25', due: 0, pct: 94, cards: 18, exam: '2026-11-20' },
  { name: 'ECG basics', conf: 3, last: '2026-10-26', due: 6, pct: 71, cards: 24, exam: '2026-11-20' },
  { name: 'Heart failure', conf: 4, last: '2026-10-22', due: 3, pct: 82, cards: 15, exam: '2026-11-20' },
  { name: 'Arrhythmias', conf: 2, last: '2026-10-24', due: 5, pct: 58, cards: 21, exam: '2026-11-20' },
  { name: 'Valve disease', conf: 0, last: '', due: 0, pct: null, cards: 0, exam: '2026-12-04' },
  { name: 'Hypertension', conf: 4, last: '2026-10-20', due: 0, pct: 91, cards: 12, exam: '2026-12-04' },
];
// Status is filled in by the app unless the user sets it (Board drag / Table pick).
const autoStatus = (l) => l.pct == null ? 'Not started' : l.pct < 75 ? 'Learning' : l.pct >= 90 && !l.due ? 'Mastered' : 'Review';
const status = (l) => l.statusSet || autoStatus(l);
const daysSince = (d) => d ? Math.round((TODAY - new Date(d)) / 864e5) : null;
const daysTo = (d) => d ? Math.round((new Date(d) - TODAY) / 864e5) : null;
const fmt = (d) => d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '—';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const state = { screen: 'notebook', tab: 'database', view: 'dashboard', extraCols: [], sort: null, filters: {}, cardSort: 'due', menu: null };
const AUTO_HINT = '<b>How Auto decides</b> (from your reviews of this lesson\'s cards):<br>• <b>Not started</b>: no reviews yet<br>• <b>Learning</b>: under 75% correct<br>• <b>Mastered</b>: 90% or more correct and no cards due<br>• <b>Review</b>: everything in between<br>Pick a status yourself (📌) to override it; "Auto" hands it back.';

// Table columns: how each sorts and which filters it offers.
const COLS = [
  { k: 'name', label: 'Lesson', ty: '↗', auto: 1, val: (l) => l.name.toLowerCase(), filters: [['started', 'Has reviews', (l) => l.pct != null]] },
  { k: 'status', label: 'Status', ty: '◉', auto: 1, val: (l) => STATUSES.indexOf(status(l)), multi: STATUSES },
  { k: 'conf', label: 'Confidence', ty: '★', val: (l) => l.conf, filters: [['c3', '★★★ or more', (l) => l.conf >= 3], ['c0', 'Not rated', (l) => !l.conf]] },
  { k: 'last', label: 'Last revised', ty: '▣', auto: 1, val: (l) => l.last || '', filters: [['old', 'Over 5 days ago', (l) => (daysSince(l.last) ?? 99) > 5], ['never', 'Never', (l) => !l.last]] },
  { k: 'due', label: 'Cards due', ty: '#', auto: 1, val: (l) => l.due, filters: [['hasdue', 'Has cards due', (l) => l.due > 0]] },

/* ---------- Charts (own SVG/CSS, like the real app will do) ---------- */
function donut(parts) {
  const total = parts.reduce((s, p) => s + p.v, 0) || 1;
  const r = 52, C = 2 * Math.PI * r;
  let off = 0;
  const arcs = parts.filter((p) => p.v).map((p) => {
    const len = (p.v / total) * C;
    const a = `<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len - 2} ${C - len + 2}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${p.k}: ${p.v}</title></circle>`;
    off += len;
    return a;
  }).join('');
  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Lessons by status">${arcs}
      <text x="70" y="68" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--ink)">${total}</text>
      <text x="70" y="86" text-anchor="middle">lessons</text></svg>
    <div class="legend" style="flex-direction:column">${parts.map((p) => `<span><i style="background:${p.c}"></i>${p.k} · ${p.v}</span>`).join('')}</div></div>`;
}
function bars(items, max) {
  return items.map((it) => `<div class="bar-row"><span class="lbl" title="${esc(it.k)}">${esc(it.k)}</span>
    <span class="track"><span class="fill" style="width:${max ? (it.v / max) * 100 : 0}%;background:${it.c || 'var(--accent)'}"></span></span><span class="v">${it.v}</span></div>`).join('');
}
function line(points, labels) {
  const W = 420, H = 150, p = 26, min = 40, max = 100;
  const x = (i) => p + (i * (W - 2 * p)) / (points.length - 1);
  const y = (v) => H - p - ((v - min) / (max - min)) * (H - 2 * p);
  const d = points.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
  const grid = [50, 75, 100].map((g) => `<line x1="${p}" x2="${W - p}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${p - 6}" y="${y(g) + 4}" text-anchor="end">${g}</text>`).join('');
  const dots = points.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"><title>${labels[i]}: ${v}%</title></circle>`).join('');
  const xl = labels.map((l, i) => i % 2 ? '' : `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Percent correct per week">${grid}
    <path d="${d} L${x(points.length - 1)},${y(min)} L${x(0)},${y(min)} Z" fill="var(--mark)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}
function heat() {
  let s = 7, out = '';
  for (let i = 0; i < 7 * 18; i++) {
    s = (s * 9301 + 49297) % 233280;
    const r = s / 233280, v = i > 7 * 18 - 4 ? 0 : r < .25 ? 0 : r < .5 ? .3 : r < .75 ? .6 : 1;
    out += `<i style="background:${v ? `rgba(var(--heat),${v})` : 'var(--chip)'}" title="${v ? Math.round(v * 40) + ' reviews' : 'no reviews'}"></i>`;
  }
  return `<div class="heat">${out}</div><div class="legend"><span>Less</span>${[0, .3, .6, 1].map((v) => `<i style="background:${v ? `rgba(var(--heat),${v})` : 'var(--chip)'}"></i>`).join('')}<span>More</span><span style="margin-left:auto">🔥 Streak: 4 days</span></div>`;
}

function closeLayer() { layer.innerHTML = ''; if (state.menu) { state.menu = null; render(); } }
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.append(el);
  setTimeout(() => el.remove(), 2600);
}
function openRow(i) {
  const l = lessons[i];
  layer.innerHTML = `<div class="scrim" data-act="close"><div class="panel" role="dialog" aria-label="${esc(l.name)}">
    <div class="crumbs">Cardiology › Study tracker</div><h2>${esc(l.name)}</h2>
    <div class="props">
      <span class="k">Status <span class="auto">auto</span> <span class="info" title="Auto: Not started = no reviews · Learning = under 75% correct · Mastered = 90%+ and nothing due · Review = in between">ⓘ</span></span><span><span class="chip dotc" style="--c:${SCOL[status(l)]}">${status(l)}</span> ${l.statusSet ? '<button class="link" data-act="reset" data-i="' + i + '">Back to auto</button>' : ''}</span>
      <span class="k">Confidence</span><span>${stars(i, l.conf)}</span>
      <span class="k">Last revised <span class="auto">auto</span></span><span>${fmt(l.last)}</span>
      <span class="k">Cards due <span class="auto">auto</span></span><span>${l.due} of ${l.cards}</span>
      <span class="k">% correct <span class="auto">auto</span></span><span>${l.pct == null ? '—' : l.pct + '%'}</span>
      <span class="k">Exam date</span><span>${fmt(l.exam)}</span>
      <span class="k">Lesson</span><span class="link">📄 ${esc(l.name)} (note)</span>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:12px" class="doc">
      <p class="note">This is the row's own page: write anything here. Cards, links, tags and "/" all work like in any note.</p>
      <p>Weak spots: ${l.pct != null && l.pct < 75 ? 'I keep mixing up the rhythms; redo the practice set.' : 'Nothing yet.'}</p></div>
    <button class="btn" data-act="close" style="margin-top:12px">Close</button></div></div>`;
}
function menuAt(btn, html) {
  const r = btn.getBoundingClientRect();
  layer.innerHTML = `<div class="scrim center" data-act="close" style="background:transparent;padding:0"><div class="menu" style="top:${Math.min(r.bottom + 4, innerHeight - 380)}px;left:${Math.max(8, Math.min(r.left, innerWidth - 330))}px">${html}</div></div>`;
}
function statusMenu(btn, i) {
  const l = lessons[i], cur = l.statusSet;
  menuAt(btn, `<div class="mh">Status</div>
    <button class="mi ${cur ? '' : 'on'}" data-act="setstatus" data-i="${i}" data-s=""><span class="ty">⟲</span><span>Auto<small>now: ${autoStatus(l)}</small></span></button>
    <div class="sep"></div>
    ${STATUSES.map((s) => `<button class="mi ${cur === s ? 'on' : ''}" data-act="setstatus" data-i="${i}" data-s="${s}"><span class="ty">📌</span><span class="chip dotc" style="--c:${SCOL[s]}">${s}</span></button>`).join('')}
    <div class="sep"></div><div class="hint">${AUTO_HINT}</div>`);
}
function headMenu(k) {
  const c = colOf(k), btn = document.querySelector(`.colh[data-c="${k}"]`), f = state.filters[k];
  const s = state.sort?.k === k ? state.sort.dir : 0;
  const isNum = ['conf', 'due', 'pct', 'since'].includes(k), isDate = ['last', 'exam'].includes(k);
  const [up, down] = isNum ? ['Low → high', 'High → low'] : isDate ? ['Oldest first', 'Newest first'] : k === 'status' ? ['Not started → Mastered', 'Mastered → Not started'] : ['A → Z', 'Z → A'];
  const filt = c.multi
    ? c.multi.map((x) => `<label class="mi"><input type="checkbox" data-act="filtmulti" data-c="${k}" data-v="${x}" ${!f || f.includes(x) ? 'checked' : ''}><span class="chip dotc" style="--c:${SCOL[x]}">${x}</span></label>`).join('')
    : c.filters.map((x) => `<button class="mi ${f === x[0] ? 'on' : ''}" data-act="filt" data-c="${k}" data-v="${x[0]}"><span class="ty">⏷</span><span>${x[1]}</span></button>`).join('');
  menuAt(btn, `<div class="mh">Sort</div>
    <button class="mi ${s > 0 ? 'on' : ''}" data-act="sort" data-c="${k}" data-d="1"><span class="ty">↑</span><span>${up}</span></button>
    <button class="mi ${s < 0 ? 'on' : ''}" data-act="sort" data-c="${k}" data-d="-1"><span class="ty">↓</span><span>${down}</span></button>
    <div class="sep"></div><div class="mh">Filter</div>${filt}
    ${f ? `<button class="mi" data-act="unfilter" data-c="${k}"><span class="ty">×</span><span>Clear filter</span></button>` : ''}
    <div class="sep"></div>
    <button class="mi" data-act="toast" data-msg="Hide column (show it again from the view's options)"><span class="ty">◌</span><span>Hide column</span></button>
    ${c.auto ? '' : '<button class="mi" data-act="toast" data-msg="Rename, change type, or delete this column"><span class="ty">✎</span><span>Edit column</span></button>'}
    ${k === 'status' ? `<div class="sep"></div><div class="hint">${AUTO_HINT}</div>` : ''}`);
}
function cardSortMenu(btn) {
  menuAt(btn, `<div class="mh">Sort cards</div>${Object.entries(CARD_SORTS).map(([k, v]) => `<button class="mi ${state.cardSort === k ? 'on' : ''}" data-act="setcardsort" data-v="${k}"><span class="ty">↕</span><span>${v}</span></button>`).join('')}`);
}
function colMenu(btn, more) {
  const basic = [['T', 'Text'], ['#', 'Number', '%, ₹/$ or ★ rating'], ['▣', 'Date'], ['◉', 'Choice', 'pick one, coloured pill'], ['◎', 'Choices', 'pick several'], ['☑', 'Checkbox'], ['🔗', 'Web link'], ['#', 'Tag', 'your #tags'], ['↗', 'Note link', 'points to a page']];
  const adv = [['ƒ', 'Formula', 'calculate from other columns'], ['⇄', 'Relation', 'link rows to another database'], ['Σ', 'Rollup', 'count or total across a relation']];
  const mi = (c) => `<button class="mi" data-act="pickcol" data-n="${c[1]}" data-ic="${c[0]}"><span class="ty">${c[0]}</span><span>${c[1]}${c[2] ? `<small>${c[2]}</small>` : ''}</span></button>`;
  menuAt(btn, `<div class="mh">Column type</div>${basic.map(mi).join('')}<div class="sep"></div>
    ${more ? `<div class="mh">More types</div>${adv.map(mi).join('')}` : '<button class="mi" data-act="moretypes"><span class="ty">›</span><span>More types<small>Formula, Relation, Rollup</small></span></button>'}`);
}
function formulaDialog() {
  layer.innerHTML = `<div class="scrim center" data-act="close"><div class="dialog" role="dialog" aria-label="Formula">
    <h2>New Formula column</h2><p class="note">Type a formula, or click an example. Columns go in [brackets].</p>
    <input class="fx" id="fx" value="DAYS([Exam date], TODAY())" aria-label="Formula">
    <p class="note" id="fxout">Preview (Heart sounds): <b>24</b></p>
    <div class="mh" style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:8px">Examples</div>
    <button class="ex" data-act="fx" data-f="DAYS([Exam date], TODAY())"><code>DAYS([Exam date], TODAY())</code> · days until the exam</button>
    <button class="ex" data-act="fx" data-f='IF([% correct] < 75, "Redo", "OK")'><code>IF([% correct] &lt; 75, "Redo", "OK")</code> · a label</button>
    <button class="ex" data-act="fx" data-f="[Cards due] * 1.5"><code>[Cards due] * 1.5</code> · minutes needed</button>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="addfx">Add column</button></div></div></div>`;
}
function fxPreview(f) {
  const l = lessons[0];
  const v = f.startsWith('DAYS([Exam') ? daysTo(l.exam) : f.startsWith('IF') ? (l.pct < 75 ? 'Redo' : 'OK') : f.startsWith('[Cards due]') ? l.due * 1.5 : '…';
  document.getElementById('fxout').innerHTML = `Preview (Heart sounds): <b>${v}</b>`;
}
function newDbDialog() {
  const t = [['◔ Study tracker', 'Lessons with progress that fills itself'], ['💊 Drug list', 'Drug, class, dose, side effects, treats →'], ['🔤 Vocabulary', 'Word, meaning, example; makes cards'], ['📚 Books', 'Gallery with covers, rating, status'], ['✓ Habits', 'Calendar with a daily tick and streak'], ['▢ Blank', 'Start with two columns']];
  layer.innerHTML = `<div class="scrim center" data-act="close"><div class="dialog" role="dialog" aria-label="New database">
    <h2>New database</h2><p class="note">Pick a starting point. Every column and view can be changed later.</p>
    <div class="tpls">${t.map((x) => `<button class="tpl" data-act="close" data-msg="Created: ${x[0].slice(2)}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div>
    <p class="note" style="margin-bottom:0">Where: <b>${state.screen === 'all' ? 'Not in a notebook' : 'Cardiology'}</b> <button class="link">change</button> · Import CSV or a database file <span class="later">5B</span></p></div></div>`;
}
function chartMenu(btn) {
  menuAt(btn, `<div class="mh">Chart type</div>${['Number tile', 'Bar', 'Line', 'Donut', 'Progress', 'Heatmap calendar'].map((c) => `<button class="mi" data-act="close" data-msg="Switched to ${c}"><span class="ty">◔</span><span>${c}</span></button>`).join('')}
    <div class="sep"></div><div class="mh">Data</div><button class="mi" data-act="close"><span class="ty">≡</span><span>Group by<small>Status</small></span></button><button class="mi" data-act="close"><span class="ty">Σ</span><span>Show<small>Count of rows</small></span></button>`);
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act], [data-theme]');
  if (!el) return;
  if (el.dataset.theme) {
    document.body.className = 't-' + el.dataset.theme;
    document.querySelectorAll('[data-theme]').forEach((b) => b.setAttribute('aria-pressed', b === el));
    return;
  }
  const a = el.dataset.act, i = +el.dataset.i;
  if (a === 'close') { if (e.target !== el && el.classList.contains('scrim')) return; closeLayer(); if (el.dataset.msg) toast(el.dataset.msg); return; }
  if (el.dataset.msg && a === 'toast') return toast(el.dataset.msg);
  if (a === 'menu') return side.classList.toggle('open');
  // Menus stay open until something is picked (or Esc / a click outside).
  const done = () => { state.menu = null; layer.innerHTML = ''; render(); };
  if (a === 'statusmenu') return statusMenu(el, i);
  if (a === 'setstatus') { const l = lessons[i]; if (el.dataset.s) l.statusSet = el.dataset.s; else delete l.statusSet; if (document.querySelector('.panel')) return openRow(i); done(); return toast(el.dataset.s ? 'Status set by you 📌' : 'Status back to Auto'); }
  if (a === 'colmenu') { state.menu = el.dataset.c; render(); return headMenu(state.menu); }
  if (a === 'sort') { state.sort = { k: el.dataset.c, dir: +el.dataset.d }; return done(); }
  if (a === 'filt') { state.filters[el.dataset.c] = el.dataset.v; return done(); }
  if (a === 'filtmulti') {
    const k = el.dataset.c, picked = [...layer.querySelectorAll('[data-act="filtmulti"]:checked')].map((x) => x.dataset.v);
    if (picked.length === STATUSES.length) delete state.filters[k]; else state.filters[k] = picked;
    render(); return headMenu(k); // ticking keeps the menu open
  }
  if (a === 'unfilter') { delete state.filters[el.dataset.c]; return done(); }
  if (a === 'unsort') { state.sort = null; return render(); }
  if (a === 'clearall') { state.sort = null; state.filters = {}; return render(); }
  if (a === 'cardsort') return cardSortMenu(el);
  if (a === 'setcardsort') { state.cardSort = el.dataset.v; return done(); }
  side.classList.remove('open');
  if (a === 'nb' || a === 'gotracker') { Object.assign(state, { screen: 'notebook', tab: 'database', view: 'dashboard' }); }
  else if (a === 'all') state.screen = 'all';
  else if (a === 'allcards') state.screen = 'cards';
  else if (a === 'note') state.screen = 'note';
  else if (a === 'tab') state.tab = el.dataset.t;
  else if (a === 'view') state.view = el.dataset.v;
  else if (a === 'star') { lessons[i].conf = lessons[i].conf === +el.dataset.s ? 0 : +el.dataset.s; if (layer.innerHTML) openRow(i); }
  else if (a === 'open') return openRow(i);
  else if (a === 'reset') { delete lessons[i].statusSet; openRow(i); }
  else if (a === 'addrow') { lessons.push({ name: 'New lesson ' + (lessons.length + 1), conf: 0, last: '', due: 0, pct: null, cards: 0, exam: '' }); toast('New row = a new lesson page in Notes'); }
  else if (a === 'addcol') return colMenu(el, false);
  else if (a === 'moretypes') return colMenu(document.querySelector('.addcol'), true);
  else if (a === 'pickcol') { if (el.dataset.n === 'Formula') return formulaDialog(); state.extraCols.push({ name: el.dataset.n, icon: el.dataset.ic }); closeLayer(); }
  else if (a === 'fx') { document.getElementById('fx').value = el.dataset.f; return fxPreview(el.dataset.f); }
  else if (a === 'addfx') { state.extraCols.push({ name: 'Formula', icon: 'ƒ' }); closeLayer(); toast('Formula column added'); }
  else if (a === 'newdb') return newDbDialog();
  else if (a === 'chartmenu') return chartMenu(el);
  else if (a === 'addchart') return toast('+ Add chart: pick a type, then what to count or total');
  render();
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.act === 'exam') lessons[+el.dataset.i].exam = el.value;
});
document.addEventListener('input', (e) => { if (e.target.id === 'fx') fxPreview(e.target.value); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLayer(); });
// Board drag and drop
document.addEventListener('dragstart', (e) => { const c = e.target.closest?.('.bcard'); if (c) e.dataTransfer.setData('text/plain', c.dataset.i); });
document.addEventListener('dragover', (e) => { const col = e.target.closest?.('.col'); if (col) { e.preventDefault(); col.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { const col = e.target.closest?.('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', (e) => {
  const col = e.target.closest?.('.col'); if (!col) return;
  e.preventDefault();
  const l = lessons[+e.dataTransfer.getData('text/plain')];
  if (col.dataset.col === autoStatus(l)) delete l.statusSet; else l.statusSet = col.dataset.col;
  render();
});

// Phone: a menu button for the sidebar.
const mb = document.createElement('button'); mb.className = 'menubtn'; mb.dataset.act = 'menu'; mb.textContent = '☰ Menu';
document.querySelector('.mockbar').prepend(mb);
render();
</script>
</body>
</html>
